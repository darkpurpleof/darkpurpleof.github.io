<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; width: 100%; overflow-x: hidden; }
img { max-width: 100%; display: block; }

/* ---------- Material You tokens ---------- */
:root{
  /* Dynamic-color-inspired tonal palette (seed: purple) */
  --md-primary: #d6bbff;
  --md-on-primary: #43006c;
  --md-primary-container: #5a2a86;
  --md-on-primary-container: #efdbff;

  --md-secondary: #cbc2db;
  --md-on-secondary-container: #e8def8;

  --md-surface: #141218;
  --md-surface-dim: #0f0d12;
  --md-surface-bright: #302c37;
  --md-surface-container-lowest: #0d0b10;
  --md-surface-container-low: #1d1b20;
  --md-surface-container: #211f26;
  --md-surface-container-high: #2b2930;
  --md-surface-container-highest: #36343b;

  --md-on-surface: #e6e0e9;
  --md-on-surface-variant: #cac4d0;
  --md-outline: #948f99;
  --md-outline-variant: #49454f;

  --md-error: #ffb4ab;
  --md-tertiary: #efb8c8;

  --green: #9ccc65;
  --red: #ffb4ab;

  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 28px;
  --radius-full: 999px;

  --elev-1: 0 1px 2px rgba(0,0,0,0.30), 0 1px 3px 1px rgba(0,0,0,0.15);
  --elev-2: 0 1px 2px rgba(0,0,0,0.30), 0 2px 6px 2px rgba(0,0,0,0.15);

  /* legacy aliases kept for any external references */
  --bg: var(--md-surface);
  --card: var(--md-surface-container);
  --muted: var(--md-on-surface-variant);
  --accent: var(--md-primary);
  --accent-strong: var(--md-primary-container);
  --text: var(--md-on-surface);
  --border: var(--md-outline-variant);
  --purple: var(--md-primary);
  --field-bg: var(--md-surface-container-high);
  --field-text: var(--md-on-surface);
}

body {
  margin:0;
  font-family: "Google Sans Text", Roboto, Inter, system-ui, sans-serif;
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(214,187,255,0.08), transparent 60%),
    radial-gradient(900px 500px at -10% 20%, rgba(239,184,200,0.05), transparent 55%),
    var(--md-surface-dim);
  color: var(--md-on-surface);
  letter-spacing: 0.1px;
}

dp-topbar {
  position: sticky;
  top: 0;
  z-index: 100;
}

main.container{
  max-width: 1000px;
  margin: 0 auto;
  padding: 28px 16px 64px 16px;
}

/* ---------- Header ---------- */
.page-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  background: var(--md-surface-container-low);
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--radius-xl);
  padding: 20px 24px;
  box-shadow: var(--elev-1);
}

.page-header h1{
  font-size: 24px;
  font-weight: 500;
  margin: 0 0 8px 0;
  color: var(--md-on-surface);
  letter-spacing: 0;
}

.user-name{
  font-size: 14px;
  font-weight: 500;
  color: var(--md-on-surface-variant);
  margin: 0 0 6px 0;
}

.balance-line{
  font-size: 15px;
  color: var(--md-on-surface);
  display:flex;
  align-items:center;
  gap:8px;
  font-weight: 500;
}

#balance-amount{
  color: var(--md-primary);
  font-weight: 700;
}

.coin-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:3px 10px;
  border-radius: var(--radius-full);
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  font-size:11px;
  font-weight:700;
  line-height:1.6;
}

.topup-btn{
  background: var(--md-primary);
  color: var(--md-on-primary);
  border:none;
  border-radius: var(--radius-full);
  padding: 14px 24px;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor:pointer;
  white-space:nowrap;
  box-shadow: var(--elev-1);
  transition: box-shadow 160ms ease, transform 120ms ease, background-color 160ms ease;
}
.topup-btn::before{
  content: "+";
  display:inline-block;
  margin-right: 6px;
  font-weight: 700;
}
.topup-btn:hover{
  box-shadow: var(--elev-2);
  background: #e2ccff;
}
.topup-btn:active{ transform: scale(0.97); }

/* ---------- Filters ---------- */
.filters{
  display:flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 24px;
}

.field{
  display:flex;
  flex-direction: column;
  gap: 6px;
  min-width: 170px;
}

.field label{
  font-size: 12px;
  font-weight: 500;
  color: var(--md-on-surface-variant);
  padding-left: 4px;
}

.field select,
.field input[type="text"]{
  background: var(--md-surface-container-high);
  color: var(--md-on-surface);
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--radius-full);
  padding: 12px 16px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  min-width: 170px;
  appearance: none;
  -webkit-appearance: none;
  transition: border-color 140ms ease, background-color 140ms ease, box-shadow 140ms ease;
}

.field select{
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none'><path d='M6 9l6 6 6-6' stroke='%23cac4d0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 14px center;
  padding-right: 38px;
}

.field select:hover,
.field input:hover{
  background-color: var(--md-surface-container-highest);
}

.field select:focus,
.field input:focus{
  border-color: var(--md-primary);
  box-shadow: 0 0 0 3px rgba(214,187,255,0.18);
}

.field.search{ flex:1 1 240px; }
.field.search input{ width:100%; min-width: 0; }

/* ---------- Table ---------- */
.result-count{
  color: var(--md-on-surface-variant);
  font-size: 12px;
  font-weight: 500;
  margin: 0 0 10px 4px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.table-header, .row {
  display:flex;
  padding:16px 20px;
  align-items:center;
  gap: 8px;
}

.table-header {
  color: var(--md-on-surface-variant);
  font-size:12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  padding: 0 20px 10px 20px;
}

#transactions{
  display:flex;
  flex-direction: column;
  gap: 8px;
}

.row{
  background: var(--md-surface-container-low);
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--radius-lg);
  transition: background-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
}

.row:hover{
  background: var(--md-surface-container);
  box-shadow: var(--elev-1);
}

.col { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.col.source { flex:2; display:flex; align-items:center; gap:10px; cursor:pointer; border-radius: var(--radius-full); }
.col.desc { flex:3; display:flex; align-items:center; gap:12px; white-space: normal; }
.col.amount{ text-align:right; flex:1; font-weight:700; font-variant-numeric: tabular-nums; }
.col.amount.in{ color: #9ccc65; }
.col.amount.out{ color: var(--md-error); }

.desc-text{ display:flex; flex-direction:column; overflow:hidden; gap: 2px; }
.desc-title{ color: var(--md-on-surface); font-weight: 500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.desc-sub{ color: var(--md-on-surface-variant); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.pfp {
  width:32px;
  height:32px;
  border-radius:50%;
  background-size:cover;
  background-position:center;
  background-color: var(--md-surface-container-highest);
  flex-shrink:0;
  border: 1px solid var(--md-outline-variant);
}

.item-img {
  width:36px;
  height:36px;
  border-radius: var(--radius-sm);
  background-size:cover;
  background-position:center;
  background-color: var(--md-surface-container-highest);
  flex-shrink:0;
}

.verified {
  width:13px;
  height:13px;
  flex-shrink:0;
}

.empty-state{
  padding: 56px 12px;
  text-align:center;
  color: var(--md-on-surface-variant);
  background: var(--md-surface-container-low);
  border: 1px dashed var(--md-outline-variant);
  border-radius: var(--radius-lg);
  font-size: 14px;
}

/* ---------- Resumen view ---------- */
.summary-section{
  margin-bottom: 20px;
  background: var(--md-surface-container-low);
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--radius-lg);
  padding: 8px 20px 4px 20px;
  box-shadow: var(--elev-1);
}

.summary-section h3{
  font-size: 14px;
  font-weight: 600;
  margin: 12px 0 4px 0;
  color: var(--md-on-surface);
}

.summary-row{
  display:flex;
  justify-content: space-between;
  padding: 12px 4px;
  border-bottom: 1px solid var(--md-outline-variant);
  font-size: 14px;
}

.summary-row:last-child{ border-bottom: none; }

.summary-row.total{
  font-weight: 700;
}

.summary-row .label{ color: var(--md-on-surface); }
.summary-row .value{ color: var(--md-on-surface-variant); font-variant-numeric: tabular-nums; }
.summary-row.total .value{ color: var(--md-primary); }

.summary-head{
  display:flex;
  justify-content: space-between;
  padding: 6px 4px;
  color: var(--md-on-surface-variant);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  border-bottom: 1px solid var(--md-outline-variant);
}

#summary-view h2{
  font-weight: 500;
  color: var(--md-on-surface);
}

/* Diseño para móviles */
@media (max-width: 768px) {
  body { font-size: 16px; }

  main.container{ padding: 16px 12px 48px 12px; }

  .page-header{ padding: 18px; border-radius: var(--radius-lg); }

  .table-header { display: none; }

  .row {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 18px;
  }

  .col { width: 100%; flex: none; padding: 0; white-space: normal; font-size: 14px; }
  .col.source, .col.desc, .col.amount { flex: none; }
  .col.amount{ text-align:left; }

  .page-header h1{ font-size: 22px; }

  .field, .field select, .field input{ min-width: 0; }
  .field{ flex: 1 1 100%; }

  .topup-btn{ width: 100%; text-align: center; }
}
</style>
</head>

      <div id="summary-out"></div>
    </div>
  </div>

</main>

let currentLang = "en";
let currentUserBetaEnrolled = false;

function normalizeLang(lang) {
  const value = String(lang || "").trim().toLowerCase();
  return SUPPORTED_LANGS.includes(value) ? value : "en";
}

function t(key) {
  const lang = I18N[currentLang] ? currentLang : "en";
  const parts = String(key).split(".");
  let value = I18N[lang];
  for (const part of parts) {
    if (value && Object.prototype.hasOwnProperty.call(value, part)) {
      value = value[part];
    } else {
      value = undefined;
      break;
    }
  }
  if (value === undefined && lang !== "en") {
    value = I18N.en;
    for (const part of parts) {
      if (value && Object.prototype.hasOwnProperty.call(value, part)) {
        value = value[part];
      } else {
        value = undefined;
        break;
      }
    }
  }
  return value === undefined ? key : value;
}

function localizedNumber(n) {
  const num = Number(n) || 0;
  return new Intl.NumberFormat(LOCALE_MAP[currentLang] || LOCALE_MAP.en).format(num);
}

function applyLanguage(lang) {
  currentLang = normalizeLang(lang);
  document.documentElement.lang = currentLang;
  document.title = t("pageTitle");

  const typeSelect = document.getElementById("type-select");
  const pageSizeSelect = document.getElementById("page-size-select");
  const sortSelect = document.getElementById("sort-select");
  const rangeSelect = document.getElementById("range-select");

  document.getElementById("topup-btn").textContent = t("topup");
  document.getElementById("user-name").textContent = document.getElementById("user-name").textContent || t("loading");
  document.querySelector(".balance-line").childNodes[0].textContent = `${t("balancePrefix")} `;
  document.querySelector('label[for="type-select"]').textContent = t("typeLabel");
  typeSelect.options[0].textContent = t("all");
  typeSelect.options[1].textContent = t("purchases");
  typeSelect.options[2].textContent = t("incoming");
  typeSelect.options[3].textContent = t("summary");

  document.querySelector('label[for="page-size-select"]').textContent = t("itemsPerPage");
  pageSizeSelect.options[0].textContent = t("perPage10");
  pageSizeSelect.options[1].textContent = t("perPage25");
  pageSizeSelect.options[2].textContent = t("perPage50");
  pageSizeSelect.options[3].textContent = t("allItems");

  document.querySelector('label[for="sort-select"]').textContent = t("sortBy");
  sortSelect.options[0].textContent = t("mostRecent");
  sortSelect.options[1].textContent = t("oldest");
  sortSelect.options[2].textContent = t("amountHighLow");
  sortSelect.options[3].textContent = t("amountLowHigh");

  document.querySelector('label[for="range-select"]').textContent = t("dateRange");
  rangeSelect.options[0].textContent = t("last7Days");
  rangeSelect.options[1].textContent = t("last30Days");
  rangeSelect.options[2].textContent = t("last90Days");
  rangeSelect.options[3].textContent = t("allTime");

  document.querySelector('label[for="search-input"]').textContent = t("search");
  document.getElementById("search-input").placeholder = t("searchPlaceholder");

  const tableHeaders = document.querySelectorAll(".table-header .col");
  if (tableHeaders[0]) tableHeaders[0].textContent = t("date");
  if (tableHeaders[1]) tableHeaders[1].textContent = t("source");
  if (tableHeaders[2]) tableHeaders[2].textContent = t("description");
  if (tableHeaders[3]) tableHeaders[3].textContent = t("amount");

  const summaryH2 = document.querySelector("#summary-view h2");
  if (summaryH2) summaryH2.textContent = t("summaryTitle");
  const summaryH3 = document.querySelectorAll("#summary-view .summary-section h3");
  if (summaryH3[0]) summaryH3[0].textContent = t("incomingDf");
  if (summaryH3[1]) summaryH3[1].textContent = t("outgoingDf");
  const summaryHeads = document.querySelectorAll("#summary-view .summary-head");
  summaryHeads.forEach(head => {
    const spans = head.querySelectorAll("span");
    if (spans[0]) spans[0].textContent = t("category");
    if (spans[1]) spans[1].textContent = t("amount");
  });

  render();
}

function getCategoryLabel(direction, key) {
  return t(`categories.${direction}.${key}`);
}

function getSummaryCategoryForIncoming(tx) {
  const transType = String(tx.transType || tx.transtype || tx.type || "").trim().toLowerCase();
  if (transType === "coins") return "coin_purchase";
  if (transType === "sales") return "item_sale";
  if (transType === "received") return "transfer_in";
  return "other";
}

function getSummaryCategoryForOutgoing(tx) {
  const transType = String(tx.transType || tx.transtype || tx.type || "").trim().toLowerCase();
  if (transType === "purchased") return "purchase";
  if (transType === "sent") return "transfer_out";
  if (transType === "system") return "system_fee";
  if (transType === "assets") return "asset_upload";
  if (transType === "grounds") return "grounds_content";
  if (transType === "beta") return "beta_program";
  return "purchase";
}

function ensureHttps(url) {
  if (!url) return url;
  url = String(url).trim();
  if (/^(https?:|data:|\/|\.)/i.test(url)) {
    return url;
  }
  return "https://" + url;
}

function formatDate(ts) {
  const d = ts.toDate();
  const locale = LOCALE_MAP[currentLang] || LOCALE_MAP.en;
  return `${d.toLocaleDateString(locale)} ${d.toLocaleTimeString(locale, { hour: "2-digit", minute: "2-digit" })}`;
}

function formatCoins(n) {
  return localizedNumber(n);
}

async function loadUserHeader(user) {
  const userSnap = await db.collection("user_data").doc(user.email).get();
  const userData = userSnap.data() || {};

  if (userData.profile_picture) {
    userData.profile_picture = ensureHttps(userData.profile_picture);
  }

  currentUserBetaEnrolled = !!userData.beta_enrolled;
  applyLanguage(userData.lang || "en");
  document.getElementById("user-name").textContent = userData["display name"] || user.email;
  document.getElementById("balance-amount").textContent = formatCoins(userData.coins);
}

async function loadTransactions(){
  const user = auth.currentUser;
  if(!user) return;

  const snap = await db
    .collection("transactions")
    .doc(user.email)
    .collection("records")
    .get();

  const userCache = {};
  allTransactions = [];

  for(const doc of snap.docs){
    const tx = doc.data();

    if(!userCache[tx.source]){
      const userSnap = await db.collection("user_data").doc(tx.source).get();
      const uData = userSnap.data() || {};
      if (uData.profile_picture) {
        uData.profile_picture = ensureHttps(uData.profile_picture);
      }
      userCache[tx.source] = uData;
    }

    allTransactions.push({
      id: doc.id,
      date: tx.date,
      source: tx.source,
      sourceData: userCache[tx.source],
      description: tx.description,
      context: tx.context || "",
      image: ensureHttps(tx.image),
      type: tx.type,
      amount: Number(tx.amount) || 0,
      category: tx.category || "other",
      transType: tx.transType || tx.transtype || ""
    });
  }

  render();
}

function getFiltered(){
  const search = document.getElementById("search-input").value.trim().toLowerCase();
  const typeVal = document.getElementById("type-select").value;
  const sort = document.getElementById("sort-select").value;

  const activeType = typeVal === "summary" ? "all" : typeVal;

  let filtered = allTransactions.filter(tx => {
    if(activeType !== "all" && tx.type !== activeType) return false;

    if(search){
      const name = (tx.sourceData["display name"] || tx.source || "").toLowerCase();
      const desc = (tx.description || "").toLowerCase();
      if(!name.includes(search) && !desc.includes(search)) return false;
    }

    return true;
  });

  filtered.sort((a, b) => {
    switch(sort){
      case "date-asc": return a.date.toDate() - b.date.toDate();
      case "amount-desc": return b.amount - a.amount;
      case "amount-asc": return a.amount - b.amount;
      case "date-desc":
      default: return b.date.toDate() - a.date.toDate();
    }
  });

  return filtered;
}

function getRangeFiltered(){
  const days = Number(document.getElementById("range-select").value);
  if(!days) return allTransactions;

  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);

  return allTransactions.filter(tx => tx.date.toDate() >= cutoff);
}

function renderRows(filtered){
  const container = document.getElementById("transactions");
  container.innerHTML = "";

  document.getElementById("result-count").textContent =
    filtered.length === 1
      ? t("transaction_one")
      : t("transaction_other").replace("{count}", String(filtered.length));

  const pageSize = Number(document.getElementById("page-size-select").value);
  const rows = pageSize ? filtered.slice(0, pageSize) : filtered;

  if(rows.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = t("noTransactions");
    container.appendChild(empty);
    return;
  }

  for(const tx of rows){
    const userData = tx.sourceData;

    const row = document.createElement("div");
    row.className = "row";

    // Date
    const date = document.createElement("div");
    date.className = "col";
    date.textContent = formatDate(tx.date);

    // Source
    const source = document.createElement("div");
    source.className = "col source";

    const pfp = document.createElement("div");
    pfp.className = "pfp";
    pfp.style.backgroundImage = `url(${userData.profile_picture || '/org-owner.jpg'})`;

    const name = document.createElement("span");
    name.textContent = userData["display name"] || tx.source;

    source.appendChild(pfp);
    source.appendChild(name);

    if(userData.is_verified){
      const badge = document.createElement("img");
      badge.src = "assets/verified.png";
      badge.className = "verified";
      source.appendChild(badge);
    }

    source.onclick = () => {
      window.location.href = `viewprofile?profile=${tx.source}`;
    };

    // Description
    const desc = document.createElement("div");
    desc.className = "col desc";

    if(tx.image){
      const img = document.createElement("div");
      img.className = "item-img";
      img.style.backgroundImage = `url(${tx.image})`;
      desc.appendChild(img);
    }

    const descText = document.createElement("div");
    descText.className = "desc-text";

    const descTitle = document.createElement("span");
    descTitle.className = "desc-title";
    descTitle.textContent = tx.description;
    descText.appendChild(descTitle);

    if(tx.context){
      const descSub = document.createElement("span");
      descSub.className = "desc-sub";
      descSub.textContent = tx.context;
      descText.appendChild(descSub);
    }

    desc.appendChild(descText);

    // Amount
    const amount = document.createElement("div");
    amount.className = `col amount ${tx.type === "outgoing" ? "out" : "in"}`;
    amount.textContent =
      tx.type === "outgoing"
        ? `-DF$ ${formatCoins(tx.amount)}`
        : `+DF$ ${formatCoins(tx.amount)}`;

    row.appendChild(date);
    row.appendChild(source);
    row.appendChild(desc);
    row.appendChild(amount);

    container.appendChild(row);
  }
}

function renderSummary() {
  const ranged = getRangeFiltered();

  const inTx = ranged.filter(t => t.type === "incoming");
  const outTx = ranged.filter(t => t.type === "outgoing");

  const inTotals = {
    coin_purchase: 0,
    item_sale: 0,
    transfer_in: 0,
    other: 0
  };
  inTx.forEach(t => {
    const category = getSummaryCategoryForIncoming(t);
    inTotals[category] += t.amount;
  });

  const outTotals = {
    purchase: 0,
    transfer_out: 0,
    system_fee: 0,
    asset_upload: 0,
    grounds_content: 0,
    beta_program: 0
  };
  outTx.forEach(t => {
    const category = getSummaryCategoryForOutgoing(t);
    outTotals[category] += t.amount;
  });

  const inContainer = document.getElementById("summary-in");
  inContainer.innerHTML = "";
  let inTotal = 0;
  Object.keys(inTotals).forEach(key => {
    inTotal += inTotals[key];
    inContainer.appendChild(summaryRow(getCategoryLabel("incoming", key), inTotals[key]));
  });
  inContainer.appendChild(summaryRow(t("total"), inTotal, true));

  const outContainer = document.getElementById("summary-out");
  outContainer.innerHTML = "";
  let outTotal = 0;
  Object.keys(outTotals).forEach(key => {
    outTotal += outTotals[key];
    outContainer.appendChild(summaryRow(getCategoryLabel("outgoing", key), outTotals[key]));
  });
  outContainer.appendChild(summaryRow(t("total"), outTotal, true));
}

function summaryRow(label, amount, isTotal) {
  const row = document.createElement("div");
  row.className = "summary-row" + (isTotal ? " total" : "");

  const l = document.createElement("span");
  l.className = "label";
  l.textContent = label;

  const v = document.createElement("span");
  v.className = "value";
  v.textContent = `DF$ ${formatCoins(amount)}`;

  row.appendChild(l);
  row.appendChild(v);
  return row;
}

function render() {
  const typeVal = document.getElementById("type-select").value;
  const isSummary = typeVal === "summary";

  document.getElementById("list-view").style.display = isSummary ? "none" : "block";
  document.getElementById("summary-view").style.display = isSummary ? "block" : "none";
  document.getElementById("page-size-field").style.display = isSummary ? "none" : "flex";
  document.getElementById("sort-field").style.display = isSummary ? "none" : "flex";
  document.getElementById("range-field").style.display = isSummary ? "flex" : "none";

  if (isSummary) {
    renderSummary();
  } else {
    renderRows(getFiltered());
  }
}

// ---- filters ----
document.getElementById("type-select").addEventListener("change", render);
document.getElementById("page-size-select").addEventListener("change", render);
document.getElementById("sort-select").addEventListener("change", render);
document.getElementById("range-select").addEventListener("change", render);
document.getElementById("search-input").addEventListener("input", render);

document.getElementById("topup-btn").addEventListener("click", () => {
  window.location.href = "shop.html";
});

auth.onAuthStateChanged(async user => {
  if (user) {
    await loadUserHeader(user);
    await loadTransactions();
  } else {
    window.location.href = "login.html";
  }
});
</script>
