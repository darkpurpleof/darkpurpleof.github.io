<style>
:root{
  --bg: #171717;
  --card: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.03));
  --muted: #9aa0b2;
  --text: #e9e6ef;
  --accent-1: #1f1f1f;
  --accent-2: #1f1f1f;
  --glass: rgba(255,255,255,0.03);
  --border: rgba(255,255,255,0.06);
  --radius: 14px;
  --max-width: 600px;
  --card-gap: 0px;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0;
}

/* === BUGFIX: topbar must stay fixed at the top while scrolling, never
   scroll away together with the posts feed === */
dp-topbar {
  position: sticky;
  top: 0;
  left: 0;
  width: 100%;
  margin: 0;
  display: block;
  flex-shrink: 0;
  z-index: 1000;
  background: var(--bg);
}

.container{
  width:100%;
  max-width:none;
  border-left:none;
  border-right:none;
  min-height: 100vh;
}

/* header (kept for compatibility, no visual footprint needed) */
.header{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.page-title{
  font-family: 'Orbitron', system-ui, sans-serif;
  font-size:22px; letter-spacing:0.6px; margin:0;
  color:var(--text);
}

/* ===== Compose prompt (top "Create new post" bar, X-like) ===== */
.compose-card{
  text-align:left;
  border-bottom:1px solid var(--border);
  padding:14px 16px;
}
.compose-card a{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  color:var(--bg);
  background:var(--text);
  text-decoration:none;
  font-size:15px;
  font-weight:800;
  border-radius:999px;
  padding:12px 16px;
  transition: opacity .12s ease;
}
.compose-card a:hover{ opacity:0.9; }

/* ===== Avatar (single consolidated definition, fixes the duplicate/
   conflicting rules and keeps a perfect circle at every breakpoint) ===== */
.avatar{
  position:relative;
  display:block;
  width:48px;
  height:48px;
  min-width:48px;
  flex:0 0 auto;
  border-radius:50%;
  overflow:hidden;
  background-repeat:no-repeat;
  background-size:cover;
  background-position:center;
  aspect-ratio:1/1;
  border:2px solid var(--border);
  object-fit:cover;
}
.avatar img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}
@media (min-width:701px){
  .avatar{ width:52px; height:52px; min-width:52px; }
}
@media (max-width:360px){
  .avatar{ width:40px; height:40px; min-width:40px; }
}

/* profile picture frame overlay - always matches the avatar's current size
   because it's positioned with inset:0 instead of a hardcoded pixel size */
.profile-pic-frame{
  position:absolute;
  inset:0;
  border-radius:50%;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  object-fit:cover;
  pointer-events:none;
}

/* ===== post card, X-style: flat, separated by a bottom border, subtle
   hover highlight instead of its own background box ===== */
.post-card{
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  position: relative;
  transition: background-color .12s ease;
  cursor: pointer;
}
.post-card:hover{
  background-color: rgba(255,255,255,0.025);
}

.post-row{ display:flex; gap:12px; align-items:flex-start; min-width:0; }
.post-main{ flex:1 1 auto; min-width:0; }

.post-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  min-width:0;
}
.post-header-text{
  display:flex;
  align-items:center;
  gap:4px;
  flex-wrap:wrap;
  min-width:0;
  overflow:hidden;
}
.display-name{
  font-weight:700;
  font-size:15px;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:42vw;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.handle{
  font-size:14px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:42vw;
}
.dot{ color:var(--muted); font-size:13px; }
.post-date{ font-size:14px; color:var(--muted); white-space:nowrap; }

.verified-badge{ width:16px; height:16px; display:inline-block; background-image:url('/assets/verified.png'); background-size:contain; background-repeat:no-repeat; flex:0 0 auto; flex-shrink:0; }

.post-meta{ position:relative; display:none; align-items:center; gap:2px; flex:0 0 auto; }
.menu-btn{ width:30px; height:30px; border-radius:50%; border:none; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; }
.menu-btn:hover{ background: rgba(255,255,255,0.08); color:var(--text); }
.post-menu{ position:absolute; top:32px; right:0; min-width:180px; background:var(--bg); border:1px solid var(--border); border-radius:12px; box-shadow:0 14px 40px rgba(0,0,0,0.5); display:none; flex-direction:column; padding:6px 0; z-index:50; }
.post-menu.open{ display:flex; }
.post-menu button{ width:100%; padding:10px 14px; text-align:left; border:none; background:transparent; color:var(--text); cursor:pointer; font-size:14px; }
.post-menu button:hover:not([disabled]){ background: rgba(255,255,255,0.08); }
.post-menu button[disabled]{ opacity:0.4; cursor:not-allowed; }

/* post content - no white-space:pre-wrap here anymore: that was fighting
   with the rich-markdown component's own rendered layout (paragraphs,
   line breaks, lists, etc.) and is part of the rich-text bug fix */
.post-text{ margin-top:2px; font-size:15px; color:var(--text); line-height:1.45; word-wrap:break-word; }
.post-text rich-markdown{ display:block; }

.post-images{
  margin-top:10px;
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:4px;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--border);
}
.post-images:has(> :only-child){ grid-template-columns: 1fr; }
.post-images img{ width:100%; height:100%; max-height:300px; object-fit:cover; display:block; }

/* Video preview styles: show a non-playable preview with a centered play-overlay */
.video-preview{ position:relative; display:block; width:100%; height:100%; overflow:hidden; }
.video-preview .preview-video{ display:block; width:100%; height:100%; max-height:300px; object-fit:cover; pointer-events:none; user-select:none; }
.video-preview .play-overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:auto; }
.video-preview .play-overlay svg{ width:48px; height:48px; }
.video-preview:focus{ outline:2px solid rgba(255,255,255,0.06); }

/* ===== actions row, X-style: evenly spaced, pill hover, no boxed buttons ===== */
.actions-row{ display:flex; align-items:center; justify-content:space-between; max-width:320px; margin-top:8px; }
.icon-btn{
  display:inline-flex; align-items:center; gap:6px; padding:6px 10px; margin-left:-10px; border-radius:999px; background:transparent; border:none;
  color:var(--muted); cursor:pointer; transition: background .12s ease, color .12s ease;
}
.icon-btn:first-child{ margin-left:-10px; }
.icon-btn:hover{ background: rgba(255,255,255,0.08); color:var(--text); }
.icon{ width:18px; height:18px; display:inline-block; vertical-align:middle; fill:currentColor; opacity:0.95; }
.like-count{ font-size:13px; color:inherit; }

/* like active */
.icon-btn.liked{ background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); color:var(--text); border-color:transparent; }

/* ===== Mobile-only design: edge-to-edge feed + floating compose button,
   distinct from the desktop layout rather than just a scaled-down version ===== */
.fab-compose{
  display:none;
}
@media (max-width:700px){
  .container{
    border-left:none;
    border-right:none;
  }
  .post-card{ padding:10px 12px; }
  .compose-card{ display:none; }
  .fab-compose{
    display:flex;
    align-items:center;
    justify-content:center;
    position:fixed;
    bottom:20px;
    right:18px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--text);
    color:var(--bg);
    text-decoration:none;
    font-size:28px;
    font-weight:700;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
    z-index:900;
    line-height:0;
  }
  .display-name, .handle{ max-width:none; }
  .post-images img, .post-images .video-preview, .post-images .preview-video{ max-height:220px; }
}

@media (max-width:360px){
  .display-name, .handle{ max-width:28vw; }
}

/* small helpers */
.muted{ color:var(--muted); font-size:13px; }

/* accessibility: prefers-reduced-motion */
@media (prefers-reduced-motion: reduce){
  .post-card, .icon-btn{ transition:none; animation:none; transform:none; }
}
</style>

function normalizeLocale(value) {
  if (typeof value !== 'string') return null;
  const raw = value.toLowerCase().trim();
  if (raw.startsWith('de')) return 'de';
  if (raw.startsWith('ru')) return 'ru';
  if (raw.startsWith('ja')) return 'ja';
  if (raw.startsWith('es')) return 'es';
  if (raw.startsWith('en')) return 'en';
  return null;
}

function getBrowserLocale() {
  const source = Array.isArray(navigator.languages) && navigator.languages.length ? navigator.languages[0] : (navigator.language || navigator.userLanguage || '');
  return normalizeLocale(source) || LOCALE_FALLBACK;
}

function getPreferredLocale(userDocData) {
  const accountLang = normalizeLocale(userDocData && (userDocData.lang || userDocData.language));
  return accountLang || getBrowserLocale();
}

function getStrings(locale) {
  const normalized = SUPPORTED_LOCALES.includes(locale) ? locale : normalizeLocale(locale) || LOCALE_FALLBACK;
  return POST_TRANSLATIONS[normalized] || POST_TRANSLATIONS[LOCALE_FALLBACK];
}

/* Utility: attempt to fetch user doc by a few keys for robustness */
async function getUserDoc(email){
  if(!email) return null;
  const lower = String(email).toLowerCase();
  // 1) direct doc
  try{
    let snap = await db.collection('user_data').doc(lower).get();
    if(snap.exists) return { id: snap.id, data: snap.data() };
    // 2) encoded key
    snap = await db.collection('user_data').doc(encodeURIComponent(lower)).get();
    if(snap.exists) return { id: snap.id, data: snap.data() };
    // 3) fallback query
    const q = await db.collection('user_data').where('email','==', lower).limit(1).get();
    if(!q.empty) return { id: q.docs[0].id, data: q.docs[0].data() };
    // nothing
    return null;
  }catch(err){
    console.warn('getUserDoc error', err);
    return null;
  }
}

/* Small helper to safely escape text content for insertion into DOM elements (we use textContent so it's usually safe) */
function safeText(s){ return (s === undefined || s === null) ? '' : String(s); }

// Convert Firestore timestamps + unix ms/seconds into JS ms
function toMillis(value){
  if (value == null) return null;
  if (typeof value === 'number') return value;
  if (value instanceof Date) return value.getTime();
  if (value?.toDate) return value.toDate().getTime();
  if (typeof value === 'object' && typeof value.seconds === 'number') {
    const seconds = Number(value.seconds || 0);
    const nanos = Number(value.nanoseconds || 0);
    return seconds * 1000 + Math.floor(nanos / 1e6);
  }
  return null;
}

function formatPostDate(value){
  const ms = toMillis(value);
  if (!ms) return '';
  const d = new Date(ms);
  const pad = v => String(v).padStart(2,'0');
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const hours = pad(d.getHours());
  const mins = pad(d.getMinutes());
  const day = pad(d.getDate());
  const month = monthNames[d.getMonth()] || '';
  const year = String(d.getFullYear()).slice(-2);
  return `${hours}:${mins} - ${day} ${month}, ${year}`;
}

    <path d="M10 14L21 3" stroke="currentColor" stroke-width="1.6" fill="none"/>
    <path d="M21 21H3V3" stroke="currentColor" stroke-width="1.2" fill="none"/>
  </svg>`
};

/* Play button SVG */
const PLAY_SVG = `<svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <circle cx="12" cy="12" r="11" fill="rgba(0,0,0,0.45)" />
  <path d="M10 8l6 4-6 4z" fill="white" />
</svg>`;

/* Render media items (images + video previews). Videos (.mp4) render a non-playable preview with a play-overlay. */
function renderMediaItems(images){
  if(!images || !images.length) return '';
  return `<div class="post-images">${images.map(u => {
    try{
      const url = String(u||'');
      if(url.match(/\.(mp4)(\?.*)?$/i)){
        return `<div class="video-preview" data-src="${escapeHtml(url)}" tabindex="0" role="button" aria-label="Video preview, not playable">
            <video class="preview-video" src="${escapeHtml(url)}" preload="metadata" muted playsinline></video>
            <div class="play-overlay">${PLAY_SVG}</div>
          </div>`;
      }
    }catch(e){ }
    return `<img src="${encodeURI(u)}" loading="lazy" alt="post image" />`;
  }).join('')}</div>`;
}


/* Render a single post card DOM element */
function createPostCard({ postId, editorEmail, displayName, profilePic, verified, text, images, likedBy, createdAt, towall, pinnedByOwner, canLike = true }, currentUserEmail, strings){
  const userLiked = currentUserEmail ? likedBy.map(e=>String(e).toLowerCase()).includes(currentUserEmail) : false;
  const likeCount = likedBy.length || 0;

  const card = document.createElement('article');
  card.className = 'post-card';
  card.id = `post-${postId}`;

  // header
  const avatarUrl = profilePic || '/org-owner.jpg';
  const safeDisplayName = escapeHtml(displayName);
      const verifiedHtml = verified ? `<span class="verified-badge" title="Verificado"></span>` : '';
  const dateLabel = formatPostDate(createdAt);
  const isOwner = currentUserEmail && editorEmail && currentUserEmail === String(editorEmail).toLowerCase();
  const canRemoveFromWall = currentUserEmail && towall && currentUserEmail === String(towall).toLowerCase();
  let isPinned = Boolean(pinnedByOwner);

  // NOTE: rich-markdown receives the raw markdown text (escaped only so it
  // survives being placed inside an HTML template - the browser's HTML
  // parser decodes the entities back to the original characters when it
  // builds the text node, so the component still sees real markdown source).
  card.innerHTML = `
    <div class="post-row">
      <div class="avatar" title="${escapeHtml(displayName)}">
        <img src="${encodeURI(avatarUrl)}" alt="${escapeHtml(displayName)}" style="width:100%;height:100%;object-fit:cover;display:block;" />
      </div>

      <div class="post-main">
        <div class="post-header">
          <div class="post-header-text">
            <span class="display-name">${escapeHtml(displayName)} ${verifiedHtml}</span>
            <span class="handle">${escapeHtml(editorEmail)}</span>
            ${dateLabel ? `<span class="dot">·</span><span class="post-date">${escapeHtml(dateLabel)}</span>` : ''}
          </div>

          <div class="post-meta">
            <button class="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" title="${escapeHtml(strings.postActions)}">⋮</button>
            <div class="post-menu" role="menu" aria-label="${escapeHtml(strings.postActions)}">
              <button type="button" class="menu-item delete-post" ${isOwner ? '' : 'disabled'}>${escapeHtml(strings.deletePost)}</button>
              <button type="button" class="menu-item pin-post" ${isOwner ? '' : 'disabled'}>${isPinned ? escapeHtml(strings.unpinPost) : escapeHtml(strings.pinPost)}</button>
              <button type="button" class="menu-item remove-wall" ${canRemoveFromWall ? '' : 'disabled'}>${escapeHtml(strings.removeFromWall)}</button>
            </div>
          </div>
        </div>

        <div class="post-text" role="article">
          <rich-markdown mode="markdown" chat-components></rich-markdown>
        </div>
        ${ images && images.length ? renderMediaItems(images) : '' }

        <div class="actions-row">
          <button class="icon-btn like-btn ${userLiked ? 'liked' : ''}" aria-pressed="${userLiked}" title="${canLike ? (userLiked ? strings.unlike : strings.like) : strings.likeUnavailable}" ${canLike ? '' : 'disabled'}>
            ${ICONS.heart(userLiked)} <span class="like-count">${likeCount}</span>
          </button>

          <button class="icon-btn report-btn" title="${escapeHtml(strings.report)}">
            ${ICONS.flag} <span class="muted" style="font-size:13px">${escapeHtml(strings.report)}</span>
          </button>
        </div>
      </div>
    </div>
  `;

  const menuBtn = card.querySelector('.menu-btn');
  const menu = card.querySelector('.post-menu');
  const deleteBtn = card.querySelector('.delete-post');
  const pinBtn = card.querySelector('.pin-post');
  const removeWallBtn = card.querySelector('.remove-wall');
  const markdownEl = card.querySelector('.post-text rich-markdown');
  const likeBtn = card.querySelector('.like-btn');
  const reportBtn = card.querySelector('.report-btn');

  if (markdownEl) {
    markdownEl.setAttribute('text', text);
    markdownEl.setAttribute('mode', 'markdown');
    markdownEl.setAttribute('chat-components', '');
  }

  card.addEventListener('click', (event) => {
    const interactive = event.target.closest('button, a, input, textarea, select, [role="menu"], .post-menu');
    if (interactive) return;
    window.location.href = `/posts?post=${encodeURIComponent(postId)}`;
  });

  function closeMenu() {
    if (menu) menu.classList.remove('open');
    if (menuBtn) menuBtn.setAttribute('aria-expanded','false');
    document.removeEventListener('click', onDocumentClick);
  }

  function onDocumentClick(e) {
    if (!card.contains(e.target)) closeMenu();
  }

  if (menuBtn && menu) {
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = menu.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) {
        document.addEventListener('click', onDocumentClick);
      } else {
        document.removeEventListener('click', onDocumentClick);
      }
    });
  }

  if (!canLike && likeBtn) {
    likeBtn.classList.add('disabled');
    likeBtn.setAttribute('aria-disabled', 'true');
  }

  if (deleteBtn) {
    deleteBtn.addEventListener('click', async () => {
      if (!isOwner) return;
      if (!confirm(strings.deleteConfirm)) return;
      try {
        await db.collection('posts').doc(postId).delete();
        window.location.href = '/ugc/posts';
      } catch (err) {
        console.error('delete post', err);
        alert(strings.deleteFailed);
      }
    });
  }

  if (pinBtn) {
    pinBtn.addEventListener('click', async () => {
      if (!isOwner) return;
      const willUnpin = isPinned;
      if (!confirm(willUnpin ? strings.unpinConfirm : strings.pinConfirm)) return;
      try {
        if (willUnpin) {
          await db.collection('posts').doc(postId).update({ pinnedByOwner: firebase.firestore.FieldValue.delete() });
          pinBtn.textContent = strings.pinPost;
          isPinned = false;
        } else {
          await db.collection('posts').doc(postId).update({ pinnedByOwner: true });
          pinBtn.textContent = strings.unpinPost;
          isPinned = true;
        }
        alert(willUnpin ? strings.unpinSuccess : strings.pinSuccess);
      } catch (err) {
        console.error('pin post', err);
        alert(strings.pinFailed);
      }
    });
  }

  if (removeWallBtn) {
    removeWallBtn.addEventListener('click', async () => {
      if (!canRemoveFromWall) return;
      if (!confirm(strings.removeWallConfirm)) return;
      try {
        await db.collection('posts').doc(postId).update({ towall: firebase.firestore.FieldValue.delete() });
        alert(strings.removeWallSuccess);
        removeWallBtn.disabled = true;
      } catch (err) {
        console.error('remove from wall', err);
        alert(strings.removeWallFailed);
      }
    });
  }

  return card;
}

/* Escape helper for attributes/text inserted as textContent */
function escapeHtml (unsafe) {
  return String(unsafe || '').replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; });
}

/* main: load posts */
const postsListEl = document.getElementById('postsList');

auth.onAuthStateChanged(async user => {
  postsListEl.innerHTML = ''; // clear
  const currentUserEmail = user?.email?.toLowerCase?.() || null;
  let locale = getBrowserLocale();
  let strings = getStrings(locale);

  try{
    const userDoc = currentUserEmail ? await getUserDoc(currentUserEmail) : null;
    locale = getPreferredLocale(userDoc?.data || {});
    strings = getStrings(locale);

    const composeLink = document.getElementById('composeLink');
    const fabCompose = document.getElementById('fabCompose');
    if (composeLink) composeLink.textContent = strings.createNewPost;
    if (fabCompose) fabCompose.setAttribute('aria-label', strings.createNewPost);
    document.documentElement.lang = locale;
    const snapshot = await db.collection('posts').orderBy('timestamp','desc').get();
    if(snapshot.empty){
      postsListEl.innerHTML = `<div class="muted" style="padding:18px; text-align:center">${escapeHtml(strings.noPostsYet)}</div>`;
      return;
    }

    for(const doc of snapshot.docs){
      const postData = doc.data();
      const postId = doc.id;
      const editorEmailRaw = postData.editor || '';
      const editorEmail = String(editorEmailRaw).toLowerCase();

      if(!editorEmail) continue;

      // attempt to fetch author data robustly
      const userDocSnapshot = await (async ()=>{
        try{
          let snap = await db.collection('user_data').doc(editorEmail).get();
          if(snap.exists) return snap;
          snap = await db.collection('user_data').doc(encodeURIComponent(editorEmail)).get();
          if(snap.exists) return snap;
          const q = await db.collection('user_data').where('email','==', editorEmail).limit(1).get();
          if(!q.empty) return q.docs[0];
          return null;
        }catch(e){
          console.warn('author fetch error', e);
          return null;
        }
      })();

      // derive author info with fallbacks
      let displayName = editorEmail;
      let profilePic = '/org-owner.jpg';
      let verified = false;
      let blockedUsers = [];
      let frameUrl = '';

      if(userDocSnapshot && userDocSnapshot.exists){
        const ud = userDocSnapshot.data();
        displayName = ud['display name'] || ud.displayName || ud.name || editorEmail;
        profilePic = ud.profile_picture || ud.avatar || '/org-owner.jpg';
        verified = !!ud.is_verified || !!ud.verified;
        blockedUsers = Array.isArray(ud.blockedUsers) ? ud.blockedUsers.map(x=>String(x).toLowerCase()) : [];
        frameUrl = ud.profile_picture_frame || '';
      }

      // respect block lists: if author blocked current user, skip
      if(currentUserEmail && blockedUsers.includes(currentUserEmail)) continue;

      // prepare post properties
      const text = postData.text || '';
      const images = Array.isArray(postData.images) ? postData.images : [];
      const likedBy = Array.isArray(postData.likedBy) ? postData.likedBy : [];
      const createdAt = postData.timestamp || postData.createdAt || postData.created || postData.created_at;
      const towall = postData.towall || '';
      const pinnedByOwner = postData.pinnedByOwner || postData.pinned_by_owner || postData.pinned || false;

      // create card
      const canLike = Boolean(userDocSnapshot && userDocSnapshot.exists);
      const card = createPostCard({ postId, editorEmail, displayName, profilePic, verified, text, images, likedBy, createdAt, towall, pinnedByOwner, canLike }, currentUserEmail, strings);
      postsListEl.appendChild(card);

      // BUGFIX (rich text not rendering): the previous code re-set
      // rich-markdown's textContent *after* the element was already
      // attached to the document. By that point the component had already
      // upgraded/rendered from its initial content, so forcing textContent
      // again wiped out the rendered rich content and left raw markdown
      // text on screen instead. The markup above already gives the
      // component its raw markdown source at creation time, so no further
      // action is needed here - we simply don't touch it again.

      // wire video preview behavior: ensure videos cannot be played here and overlay handles clicks
      const videoPreviews = card.querySelectorAll('.video-preview');
      videoPreviews.forEach(vp => {
        const video = vp.querySelector('video');
        const overlay = vp.querySelector('.play-overlay');
        if(video){
          // Stop any programmatic or user-initiated play
          video.addEventListener('play', ()=>{ try{ video.pause(); }catch(e){} });
          // Prevent clicks directly on the underlying video element
          video.addEventListener('click', (ev)=>{ ev.preventDefault(); ev.stopPropagation(); try{ video.pause(); }catch(e){} });
        }
        // Capture all activation attempts on the preview container
        vp.addEventListener('click', (ev)=>{ ev.preventDefault(); ev.stopPropagation(); if(video){ try{ video.pause(); }catch(e){} } });
        vp.addEventListener('keydown', (ev)=>{ if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); ev.stopPropagation(); if(video){ try{ video.pause(); }catch(e){} } } });
      });

      // frame overlay if provided. BUGFIX: previously this hardcoded a
      // fixed 56px size inline, which didn't match the avatar's actual
      // size on mobile breakpoints (40/48/52px), causing a misaligned
      // frame. Now it only sets the background image and lets the
      // `.profile-pic-frame { inset:0 }` CSS rule track the avatar's real
      // size automatically at every breakpoint.
      if(frameUrl){
        const avatarEl = card.querySelector('.avatar');
        const frameEl = document.createElement('div');
        frameEl.className = 'profile-pic-frame';
        frameEl.style.backgroundImage = `url('${encodeURI(frameUrl)}')`;
        avatarEl.appendChild(frameEl);
      }

      // wire actions
      const likeBtn = card.querySelector('.like-btn');
      const likeCountEl = card.querySelector('.like-count');
      const reportBtn = card.querySelector('.report-btn');

      // Like handler (atomic update)
      likeBtn.addEventListener('click', async ()=>{
        if(!currentUserEmail){
          alert(strings.signInToLike);
          return;
        }
        likeBtn.disabled = true;
        const postRef = db.collection('posts').doc(postId);
        try{
          const already = likeBtn.classList.contains('liked');
          if(already){
            await postRef.update({ likedBy: firebase.firestore.FieldValue.arrayRemove(currentUserEmail) });
            likeBtn.classList.remove('liked');
            likeBtn.setAttribute('aria-pressed','false');
            // update count locally (decrement)
            let n = Math.max(0, Number(likeCountEl.textContent || 0) - 1);
            likeCountEl.textContent = n;
          } else {
            await postRef.update({ likedBy: firebase.firestore.FieldValue.arrayUnion(currentUserEmail) });
            likeBtn.classList.add('liked');
            likeBtn.setAttribute('aria-pressed','true');
            let n = Math.max(0, Number(likeCountEl.textContent || 0) + 1);
            likeCountEl.textContent = n;
          }
        }catch(err){
          console.error('like failed', err);
          alert(strings.likeFailed);
        }finally{
          likeBtn.disabled = false;
        }
      });

      // Report handler
      reportBtn.addEventListener('click', (event)=>{
        event.stopPropagation();
        // navigate to report page with reporting param
        window.location.href = `/reportabuse?reporting=${encodeURIComponent(editorEmail)}`;
      });

    } // end for each post

  }catch(err){
    console.error('load posts failed', err);
    postsListEl.innerHTML = `<div class="muted" style="padding:18px; text-align:center; color:#ff6b6b">No se pudieron cargar las publicaciones.</div>`;
  }
});
</script>
