*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;overflow-x:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:root{--bg:#171717;--surface:#1f1f1f;--raised:#242424;--border:rgba(255,255,255,0.04);--text:#eaeaea;--muted:#a8a8a8;--accent:#6b21a8;--accent-h:#5b21b6;--danger:#c0392b;--star:#F5B400;--sb:env(safe-area-inset-bottom,0px)}
body.light{--bg:#f6f8fb;--surface:#fff;--raised:#fff;--border:rgba(0,0,0,0.06);--text:#0f172a;--muted:#475569}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14.5px;line-height:1.55;min-height:100vh}
dp-topbar{display:block;position:sticky;top:0;z-index:100}
.page{max-width:1120px;margin:0 auto;padding:24px 20px 64px;display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.sec{padding:20px 22px;border-top:1px solid var(--border)}.sec:first-child{border-top:0}
h1{font-size:23px;line-height:1.25;margin:2px 0 4px;font-weight:700;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}
.muted{color:var(--muted)}.star{color:var(--star)}
.vb{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px;margin-left:5px}h1 .vb{width:20px;height:20px;margin:0}
#hd{display:flex;gap:18px;align-items:flex-start}
.ico{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--raised);border:1px solid var(--border);flex:none}
.hm{flex:1;min-width:0}.eyebrow{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tools{display:flex;gap:6px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:4px;background:var(--accent-h);color:#fff;border:0;margin-top:8px}
.ib{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:13px}.ib:hover{color:var(--text);border-color:var(--muted)}
#shots{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}#shots img{height:220px;width:auto;border-radius:6px;border:1px solid var(--border);cursor:zoom-in;flex:none;background:var(--raised)}
.desc{white-space:pre-wrap;color:var(--text);opacity:.9;overflow-wrap:anywhere}.desc.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.link{background:none;border:0;color:var(--text);text-decoration:underline;cursor:pointer;padding:6px 0 0;font-weight:600;font-size:13px}
.notice{margin:0 22px 0;padding:10px 12px;border:1px solid rgba(192,57,43,.5);background:rgba(192,57,43,.12);border-radius:6px;font-size:13px}
.buy{position:sticky;top:76px;padding:20px}
.price{font-size:26px;font-weight:700;margin-bottom:14px}
#actions{display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:6px;border:1px solid rgba(128,128,128,.28);background:transparent;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--muted)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
dl{margin:18px 0 0;border-top:1px solid var(--border)}dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
dt{color:var(--muted)}dd{margin:0;text-align:right;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:flex-end}
.sum{display:flex;align-items:center;gap:10px;margin-bottom:14px}.sum b{font-size:22px}
.sb{background:none;border:0;padding:0 2px;font-size:26px;line-height:1;cursor:pointer;color:rgba(168,168,168,.35)}.sb.on{color:var(--star)}
textarea,input,select{width:100%;background:var(--raised);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font:inherit;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent-h);outline-offset:-1px}
.rev{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--border)}
.av{position:relative;width:40px;height:40px;border-radius:50%;background:var(--raised);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}.av.s{width:28px;height:28px;font-size:12px}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.rb{flex:1;min-width:0}.rh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}.rh time{color:var(--muted);font-size:12px}
.rb p{margin:6px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.ra{display:flex;gap:14px}.ra button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12.5px;padding:2px 0}.ra button:hover{color:var(--text)}
.thread{margin-top:10px;padding-left:12px;border-left:2px solid var(--border)}.cm{padding:8px 0}.cm .rh{margin-bottom:2px}
.cf{display:flex;gap:8px;margin-top:8px}.cf input{flex:1}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:6px;font-weight:600;font-size:14px;display:none;z-index:99999;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.purple{background:var(--accent-h);color:#fff}#toast.yellow{background:#e6b800;color:#222}#toast.red{background:#c0392b;color:#fff}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99990;align-items:center;justify-content:center;padding:16px}
.md{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:100%;max-width:440px;padding:22px;max-height:90vh;overflow:auto}.md.wide{max-width:900px;padding:10px}
.md h3{margin:0 0 8px;font-size:17px}.md p{margin:6px 0 14px;color:var(--muted);font-size:14px}.md label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.ma .btn{padding:9px 16px}
@media(max-width:860px){
.page{grid-template-columns:1fr;padding:0 0 calc(84px + var(--sb));gap:0}.card{border-radius:0;border-left:0;border-right:0}
.sec{padding:18px 16px}.notice{margin:0 16px}.buy{position:static;border-top:0}.buy .price{display:none}
#actions{position:fixed;left:0;right:0;bottom:0;z-index:200;flex-direction:row;padding:12px 14px calc(12px + var(--sb));background:var(--surface);border-top:1px solid var(--border)}
#actions .btn{flex:1}#actions .btn.gift{flex:0 0 auto}
.ico{width:72px;height:72px}h1{font-size:20px}#shots img{height:180px}
.ov{align-items:flex-end;padding:0}.md{max-width:100%;border-radius:12px 12px 0 0;padding-bottom:calc(20px + var(--sb))}}
</style>

<dp-topbar></dp-topbar>
<main class="page">
  <div class="card">
    <section class="sec"><div id="hd"></div></section>
    <section class="sec" id="shots-sec" hidden><div id="shots"></div></section>

      <div class="sum" id="sum"></div>
      <div id="composer"></div>
      <div id="reviews"></div>
    </section>
  </div>
  <aside class="card buy">
    <div class="price" id="price"></div>
    <div id="actions"></div>
    <div class="note" id="note"></div>
    <dl id="facts"></dl>
  </aside>
</main>
<div id="toast" class="purple"></div>
<div class="ov" id="ov"><div class="md" id="md" role="dialog" aria-modal="true">
  <h3 id="m-title"></h3><div id="m-body"></div>
  <div class="ma"><button class="btn" id="m-cancel"></button><button class="btn primary" id="m-ok"></button></div>
</div></div>

async function call(path,{method='GET',body,needAuth=false}={}){
  let tk=null;
  try{ if(auth.currentUser) tk=await auth.currentUser.getIdToken(false); }catch(e){ console.error(e); }
  if(needAuth&&!tk) return {ok:false,code:'auth_required'};
  try{
    const r=await fetch(API_BASE+path,{method,headers:{...(tk?{Authorization:'Bearer '+tk}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
    if(!r.ok){let c=null;try{c=(await r.clone().json()).code}catch(e){}return {ok:false,code:c||'http_'+r.status}}
    return {ok:true,res:r};
  }catch(e){console.error(e);return {ok:false,code:'network'}}
}

}

async function loadUGC(){
  if(!itemId||!authorParam){toast(t('missingIdOrAuthor'),'red');return}
  itemRef=db.collection('ugc').doc(authorParam).collection(typeId===0?'store-items':'development-items').doc(itemId);
  areaRef=itemRef.collection('userArea');
  try{
    const [d,a]=await Promise.all([itemRef.get(),db.collection('user_data').doc(authorParam).get().catch(()=>null)]);
    if(!d.exists){toast(t('itemNotFound'),'red');return}
    ugcDoc={id:d.id,...d.data()};
    authorDoc=a&&a.exists?{email:authorParam,...a.data()}:null;
    document.title=ugcDoc.name||t('pageTitle');
    renderAll();startListeners();
  }catch(e){console.error(e);toast(t('failedToLoadItem'),'red')}
}
async function refreshUser(){
  userDoc=null;owned=false;legacy=false;my={stars:0,text:''};
  if(currentUser){
    const em=currentUser.email;
    try{const u=await db.collection('user_data').doc(em).get();userDoc=u.exists?u.data():null}catch(e){console.error(e)}
    if(ugcDoc){
      let tx=false;
      try{tx=(await db.collection('transactions').doc(em).collection('records').doc(ugcDoc.id).get()).exists}catch(e){}
      const roleOwned=ugcDoc.type==='Role'&&ugcDoc.rolename&&((userDoc&&userDoc.roles)||[]).includes(ugcDoc.rolename);
      owned=tx||!!roleOwned;
      legacy=!tx&&!!(userDoc&&Array.isArray(userDoc.purchasedIds)&&userDoc.purchasedIds.includes(ugcDoc.id));
      try{const r=await itemRef.collection('ratings').doc(em).get();if(r.exists)my={stars:r.data().stars||0,text:r.data().review_text||''}}catch(e){}
    }
  }
  draft={...my};
  currentLang=normalizeLang((userDoc&&userDoc.lang)||(navigator.language||'en').slice(0,2));
  applyStatic();if(ugcDoc)renderAll();
}
function startListeners(){
  if(listening)return;listening=true;
  itemRef.collection('ratings').orderBy('updated_at','desc').limit(50).onSnapshot(s=>{
    reviews=s.docs.map(d=>({id:d.id,stars:d.data().stars||0,text:d.data().review_text||'',name:d.data().author_display,at:d.data().updated_at}));
    loadProfiles();renderReviews();
  },e=>console.warn('reviews',e));
  areaRef.where('type','==','comment').orderBy('createdAt','asc').onSnapshot(s=>{
    const g={};s.docs.forEach(d=>{const x=d.data();if(!x.ratingId)return;(g[x.ratingId]=g[x.ratingId]||[]).push({id:d.id,email:x.authorEmail||'',name:x.authorDisplay,text:x.text||'',at:x.createdAt})});
    comments=g;loadProfiles();renderReviews();
  },e=>console.warn('comments',e));
}
async function loadProfiles(){
  if(!currentUser)return;
  const need=new Set(reviews.map(r=>r.id));Object.values(comments).flat().forEach(c=>need.add(c.email));
  const todo=[...need].filter(e=>e&&!(e in profiles));if(!todo.length)return;
  todo.forEach(e=>profiles[e]=null);
  await Promise.all(todo.map(async e=>{try{const d=await db.collection('user_data').doc(e).get();profiles[e]=d.exists?d.data():{}}catch(x){profiles[e]={}}}));
  renderReviews();
}

    <h1><span>${esc(d.name||'—')}</span>${vb(d.is_verified||d.verified)}</h1>
    <div class="muted">${t('by')} ${esc(authorName())}${vb(authorDoc&&(authorDoc.is_verified||authorDoc.verified))}</div>
    ${avg!==null?`<div style="margin-top:6px"><span class="star">★</span> <b>${avg.toFixed(1)}</b> <span class="muted">· ${t('ratingsCount',{n:compact(cnt)})}</span></div>`:''}
    ${owned?`<span class="chip">✓ ${t('owned')}</span>`:''}</div>
    <div class="tools"><button class="ib" data-a="share">${t('share')}</button>${currentUser&&!isOwner()?`<button class="ib" data-a="report-item">${t('report')}</button>`:''}</div>`;
  const shots=(Array.isArray(d.previews)?d.previews:[]).filter(Boolean);
  $('#shots-sec').hidden=!shots.length;$('#shots').innerHTML=shots.map(u=>`<img src="${esc(u)}" alt="" loading="lazy" data-a="shot" data-src="${esc(u)}">`).join('');
  $('#sale-notice').hidden=owned||(onSale&&!!authorDoc);
  const desc=d.description||'';
  $('#desc').innerHTML=desc.trim()?`<div class="desc${desc.length>220&&!descOpen?' clamp':''}">${esc(desc)}</div>${desc.length>220?`<button class="link" data-a="more">${t(descOpen?'showLess':'showMore')}</button>`:''}`:`<span class="muted"><i>${t('noDescription')}</i></span>`;
  $('#log-sec').hidden=!(d.changelog&&String(d.changelog).trim());$('#log').textContent=d.changelog||'';
  $('#price').textContent=owned?t('owned'):priceText();
  const dl=d.downloads!=null?compact(+d.downloads||0):null;
  $('#facts').innerHTML=[[t('author'),esc(authorName())+vb(authorDoc&&(authorDoc.is_verified||authorDoc.verified))],[t('type'),esc(typeLabel(d.type)||'—')],[t('version'),esc(d.version||'—')],[t('updated'),fmtDate(d.updated_at||d.updated)],dl&&[t('downloads'),dl]].filter(Boolean).map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  const cnt2=cnt;$('#sum').innerHTML=avg!==null?`<b>${avg.toFixed(1)}</b><span class="star" style="font-size:18px">${starsStr(Math.round(avg))}</span><span class="muted">${t('ratingsCount',{n:compact(cnt2)})}</span>`:`<span class="muted">${t('noRatings')}</span>`;
}
function mainState(){
  const d=ugcDoc,onSale=d.on_sale===true;
  if((!onSale&&!owned)||(!authorDoc&&!owned)||d.downloadable===false)return {text:t('unavailable'),disabled:true};
  if(owned)return NO_DL.includes(d.type)?{text:t('purchased'),disabled:true}:{text:t('downloadButton'),fn:'download'};
  if(legacy)return {text:t('migrate'),fn:'migrate'};
  return {text:price()===0?t('freeLabel'):t('purchasePrice',{price:price().toLocaleString(localeForLang())}),fn:'purchase'};
}
function renderActions(){
  if(!ugcDoc)return;
  const s=mainState(),d=ugcDoc,onSale=d.on_sale===true;
  const canGift=onSale&&!!authorDoc&&d.downloadable!==false;
  const android=/Android/i.test(navigator.userAgent);
  $('#actions').innerHTML=`<button class="btn primary" data-a="${s.fn||''}" ${s.disabled||busy?'disabled':''}>${busy?t('loading'):esc(s.text)}</button>`
    +(canGift?`<button class="btn gift" data-a="gift" ${busy?'disabled':''}>🎁<span class="gl"> ${t('gift')}</span></button>`:'')
    +(android?`<button class="btn" data-a="app">${t('viewInApp')}</button>`:'');
  $('#note').textContent=!currentUser&&!owned?t('signInPurchase'):(legacy&&!owned?t('migrateHint'):(android?t('androidAppRequired'):''));
}
function renderComposer(){
  const c=$('#composer');if(!ugcDoc)return;
  if(!currentUser||!canParticipate()){c.innerHTML=`<p class="muted"><i>${t('purchaseToReview')}</i></p>`;return}
  c.innerHTML=`<div>${[1,2,3,4,5].map(n=>`<button class="sb${n<=draft.stars?' on':''}" data-a="star" data-n="${n}" aria-label="${n}">★</button>`).join('')}</div>
    <textarea id="rv-text" rows="3" maxlength="1000" placeholder="${esc(t('reviewPlaceholder'))}" style="margin-top:6px">${esc(draft.text)}</textarea>
    <div style="text-align:right;margin-top:8px"><button class="btn primary" id="rv-post" data-a="post-review">${t(my.stars?'updateReview':'postReview')}</button></div>`;
  updateComposerBtn();
}
function updateComposerBtn(){
  const b=$('#rv-post');if(!b)return;
  b.disabled=!(draft.stars>0&&(draft.stars!==my.stars||draft.text.trim()!==my.text.trim()));
}
function renderReviews(){
  const box=$('#reviews');if(!box||!ugcDoc)return;
  const list=reviews.filter(r=>r.text.trim()||(comments[r.id]||[]).length);
  if(!list.length){box.innerHTML=`<p class="muted" style="border-top:1px solid var(--border);padding-top:14px">${t('noReviews')}</p>`;return}
  box.innerHTML=list.map(r=>{
    const p=currentUser?profiles[r.id]:null,name=(p&&p['display name'])||r.name||r.id.split('@')[0],cs=comments[r.id]||[];
    const mine=currentUser&&currentUser.email===r.id;
    let th='';
    if(openThread===r.id){
      th=`<div class="thread">${cs.map(c=>{const cp=currentUser?profiles[c.email]:null,cn=(cp&&cp['display name'])||c.name||c.email.split('@')[0];
        return `<div class="cm"><div class="rh">${avatar(cp,cn,true)}<b>${esc(cn)}</b>${vb(cp&&cp.is_verified)}<time>${fmtDate(c.at)}</time>${canParticipate()&&currentUser&&currentUser.email!==c.email?`<span class="ra"><button data-a="report-comment" data-id="${esc(c.id)}">${t('report')}</button></span>`:''}</div><p>${esc(c.text)}</p></div>`}).join('')}
        ${canParticipate()&&currentUser?`<div class="cf"><input data-draft="${esc(r.id)}" maxlength="500" placeholder="${esc(t('commentPlaceholder'))}" value="${esc(drafts[r.id]||'')}"><button class="btn primary" data-a="post-comment" data-id="${esc(r.id)}">${t('post')}</button></div>`:`<p class="muted"><i>${t('purchaseToComment')}</i></p>`}</div>`;
    }
    return `<article class="rev">${avatar(p,name)}<div class="rb"><div class="rh"><b>${esc(name)}</b>${vb(p&&p.is_verified)}<span class="star">${starsStr(r.stars)}</span><time>${fmtDate(r.at)}</time></div>
      ${r.text.trim()?`<p>${esc(r.text)}</p>`:''}<div class="ra"><button data-a="thread" data-id="${esc(r.id)}">${t('comments')} (${cs.length})</button>${canParticipate()&&currentUser&&!mine?`<button data-a="report-review" data-id="${esc(r.id)}">${t('report')}</button>`:''}</div>${th}</div></article>`;
  }).join('');
}

/* ---------- Actions ---------- */
async function doPurchase(claimLegacy){
  if(busy)return;busy=true;renderActions();
  const r=await call(API.purchase,{method:'POST',needAuth:true,body:{ugcId:itemId,author:authorParam,typeId,claimLegacy:!!claimLegacy,purchasingFrom:'web'}});
  let j=null;if(r.ok){try{j=await r.res.json()}catch(e){}}
  busy=false;
  if(r.ok&&j&&j.ok){toast(t('purchaseComplete'));await refreshUser()}
  else if(r.code==='already_owned'){toast(t('alreadyOwnThis'),'yellow');await refreshUser()}
  else if(r.code==='legacy_owned'){legacy=true;toast(t('migrateHint'),'yellow')}
  else toast(r.ok?errText('bad_response'):errText(r.code),'red');
  renderAll();
}
async function doDownload(){
  if(busy)return;busy=true;renderActions();toast(t('startingDownload'));
  const r=await call(API.download(typeId===0?'catalog':'dev',authorParam,itemId));
  busy=false;renderActions();
  if(!r.ok){toast(errText(r.code),'red');return}
  try{
    const blob=await r.res.blob(),cd=r.res.headers.get('content-disposition')||'';
    const m=cd.match(/filename\*=UTF-8''([^;]+)/i),m2=cd.match(/filename="([^"]+)"/i);
    const ty=(ugcDoc.type||'').toLowerCase(),base=(ugcDoc.name||'download').replace(/[^a-z0-9\-_.]/gi,'_');
    const name=(m?decodeURIComponent(m[1]):m2?m2[1]:base+(ty.includes('plugin')?'.dpplugin':ty.includes('sticker')?'.dpfstickers':'')).replace(/[\\/]/g,'_');
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
    toast(t('downloadComplete'));
  }catch(e){console.error(e);toast(t('downloadFailed'),'red')}
}
function confirmPurchase(){
  if(!currentUser){toast(t('needLoginPurchase'),'yellow');return}
  dialog({title:t('buyTitle',{name:ugcDoc.name||t('item')}),body:`<p>${t('confirmPurchaseBody',{priceText:priceText()})}</p>`,ok:t('confirm'),cancel:t('cancel'),onOk:()=>doPurchase(false)});
}
function confirmMigrate(){dialog({title:t('migrate'),body:`<p>${t('migrateBody')}</p>`,ok:t('confirm'),cancel:t('cancel'),onOk:()=>doPurchase(true)})}
function openGift(){
  if(!currentUser){toast(t('giftNeedLogin'),'yellow');return}
  if(!window.SendGiftSheet){toast(t('errGeneric'),'red');return}
  try{SendGiftSheet.open({ugcId:itemId,author:authorParam,typeId})}catch(e){console.error('SendGiftSheet.open failed',e);toast(t('errGeneric'),'red')}
}
async function submitReview(){
  const em=currentUser&&currentUser.email;if(!em||!canParticipate()||!draft.stars||busy)return;
  const stars=draft.stars,text=draft.text.trim(),b=$('#rv-post');if(b)b.disabled=true;
  const ref=itemRef.collection('ratings').doc(em);
  try{
    const res=await db.runTransaction(async tx=>{
      const prev=await tx.get(ref),it=await tx.get(itemRef),ps=prev.exists?prev.data().stars:null;
      let sum=it.data().rating_sum||0,cnt=it.data().rating_count||0;
      if(ps!=null)sum=sum-ps+stars;else{sum+=stars;cnt++}
      tx.set(ref,{stars,review_text:text,author_display:(auth.currentUser&&auth.currentUser.displayName)||em.split('@')[0],updated_at:TS.now()});
      tx.update(itemRef,{rating_sum:sum,rating_count:cnt});return {sum,cnt};
    });
    ugcDoc.rating_sum=res.sum;ugcDoc.rating_count=res.cnt;my={stars,text};draft={stars,text};toast(t('reviewSaved'));renderItem();
  }catch(e){console.error(e);toast(t('reviewFailed'),'red')}
  renderComposer();
}
function postComment(rid){
  const text=(drafts[rid]||'').trim(),em=currentUser&&currentUser.email;if(!em||!canParticipate()||!text)return;
  drafts[rid]='';
  areaRef.add({type:'comment',ratingId:rid,authorEmail:em,authorDisplay:(auth.currentUser&&auth.currentUser.displayName)||em.split('@')[0],text,createdAt:TS.now()}).catch(e=>{console.error(e);toast(t('errGeneric'),'red')});
}
function openReport(targetType,targetId,own){
  if(!currentUser){toast(t('errAuth'),'yellow');return}
  if(!canParticipate()){toast(t('reportNeedsOwn'),'yellow');return}
  if(own||isOwner())return;
  const title=t({item:'reportItem',review:'reportReview',comment:'reportComment'}[targetType]);
  dialog({title,body:`<p>${t('reportBody')}</p><label for="rp-r">${t('reason')}</label><select id="rp-r"><option value="">${t('selectReason')}</option>${REASONS.map(k=>`<option value="${esc(I18N.en[k])}">${esc(t(k))}</option>`).join('')}</select><label for="rp-d">${t('additional')}</label><textarea id="rp-d" rows="3" maxlength="500"></textarea>`,
    ok:t('report'),cancel:t('cancel'),onOk:async()=>{
      const reason=$('#rp-r').value;if(!reason){toast(t('selectReason'),'yellow');return true}
      try{await areaRef.add({type:'report',targetType,targetId,authorEmail:currentUser.email,reason,description:$('#rp-d').value.trim(),createdAt:TS.now()})}catch(e){console.error(e);toast(t('errGeneric'),'red');return}
      setTimeout(()=>dialog({title:t('reportThanks'),body:`<p>${t('reportThanksBody')}</p>`,ok:t('close'),onOk:()=>{}}),0);
    }});
}
const ACT={
  purchase:confirmPurchase,migrate:confirmMigrate,download:doDownload,gift:openGift,
  app:()=>{location.href=`darkpurpleof://installer/${itemId}/${authorParam}/${typeParam}`},
  more:()=>{descOpen=!descOpen;renderItem()},
  shot:d=>dialog({body:`<img src="${esc(d.src)}" alt="" style="margin:0 auto;max-height:80vh;border-radius:6px">`,wide:true}),
  share:async()=>{const data={title:ugcDoc.name,url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);toast(t('linkCopied'))}}catch(e){}},
  star:d=>{draft.stars=+d.n;document.querySelectorAll('.sb').forEach((b,i)=>b.classList.toggle('on',i<draft.stars));updateComposerBtn()},
  'post-review':submitReview,
  thread:d=>{openThread=openThread===d.id?null:d.id;renderReviews()},
  'post-comment':d=>postComment(d.id),
  'report-item':()=>openReport('item',itemId),
  'report-review':d=>openReport('review',d.id,currentUser&&currentUser.email===d.id),
  'report-comment':d=>{const c=Object.values(comments).flat().find(x=>x.id===d.id);openReport('comment',d.id,c&&currentUser&&c.email===currentUser.email)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset)});
document.addEventListener('input',e=>{
  if(e.target.id==='rv-text'){draft.text=e.target.value;updateComposerBtn()}
  else if(e.target.dataset&&e.target.dataset.draft)drafts[e.target.dataset.draft]=e.target.value;
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.draft){e.preventDefault();postComment(e.target.dataset.draft)}});

auth.onAuthStateChanged(async u=>{currentUser=u?{uid:u.uid,email:u.email}:null;profiles={};await refreshUser();if(ugcDoc){loadProfiles();renderAll()}});
currentLang=normalizeLang((navigator.language||'en').slice(0,2));applyStatic();loadUGC();
</script>
</body>
</html>
