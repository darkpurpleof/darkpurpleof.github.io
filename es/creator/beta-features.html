  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; width: 100%; overflow-x: hidden; }
    img { max-width: 100%; display: block; }
    [hidden] { display: none !important; }

    :root{
      --bg: #171717;
      --card: #1f1f1f;
      --raised: #242424;
      --muted: #a8a8a8;
      --accent: #6b21a8;
      --accent-strong: #5b21b6;
      --text: #eaeaea;
      --border: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.1);
      --lily: #c8a2c8;
      --lily-ink: #2a1238;
      --danger: #c0392b;
    }
    body.light {
      --bg: #f6f8fb; --card:#fff; --raised:#f1f4f8; --muted:#475569; --text:#0f172a;
      --border: rgba(0,0,0,0.06); --line: rgba(0,0,0,0.12);
      --lily: #7e4a8a; --lily-ink: #fff;
    }

    body {
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      font-size: 14.5px;
      line-height: 1.55;
      background-color: var(--bg);
      color:var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background .25s, color .25s;
      min-height:100vh;
    }

    dp-topbar { display:block; position:sticky; top:0; z-index:100; }
    .top-bar { display:none !important; }

    /* ── Layout ── */
    main.container {
      max-width:1120px;
      width:100%;
      margin:28px auto 56px;
      padding:0 20px;
      display:grid;
      grid-template-columns:minmax(0,1fr) 320px;
      gap:20px;
      align-items:start;
    }
    .col { display:grid; gap:20px; min-width:0; }
    .side { position:sticky; top:76px; }
    @media (max-width:900px){
      main.container{ grid-template-columns:1fr; margin:16px auto 40px; padding:0 14px; }
      .side { position:static; }
    }

    .card { background:var(--card); border:1px solid var(--line); border-radius:4px; overflow:hidden; }
    .sec { padding:20px 22px; }
    h2.label {
      margin:0 0 14px; font-size:12px; font-weight:600; letter-spacing:.07em;
      text-transform:uppercase; color:var(--muted);
    }

    /* ── Hero ── */
    .hero { display:grid; grid-template-columns:220px minmax(0,1fr); }
    @media (max-width:640px){ .hero { grid-template-columns:1fr; } }

    .beta-art {
      min-height:220px;
      border-right:1px solid var(--line);
      background-size:cover; background-position:center;
      background-color:var(--raised);
    }
    @media (max-width:640px){ .beta-art{ min-height:170px; border-right:0; border-bottom:1px solid var(--line); } }

    .beta-body { min-width:0; padding:22px; display:flex; flex-direction:column; gap:14px; }
    @media (max-width:640px){ .beta-body { padding:16px; } }

    .pill {
      align-self:flex-start;
      font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
      padding:4px 9px; border-radius:2px;
      border:1px solid var(--line); color:var(--muted);
    }
    .pill.ok { background:var(--accent); border-color:var(--accent); color:#fff; }

    h1 { margin:0; font-size:26px; font-weight:700; line-height:1.2; }
    .desc { margin:0; color:var(--muted); font-size:14px; }
    .fine { margin:0; color:var(--muted); font-size:12.5px; }
    .fine a, .info a { color:var(--text); text-decoration:underline; font-weight:600; }
    .fine a:hover, .info a:hover { color:var(--muted); }

    /* requirement progress */
    .prog-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
    .prog-head span { font-size:12px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
    .prog-head b { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
    .segs { display:flex; gap:4px; margin-top:8px; }
    .seg { flex:1; height:4px; background:var(--line); }
    .seg.on { background:var(--lily); }

    /* requirement tiles */
    .reqs { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    @media (max-width:760px){ .reqs { grid-template-columns:1fr; } }
    .reqs li {
      display:flex; align-items:flex-start; gap:10px;
      padding:10px 12px; background:var(--raised);
      border:1px solid var(--line); border-left:3px solid var(--line); border-radius:2px;
    }
    .reqs li.ok { border-left-color:var(--lily); }
    .reqs li.bad { border-left-color:var(--danger); }
    .reqs .mark {
      width:18px; height:18px; border-radius:2px; flex-shrink:0; margin-top:1px;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:700; color:#fff;
      border:1.5px solid var(--muted);
    }
    .reqs li.ok .mark { background:var(--lily); border-color:var(--lily); color:var(--lily-ink); }
    .reqs li.bad .mark { background:var(--danger); border-color:var(--danger); }
    .reqs .rt { min-width:0; display:flex; flex-direction:column; }
    .reqs .rl { font-size:13.5px; font-weight:600; }
    .reqs .rs { font-size:12px; color:var(--muted); }
    .reqs li.neutral .rl { color:var(--muted); }

    /* actions */
    .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:2px; }
    .btn {
      display:inline-flex; align-items:center; justify-content:center;
      height:40px; padding:0 20px; border-radius:3px;
      border:1px solid rgba(128,128,128,.35); background:transparent; color:var(--text);
      font:inherit; font-size:13.5px; font-weight:600; text-decoration:none; cursor:pointer;
      transition:background-color .12s, border-color .12s, opacity .12s;
    }
    .btn:hover { border-color:var(--muted); }
    .btn:focus-visible { outline:2px solid var(--accent-strong); outline-offset:2px; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .btn.primary:hover { background:var(--accent-strong); border-color:var(--accent-strong); }

    /* loading skeleton */
    .skeleton .sk { background:var(--line); animation:pulse 1.2s ease-in-out infinite; }
    .skeleton .sk.t { height:28px; width:60%; }
    .skeleton .sk.l { height:14px; width:90%; }
    .skeleton .sk.l.s { width:70%; }
    @keyframes pulse { 50% { opacity:.45; } }

    /* ── Stats strip ── */
    .stats { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:1px; background:var(--line); }
    .stat { background:var(--card); padding:14px 18px; display:flex; flex-direction:column; gap:4px; }
    .stat-k { font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
    .stat-v { font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }
    @media (max-width:640px){ .stats { grid-auto-flow:row; grid-template-columns:repeat(2,minmax(0,1fr)); } }

    /* ── How it works ── */
    .steps { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }
    .steps li { background:var(--card); padding:16px; display:flex; flex-direction:column; gap:10px; }
    @media (max-width:760px){ .steps { grid-template-columns:1fr; } }
    .num {
      width:26px; height:26px; border-radius:2px; background:var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
    }
    .steps h4, .get h4 { margin:0; font-size:14.5px; font-weight:700; }
    .steps p, .get p { margin:4px 0 0; color:var(--muted); font-size:13px; }

    /* ── What you get ── */
    .gets { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    @media (max-width:640px){ .gets { grid-template-columns:1fr; } }
    .get { display:flex; gap:14px; padding:16px; background:var(--raised); border:1px solid var(--line); border-radius:2px; }
    .get-ico {
      width:38px; height:38px; flex:none; border-radius:2px;
      display:flex; align-items:center; justify-content:center;
      background:var(--card); border:1px solid var(--line); color:var(--text);
    }
    .get-ico svg { width:20px; height:20px; }

    /* ── Sidebar ── */
    .info { padding:20px; }
    .info + .info { margin-top:0; }
    .info ul { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; }
    .info li { color:var(--muted); font-size:13px; line-height:1.5; padding-left:16px; position:relative; }
    .info li::before { content:""; position:absolute; left:0; top:7px; width:6px; height:6px; background:var(--accent); }
    .info .fine { margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }

    /* ── Toast ── */
    #toast {
      position:fixed; top:18px; left:50%; transform:translate(-50%,-8px);
      padding:10px 16px; border-radius:3px; font-size:13.5px; font-weight:600;
      opacity:0; pointer-events:none; z-index:99999;
      box-shadow:0 8px 24px rgba(0,0,0,0.4);
      transition:opacity .18s, transform .18s;
    }
    #toast.show { opacity:1; transform:translate(-50%,0); }
    #toast.purple { background:var(--accent-strong); color:#fff; }
    #toast.yellow { background:#e6b800; color:#222; }
    #toast.red { background:var(--danger); color:#fff; }

    /* ── Modal ── */
    .modal-backdrop {
      position:fixed; inset:0; background:rgba(0,0,0,0.6);
      display:flex; align-items:center; justify-content:center; padding:16px; z-index:9998;
      opacity:0; pointer-events:none; transition:opacity .15s;
    }
    .modal-backdrop.open { opacity:1; pointer-events:auto; }
    .modal {
      background:var(--card); border-radius:4px; border:1px solid var(--line);
      padding:22px; width:400px; max-width:100%;
      box-shadow:0 16px 40px rgba(0,0,0,0.5);
      transform:translateY(8px); transition:transform .15s;
    }
    .modal-backdrop.open .modal { transform:none; }
    .modal h3 { margin:0 0 8px; font-size:17px; }
    .modal p { margin:0; color:var(--muted); font-size:14px; line-height:1.5; }
    .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
  </style>
</head>

    var langMatch = location.pathname.match(/(?:^|\/)([a-z]{2})(?:\/creator)?\/(?:beta-features|beta)(?:\.html|\/index\.html)?\/?$/i);
    var LANG = (langMatch && I18N[langMatch[1].toLowerCase()]) ? langMatch[1].toLowerCase() : 'en';

    function t(key, vars) {
      var s = I18N[LANG][key];
      if (s === undefined) s = I18N.en[key];
      if (s === undefined) s = key;
      if (vars) s = s.replace(/\{(\w+)\}/g, function (_, k) { return vars[k] !== undefined ? vars[k] : ''; });
      return s;
    }

    var currentUser = null;
    var card = document.getElementById('betaCard');
    var art = document.getElementById('betaArt');
    var body = document.getElementById('betaBody');
    var busy = false;

    // ── helpers ──
    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    // "By joining you agree to the Terms." with the link inside the sentence
    function termsLine(cls) {
      var fine = el('p', cls);
      var parts = t('terms').split('{link}');
      var a = el('a', '', t('termsLink'));
      a.href = TERMS_URL; a.target = '_blank'; a.rel = 'noopener';
      fine.appendChild(document.createTextNode(parts[0]));
      fine.appendChild(a);
      fine.appendChild(document.createTextNode(parts[1] || ''));
      return fine;
    }

    function applyStaticText() {
      document.documentElement.lang = LANG;
      document.title = t('pageTitle');
      var nodes = document.querySelectorAll('[data-i]');
      for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute('data-i'));
      var side = document.getElementById('sideTerms');
      side.textContent = '';
      var line = termsLine('');
      while (line.firstChild) side.appendChild(line.firstChild);
    }

    var toastEl = document.getElementById('toast');
    var toastTimer;
    function toast(text, kind) {
      toastEl.textContent = text;
      toastEl.className = (kind || 'purple') + ' show';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3000);
    }

    // ── API ──
    async function api(action) {
      var headers = { 'Content-Type': 'application/json' };
      var payload = { action: action };

      var token = null;
      try { token = currentUser ? await currentUser.getIdToken() : null; } catch (e) { console.warn(e); }
      if (token) headers['Authorization'] = 'Bearer ' + token;
      else if (currentUser) payload.uid = currentUser.uid;

      var res, data;
      try {
        res = await fetch(API_URL, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
        data = await res.json();
      } catch (e) {
        var ne = new Error('NETWORK'); ne.code = 'NETWORK'; throw ne;
      }
      if (!res.ok || !data.ok) {
        var err = new Error(data.error || 'SERVER'); err.code = data.error || 'SERVER'; throw err;
      }
      return data;
    }

    function errText(err) {
      var k = 'err_' + err.code;
      return (I18N[LANG][k] || I18N.en[k]) ? t(k) : t('err_DEFAULT');
    }

    // ── modal ──
    var backdrop = document.getElementById('modalBackdrop');
    var mTitle = document.getElementById('modalTitle');
    var mBody = document.getElementById('modalBody');
    var mCancel = document.getElementById('modalCancel');
    var mConfirm = document.getElementById('modalConfirm');

    function ask(title, text, confirmLabel) {
      return new Promise(function (resolve) {
        mTitle.textContent = title;
        mBody.textContent = text;
        mConfirm.textContent = confirmLabel;
        backdrop.classList.add('open');
        mConfirm.focus();

        function done(result) {
          backdrop.classList.remove('open');
          mCancel.removeEventListener('click', onCancel);
          mConfirm.removeEventListener('click', onConfirm);
          backdrop.removeEventListener('click', onBackdrop);
          document.removeEventListener('keydown', onKey);
          resolve(result);
        }
        function onCancel() { done(false); }
        function onConfirm() { done(true); }
        function onBackdrop(e) { if (e.target === backdrop) done(false); }
        function onKey(e) { if (e.key === 'Escape') done(false); }

        mCancel.addEventListener('click', onCancel);
        mConfirm.addEventListener('click', onConfirm);
        backdrop.addEventListener('click', onBackdrop);
        document.addEventListener('keydown', onKey);
      });
    }

    // ── rendering ──
    function setArt(url) { art.style.backgroundImage = "url('" + url + "')"; }

    function formatN(n) { return Number(n).toLocaleString(LOCALES[LANG] || 'en-US'); }
    function hasNumber(n) { return n !== undefined && n !== null && n !== '' && isFinite(Number(n)); }

    // one requirement tile: state is 'ok' | 'bad' | 'neutral'
    function req(state, text) {
      var li = el('li', state);
      li.appendChild(el('span', 'mark', state === 'ok' ? '✓' : state === 'bad' ? '✕' : ''));
      var wrap = el('span', 'rt');
      wrap.appendChild(el('span', 'rl', text));
      wrap.appendChild(el('span', 'rs', state === 'ok' ? t('stMet') : state === 'bad' ? t('stNotMet') : t('stUnchecked')));
      li.appendChild(wrap);
      return li;
    }

    function progress(done, total) {
      var wrap = el('div', 'prog');
      var head = el('div', 'prog-head');
      head.appendChild(el('span', '', t('reqTitle')));
      head.appendChild(el('b', '', t('reqProgress', { done: done, total: total })));
      wrap.appendChild(head);
      var segs = el('div', 'segs');
      for (var i = 0; i < total; i++) segs.appendChild(el('span', 'seg' + (i < done ? ' on' : '')));
      wrap.appendChild(segs);
      return wrap;
    }

    function view(opts) {
      card.classList.remove('skeleton');
      setArt(opts.art);
      body.textContent = '';
      body.appendChild(el('span', 'pill' + (opts.ok ? ' ok' : ''), opts.pill));
      body.appendChild(el('h1', '', t('title')));
      if (opts.desc) body.appendChild(el('p', 'desc', opts.desc));
      if (opts.progress) body.appendChild(progress(opts.progress.done, opts.progress.total));
      if (opts.reqs) {
        var ul = el('ul', 'reqs');
        for (var i = 0; i < opts.reqs.length; i++) ul.appendChild(opts.reqs[i]);
        body.appendChild(ul);
      }
      if (opts.actions) {
        var actions = el('div', 'actions');
        for (var j = 0; j < opts.actions.length; j++) actions.appendChild(opts.actions[j]);
        body.appendChild(actions);
      }
      if (opts.terms) body.appendChild(termsLine('fine'));
    }

    function showBalance(coins) {
      var tile = document.getElementById('statBalance');
      if (hasNumber(coins)) {
        document.getElementById('statBalanceVal').textContent = formatN(coins) + ' DF$';
        tile.hidden = false;
      } else {
        tile.hidden = true;
      }
    }

    function renderSignedOut() {
      showBalance(null);
      view({
        art: ASSETS.unavailable, pill: t('pillSignIn'),
        desc: t('descSignedOut'),
        progress: { done: 0, total: 3 },
        reqs: [req('bad', t('reqSignedIn')), req('neutral', t('reqAge')), req('neutral', t('reqCoins'))]
      });
    }

    function renderStatus(s) {
      showBalance(s.coins);
      var coinsLabel = hasNumber(s.coins) ? t('reqCoinsHave', { n: formatN(s.coins) }) : t('reqCoins');

      if (s.enrolled) {
        var dl = el('a', 'btn primary', t('download'));
        dl.href = PLUGIN_URL;
        var out = el('button', 'btn', t('withdraw'));
        out.addEventListener('click', onWithdraw);
        view({
          art: ASSETS.enrolled, pill: t('pillEnrolled'), ok: true,
          desc: t('descEnrolled'),
          actions: [dl, out]
        });
      } else if (s.eligible) {
        var go = el('button', 'btn primary', t('join'));
        go.addEventListener('click', onEnroll);
        view({
          art: ASSETS.available, pill: t('pillOpen'), ok: true,
          desc: t('descOpen'),
          progress: { done: 3, total: 3 },
          reqs: [req('ok', t('reqSignedIn')), req('ok', t('reqAge')), req('ok', coinsLabel)],
          actions: [go],
          terms: true
        });
      } else {
        var met = 1 + (s.meetsAge ? 1 : 0) + (s.meetsCoins ? 1 : 0);
        view({
          art: ASSETS.unavailable, pill: t('pillNotEligible'),
          desc: t('descNeed'),
          progress: { done: met, total: 3 },
          reqs: [
            req('ok', t('reqSignedIn')),
            req(s.meetsAge ? 'ok' : 'bad', t('reqAge')),
            req(s.meetsCoins ? 'ok' : 'bad', coinsLabel)
          ]
        });
      }
    }

    // ── actions ──
    async function load() {
      if (!currentUser) { renderSignedOut(); return; }
      try {
        renderStatus(await api('status'));
      } catch (err) {
        console.error(err);
        toast(errText(err), 'red');
      }
    }

    function setBusy(on) {
      busy = on;
      var buttons = body.querySelectorAll('button');
      for (var i = 0; i < buttons.length; i++) buttons[i].disabled = on;
    }

    async function run(action, okText, okKind) {
      if (busy) return;
      setBusy(true);
      try {
        await api(action);
        toast(okText, okKind);
      } catch (err) {
        console.error(err);
        toast(errText(err), 'red');
      }
      busy = false;
      await load();
    }

    async function onEnroll() {
      var yes = await ask(t('joinTitle'), t('joinBody'), t('joinConfirm'));
      if (yes) run('enroll', t('toastEnrolled'), 'purple');
    }

    async function onWithdraw() {
      var yes = await ask(t('withdrawTitle'), t('withdrawBody'), t('withdrawConfirm'));
      if (yes) run('withdraw', t('toastWithdrawn'), 'yellow');
    }

    applyStaticText();

    auth.onAuthStateChanged(function (user) { currentUser = user; load(); });
  </script>
