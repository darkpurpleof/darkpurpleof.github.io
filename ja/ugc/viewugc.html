  <style>
    /* Global box-sizing and overflow guard to prevent any accidental horizontal scroll */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; width: 100%; overflow-x: hidden; }
    img { max-width: 100%; display: block; }

    :root{
      /* ---- original palette, unchanged ---- */
      --bg: #171717;
      --card: #1f1f1f;
      --muted: #a8a8a8;
      --accent: #6b21a8;
      --accent-strong: #5b21b6;
      --text: #eaeaea;
      --border: rgba(255,255,255,0.04);
      --friend-row-height: 110px;
      --friend-row-height-mobile: 84px;

      /* ---- derived tones (same hues, just alpha/mix variants) ---- */
      --accent-glow: rgba(107,33,168,0.45);
      --accent-ring: rgba(107,33,168,0.22);
      --accent-soft: rgba(107,33,168,0.12);
      --card-raised: #242424;

      --font-body: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      --font-display: 'Sora', 'Inter', system-ui, sans-serif;
      --font-mono: 'Space Mono', ui-monospace, monospace;

      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    body.light {
      --bg: #f6f8fb; --card:#fff; --muted:#475569; --text:#0f172a; --border: rgba(0,0,0,0.06);
      --card-raised: #ffffff;
    }

    body {
      margin:0; font-family: var(--font-body); background-color: var(--bg); color:var(--text);
      transition: background .25s, color .25s; min-height:100vh;
    }

    dp-topbar { display:block; position:sticky; top:0; z-index:100; }

    /* ============ LAYOUT ============ */
    main.dp-page {
      max-width:1180px; width:100%; margin:0 auto; padding:32px 20px 64px;
      box-sizing:border-box; overflow-x:hidden;
    }

    .dp-hero{
      position:relative;
      background:
        radial-gradient(1200px 260px at 15% -10%, var(--accent-soft), transparent 60%),
        var(--card);
      border-radius:20px;
      border:1px solid var(--border);
      box-shadow:0 24px 60px -20px rgba(0,0,0,0.55);
      overflow:hidden;
    }

    .dp-hero-inner{
      display:grid;
      grid-template-columns: 400px 1px 1fr;
      gap:0;
      align-items:stretch;
    }

    /* -------- media (left) -------- */
    .dp-media{
      padding:28px;
      display:flex; align-items:center; justify-content:center;
    }
    .dp-media-frame{
      position:relative;
      width:100%; aspect-ratio:1/1; border-radius:16px; overflow:hidden;
      background:#101010;
      border:1px solid var(--border);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 20px 40px -18px var(--accent-glow);
    }
    .dp-media-frame img{ width:100%; height:100%; object-fit:cover; }
    .dp-media-frame::after{
      content:''; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.35) 100%);
    }
    .dp-own-chip{
      position:absolute; top:12px; left:12px; z-index:2;
      display:none; align-items:center; gap:6px;
      font-family:var(--font-mono); font-size:11px; letter-spacing:.04em; font-weight:700;
      color:#fff; background:var(--accent-strong); padding:6px 10px; border-radius:999px;
      box-shadow:0 6px 16px -6px var(--accent-glow);
    }

    /* -------- ticket-perforation divider (signature element, desktop only) -------- */
    .dp-perf{
      position:relative; width:1px; background:transparent;
      background-image: repeating-linear-gradient(to bottom, var(--border) 0 8px, transparent 8px 16px);
    }
    .dp-perf::before, .dp-perf::after{
      content:''; position:absolute; left:50%; transform:translateX(-50%);
      width:22px; height:22px; border-radius:50%; background:var(--bg);
    }
    .dp-perf::before{ top:-11px; }
    .dp-perf::after{ bottom:-11px; }

    /* -------- details (right) -------- */
    .dp-details{
      padding:28px 32px 28px 24px;
      display:flex; flex-direction:column; gap:16px; min-width:0;
    }

    .dp-heading{ display:flex; flex-direction:column; gap:4px; min-width:0; }
    .dp-eyebrow{
      font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
      color:var(--muted);
    }
    .item-name{
      font-family:var(--font-display); font-weight:800; font-size:26px; line-height:1.15;
      display:flex; align-items:center; gap:10px; color:var(--text);
      overflow-wrap:anywhere;
    }
    .verified-badge{ width:18px; height:18px; flex:0 0 auto; }
    .item-author-line{
      font-size:13.5px; color:var(--muted); display:flex; gap:6px; align-items:center; margin-top:2px;
    }

    /* -------- spec strip (signature-adjacent: mono data chips) -------- */
    .dp-specs{
      display:flex; flex-wrap:wrap; gap:8px;
      padding:14px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    }
    .info-row{
      display:flex; align-items:baseline; gap:7px;
      padding:7px 12px; border-radius:999px;
      border:1px solid var(--border); background:var(--card-raised);
    }
    .info-label{ color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
    .info-value{
      font-family:var(--font-mono); font-weight:700; font-size:12.5px; color:var(--text);
      display:flex; align-items:center; gap:6px; white-space:nowrap;
    }

    .desc{
      color:var(--text); font-size:14.5px; line-height:1.55; opacity:.92;
      max-height:180px; overflow:auto; padding-right:4px;
    }

    /* -------- actions -------- */
    .dp-actions{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:auto; padding-top:6px;
    }
    .action-button{
      display:inline-flex; gap:9px; align-items:center; justify-content:center;
      padding:14px 20px; border-radius:12px; border:none; cursor:pointer;
      font-family:var(--font-body); font-weight:800; font-size:15px;
      background:linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      color:#fff; min-width:200px;
      box-shadow:0 10px 24px -10px var(--accent-glow);
      transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .action-button:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 14px 30px -10px var(--accent-glow); }
    .action-button:active:not(:disabled){ transform:translateY(0); }
    .action-button:disabled{ opacity:0.55; cursor:not-allowed; box-shadow:none; }
    .action-button.secondary{
      background:transparent; border:1px solid var(--border); color:var(--text);
      font-weight:700; box-shadow:none; min-width:auto;
    }
    .action-button.secondary:hover{ border-color:var(--accent); }

    .small-muted{ font-size:12.5px; color:var(--muted); }
    #action-disclaimer{ width:100%; }

    /* ============ TOAST ============ */
    #toast{
      position:fixed; top:18px; left:50%; transform:translateX(-50%);
      padding:11px 16px; border-radius:10px; font-weight:700; font-size:14px;
      display:none; z-index:99999; box-shadow:0 12px 30px -10px rgba(0,0,0,0.5);
    }
    #toast.purple{ background:var(--accent-strong); color:#fff; }
    #toast.yellow{ background:#e6b800; color:#222; }
    #toast.red{ background:#c0392b; color:#fff; }

    /* ============ PURCHASE MODAL (desktop: centered card) ============ */
    .modal-overlay{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.62); backdrop-filter:blur(2px);
      z-index:99990; align-items:center; justify-content:center; padding:16px;
    }
    .modal{
      background:var(--card); border-radius:16px; width:100%; max-width:420px; padding:22px;
      box-shadow:0 20px 60px rgba(0,0,0,0.6); color:var(--text); border:1px solid var(--border);
    }
    .modal h3{ margin:0 0 6px 0; font-family:var(--font-display); font-weight:700; font-size:18px; }
    .modal p{ margin:6px 0 16px 0; color:var(--muted); font-size:14px; }
    .modal .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
    .btn{ padding:10px 16px; border-radius:10px; border:none; cursor:pointer; font-weight:700; font-size:14px; }
    .btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--text); }
    .btn.primary{ background:var(--accent); color:#fff; }
    .btn.primary:hover{ background:var(--accent-strong); }
    .dp-sheet-handle{ display:none; }

    /* ============================================================
       MOBILE — dedicated UI, not just a shrunk desktop layout:
       - stacked full-bleed media
       - horizontally scrollable spec chips
       - sticky bottom purchase bar (app-store style)
       - purchase modal becomes a bottom sheet
       ============================================================ */
    @media (max-width: 860px){
      main.dp-page{ padding:0 0 calc(92px + var(--safe-b)); }

      .dp-hero{ border-radius:0; border-left:none; border-right:none; }
      .dp-hero-inner{ grid-template-columns:1fr; }
      .dp-perf{ display:none; }

      .dp-media{ padding:0; }
      .dp-media-frame{ border-radius:0; aspect-ratio:4/3; border:none; }

      .dp-details{ padding:18px 16px 12px; gap:14px; }
      .item-name{ font-size:21px; }

      .dp-specs{
        flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
        padding:12px 16px; margin:0 -16px; border-left:none; border-right:none;
        scrollbar-width:none;
      }
      .dp-specs::-webkit-scrollbar{ display:none; }
      .info-row{ flex:0 0 auto; }

      .desc{ max-height:none; }

      /* hide the inline action row; the sticky bar below takes over */
      .dp-actions{ display:none; }

      /* sticky mobile action bar (mirrors the SAME buttons via CSS, not duplicate DOM) */
      .dp-mobile-bar{
        position:fixed; left:0; right:0; bottom:0; z-index:200;
        display:flex; gap:10px; align-items:center;
        padding:12px 14px calc(12px + var(--safe-b));
        background:rgba(23,23,23,0.86);
        backdrop-filter:blur(14px) saturate(140%);
        border-top:1px solid var(--border);
      }
      body.light .dp-mobile-bar{ background:rgba(255,255,255,0.86); }
      .dp-mobile-bar .action-button{ min-width:0; flex:1 1 auto; padding:13px 16px; font-size:14.5px; }
      .dp-mobile-bar .action-button.secondary{ flex:0 0 auto; padding:13px; width:48px; }
      .dp-mobile-bar #action-disclaimer, .dp-mobile-bar #view-in-app-disclaimer{
        display:none; /* shown inline above the bar instead */
      }

      .dp-mobile-note{
        display:block; padding:0 16px 4px; font-size:12px; color:var(--muted); text-align:center;
      }

      /* modal -> bottom sheet */
      .modal-overlay{ align-items:flex-end; padding:0; }
      .modal{
        max-width:100%; border-radius:20px 20px 0 0; padding:14px 18px calc(18px + var(--safe-b));
        animation: dp-sheet-up .22s ease-out;
      }
      .dp-sheet-handle{
        display:block; width:40px; height:4px; border-radius:99px; background:var(--border);
        margin:2px auto 14px;
      }
      @keyframes dp-sheet-up{ from{ transform:translateY(24px); opacity:.6; } to{ transform:translateY(0); opacity:1; } }
    }

    @media (min-width:861px){
      .dp-mobile-bar{ display:none; }
      .dp-mobile-note{ display:none; }
      .gift-btn-icon{ display:none; }
    }

    @media (max-width: 860px){
      .gift-btn-text{ display:none; }
      .gift-btn-icon{ display:inline-flex; align-items:center; }
      .gift-btn-icon svg{ width:20px; height:20px; }
      #view-in-app-btn{ flex:1; justify-content:center; }
    }

    @media (max-width: 460px){
      .dp-media-frame{ aspect-ratio:1/1; }
      .item-name{ font-size:19px; }
    }

let currentLang = 'en';

function normalizeLang(code){
  const c = String(code || '').trim().toLowerCase();
  return SUPPORTED_LANGS.includes(c) ? c : 'en';
}

function localeForLang(){
  return ({ en: 'en-US', es: 'es-ES', ru: 'ru-RU', de: 'de-DE', ja: 'ja-JP' })[currentLang] || 'en-US';
}

function t(key, vars = {}){
  const dict = I18N[currentLang] || I18N.en;
  const fallback = (I18N.en && I18N.en[key]) ? I18N.en[key] : key;
  let out = (dict && dict[key]) ? dict[key] : fallback;
  if (typeof out !== 'string') return String(out);
  return out.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? ''));
}

function applyStaticTranslations(){
  document.documentElement.lang = currentLang;
  document.title = t('pageTitle');

  const setText = (selector, value) => {
    const el = document.querySelector(selector);
    if (el) el.textContent = value;
  };

  setText('#item-eyebrow', t('item'));
  setText('#item-name', t('loading'));
  setText('#item-author', `${t('by')} —`);
  setText('#own-indicator', t('ownThis'));
  setText('#modal-title', t('confirmPurchaseTitle'));
  setText('#modal-body', t('confirmPurchaseBodyDefault'));
  setText('#modal-cancel', t('cancel'));
  setText('#modal-confirm', t('confirm'));
  setText('#toast', t('ok'));

  const labels = document.querySelectorAll('.info-label');
  const labelMap = [t('author'), t('type'), t('version'), t('download'), t('updated')];
  labels.forEach((el, i) => { if (labelMap[i]) el.textContent = labelMap[i]; });
}

function syncLanguageFromDoc(doc){
  currentLang = normalizeLang(doc && doc.lang);
  applyStaticTranslations();
  if (authorDoc) renderAuthor();
  if (ugcDoc) renderUGC();

    // doPurchase contains the previous onBuy logic (refactored) — after success will reload the page (added)
    async function doPurchase(){
      if(isPurchasing) return;
      if(!currentUser){ showToast(t('needLoginBuy'), 'yellow'); return; }
      const price = parseInt(ugcDoc.price || 0, 10) || 0;
      await loadCurrentUserDoc();
      const coinsStr = (currentUserDoc && currentUserDoc.coins) ? currentUserDoc.coins : '0';
      const coins = parseInt(coinsStr, 10) || 0;
      if(coins < price){ showToast(t('notEnoughCoins'), 'red'); return; }

      // guard checks
      const authorResolved = !!(authorDoc && (authorDoc['display name'] || authorDoc.displayName || authorDoc.display_name));
      if(!authorResolved){ showToast(t('ownerNotVerified'), 'red'); return; }
      const onSale = (ugcDoc.on_sale !== undefined) ? Boolean(ugcDoc.on_sale) : true;
      if(!onSale){ showToast(t('itemNotOnSale'), 'yellow'); return; }

      // ensure not already purchased in transactions
      const alreadyTx = await transactionExistsForUser(currentUser.email);
      if(alreadyTx){ showToast(t('alreadyOwnThis'), 'yellow'); await loadCurrentUserDoc(); updateActionState(); return; }

      try{
        isPurchasing = true;
        const actionBtn = document.getElementById('action-btn');
        actionBtn.disabled = true; const prevText = actionBtn.textContent; actionBtn.textContent = t('purchasing');
        window.addEventListener('beforeunload', preventUnload);

        // write transaction
        const txRef = db.collection('transactions').doc(currentUser.email).collection('records').doc(ugcDoc.id);
        await txRef.set({ amount: price, date: firebase.firestore.FieldValue.serverTimestamp(), description: ugcDoc.name || '', image: ugcDoc.image || DEFAULT_IMAGE, source: authorParam, type: 'outgoing' });

        // deduct coins (save as string)
        const newCoins = String(Math.max(0, coins - price));
        await db.collection('user_data').doc(currentUser.email).set({ coins: newCoins }, { merge: true });

        // If Role -> merge role into roles array
        if(ugcDoc.type === 'Role' && ugcDoc.rolename){ await db.collection('user_data').doc(currentUser.email).update({ roles: firebase.firestore.FieldValue.arrayUnion(ugcDoc.rolename) }); }

        // If Bundle -> add purchasedIds
        if(ugcDoc.type === 'Bundle'){ await db.collection('user_data').doc(currentUser.email).update({ purchasedIds: firebase.firestore.FieldValue.arrayUnion(ugcDoc.id) }); }

        showToast(t('purchaseComplete'), 'purple');

        // reload current user doc & UI
        await loadCurrentUserDoc();
        await updateActionState();

        // AUTO-RELOAD THE PAGE after purchase (added). small delay so toast shows.
        setTimeout(()=> { try { location.reload(); } catch(e){ /*ignore*/ } }, 800);

      }catch(err){ console.error(err); showToast(t('purchaseFailed'), 'red'); } finally{
        isPurchasing = false;
        const actionBtn = document.getElementById('action-btn');
        if(actionBtn){
          actionBtn.disabled = false;
          actionBtn.textContent = formatPrice(ugcDoc.price);
        }
        window.removeEventListener('beforeunload', preventUnload);
      }
    }

    // ---------- Improved download: detect filename from Content-Disposition, blob.type, URL, or map by ugcDoc.type ----------
    async function onDownload(){
      if(!ugcDoc || !ugcDoc.download_link){ showToast(t('noDownloadAvailable'), 'yellow'); return; }
      // only allow download if transaction exists for user
      if(!currentUser){ showToast(t('needLoginDownload'), 'yellow'); return; }
      const ownedByTx = await transactionExistsForUser(currentUser.email);
      if(!ownedByTx){ showToast(t('mustOwnDownload'), 'yellow'); return; }
      try{
        showToast(t('startingDownload'), 'purple');
        const resp = await fetch(ugcDoc.download_link);
        if(!resp.ok){ showToast(t('failedToFetchFile'), 'red'); return; }
        const blob = await resp.blob();

        // try content-disposition header for filename
        let filename = null;
        const cd = resp.headers.get('content-disposition');
        if(cd){
          // filename*=UTF-8''name or filename="name" or filename=name
          const m1 = cd.match(/filename\*=UTF-8''([^;]+)/i);
          const m2 = cd.match(/filename="([^"]+)"/i);
          const m3 = cd.match(/filename=([^;]+)/i);
          const raw = m1 ? decodeURIComponent(m1[1]) : (m2 ? m2[1] : (m3 ? m3[1] : null));
          if(raw) filename = raw.replace(/["']/g, '').trim();
        }

        // If no filename yet, try extension from blob.type (but avoid application/octet-stream)
        if(!filename){
          if(blob.type && blob.type !== 'application/octet-stream'){
            const ext = '.' + blob.type.split('/').pop();
            const base = (ugcDoc.name || 'download').replace(/[^a-z0-9\-_.]/gi,'_');
            filename = base + ext;
          }
        }

        // If still no filename, try to parse extension from URL
        if(!filename){
          try{
            const u = new URL(ugcDoc.download_link, location.href);
            const path = u.pathname || '';
            const match = path.match(/\.([a-z0-9]+)$/i);
            if(match) {
              const base = (ugcDoc.name || 'download').replace(/[^a-z0-9\-_.]/gi,'_');
              filename = base + '.' + match[1];
            }
          }catch(e){
            // ignore
          }
        }

        // Last resort: map by ugcDoc.type to the desired extension (plugin/sticker)
        if(!filename){
          const base = (ugcDoc.name || 'download').replace(/[^a-z0-9\-_.]/gi,'_');
          const t = (ugcDoc.type || '').toLowerCase();
          if(t.includes('plugin')) filename = base + '.dpplugin';
          else if(t.includes('sticker')) filename = base + '.dpfstickers';
          else filename = base; // no ext
        }

        // ensure filename isn't empty
        if(!filename) filename = 'download';

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        showToast(t('downloadComplete'), 'purple');
      }catch(err){ console.error(err); showToast(t('downloadFailed'), 'red'); }
    }

    // Migrate: create transaction record for items that exist only in purchasedIds
    async function onMigrate(){
      if(!currentUser) { showToast(t('loginFirst'), 'yellow'); return; }
      try{
        const price = parseInt(ugcDoc.price || 0, 10) || 0;
        const txRef = db.collection('transactions').doc(currentUser.email).collection('records').doc(ugcDoc.id);
        await txRef.set({ amount: price, date: firebase.firestore.FieldValue.serverTimestamp(), description: ugcDoc.name || '', image: ugcDoc.image || DEFAULT_IMAGE, source: authorParam, type: 'outgoing' });
        showToast(t('migrationComplete'), 'purple');
        await loadCurrentUserDoc();
        await updateActionState();
      }catch(e){ console.error(e); showToast(t('migrationFailed'), 'red'); }
    }

    function onViewInApp() {
      const url = `darkpurpleof://installer/${itemId}/${authorParam}/${typeParam}`;
      window.location.href = url;
    }

    // auth listener
    auth.onAuthStateChanged(async (user)=>{
      currentUser = user ? { uid: user.uid, email: user.email } : null;
      await loadCurrentUserDoc();
      updateActionState();
    });

    document.getElementById('action-btn').addEventListener('click', ()=>{});
    document.getElementById('migrate-btn').addEventListener('click', ()=>{});

    // close modal with Escape
    document.addEventListener('keydown',(e)=>{
      if(e.key === 'Escape'){
        if(modalOverlay.style.display === 'flex') closePurchaseDialog();
      }
    });

    // Move the real action buttons into the sticky mobile bar on small screens,
    // and back into the inline row on larger screens — same nodes, no duplication,
    // so all click handlers / state above keep working untouched.
    (function setupResponsiveActionSlot(){
      const inlineRow = document.getElementById('action-row');
      const mobileBar = document.getElementById('mobile-action-bar');
      const mq = window.matchMedia('(max-width: 860px)');

      function place(){
        const target = mq.matches ? mobileBar : inlineRow;
        const btns = [
          document.getElementById('action-btn'),
          document.getElementById('gift-btn'),
          document.getElementById('migrate-btn'),
          document.getElementById('view-in-app-btn')
        ];
        btns.forEach(b => { if(b && b.parentElement !== target) target.appendChild(b); });
        // re-append disclaimer text nodes to whichever row is inline (mobile shows its own mirror instead)
        const disclaimerEl = document.getElementById('action-disclaimer');
        if(disclaimerEl && disclaimerEl.parentElement !== inlineRow) inlineRow.appendChild(disclaimerEl);
      }
      place();
      mq.addEventListener ? mq.addEventListener('change', place) : mq.addListener(place);
    })();

    // Initialize
    applyStaticTranslations();
    loadUGC();
  </script>
</body>
