<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Chats</title>

  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #171717;
      --card: #1f1f1f;
      --card-2: #232323;
      --muted: #a8a8a8;
      --accent: #6b21a8;
      --accent-strong: #5b21b6;
      --text: #eaeaea;
      --border: rgba(255,255,255,0.08);
      --sidebar: #121212;
      --sidebar-2: #191919;
      --panel: #1b1b1b;
      --panel-alt: #202020;
      --shadow: 0 18px 50px rgba(0,0,0,.28);
      --radius-xl: 22px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }
    body.light {
      --bg: #f4f6fb;
      --card: #ffffff;
      --card-2: #eef2f8;
      --muted: #4a5568;
      --accent: #7c3aed;
      --accent-strong: #6d28d9;
      --text: #0f172a;
      --border: rgba(15,23,42,0.08);
      --sidebar: #ffffff;
      --sidebar-2: #f8fafc;
      --panel: #ffffff;
      --panel-alt: #f8fafc;
      --shadow: 0 14px 40px rgba(15,23,42,.08);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent), var(--accent-strong)); border-radius: 999px; }

    dp-topbar { display:block; position:sticky; top:0; z-index:120; }

    .app {
      height: calc(100dvh - 60px);
      width: 100vw;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 40%);
    }

    .sidebar {
      height: 100%;
      background: linear-gradient(180deg, var(--sidebar), var(--sidebar-2));
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 18px 18px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(16px);
    }

    .sidebar-brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .sidebar-brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-brand span {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .sidebar-toolbar {
      padding: 14px 18px;
      display: grid;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .search {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      outline: none;
      font: inherit;
    }
    .search::placeholder { color: color-mix(in srgb, var(--muted) 78%, transparent); }

    .sidebar-list {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-item {
      border: 1px solid transparent;
      background: transparent;
      border-radius: 18px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      min-width: 0;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .chat-item:hover {
      background: rgba(255,255,255,0.03);
      transform: translateY(-1px);
    }
    .chat-item.active {
      background: linear-gradient(180deg, rgba(107,33,168,0.24), rgba(107,33,168,0.12));
      border-color: rgba(107,33,168,0.28);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .avatar, .avatar.small, .chat-avatar, .composer-preview-thumb, .msg-author-avatar, .profile-picture {
      border-radius: 50%;
    }
    .avatar {
      width: 48px;
      height: 48px;
      object-fit: cover;
      flex: 0 0 auto;
      background: var(--card-2);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .avatar.small { width: 38px; height: 38px; box-shadow: none; }

    .chat-info {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .chat-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-verified {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      vertical-align: middle;
    }
    .chat-preview {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item.unread {
      background: rgba(107,33,168,0.08);
      border-color: rgba(107,33,168,0.2);
    }
    .chat-name.unread,
    .chat-preview.unread,
    .chat-time.unread {
      color: var(--text);
      font-weight: 700;
    }
    .chat-meta {
      margin-left: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex: 0 0 auto;
    }
    .chat-time {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .chat-pill {
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-size: 11px;
      font-weight: 700;
    }

    .sidebar-action-menu {
      position: fixed;
      z-index: 40;
      min-width: 200px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar-action-menu.hidden { display: none; }
    .sidebar-action-menu button {
      border: none;
      border-radius: 10px;
      padding: 9px 10px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    .sidebar-action-menu button:hover {
      background: rgba(255,255,255,0.06);
    }
    .sidebar-action-menu .menu-title {
      padding: 6px 10px 8px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mobile-sidebar-toggle {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .chat-panel {
      position: relative;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    .chat-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      opacity: 0.92;
      transition: filter .16s ease, opacity .16s ease, background-size .16s ease;
    }
    .chat-bg.hidden { display: none; }

    .chat-topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      backdrop-filter: blur(18px);
      min-height: 70px;
    }
    .chat-topbar .back-btn {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
    }
    .chat-topbar-info {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .chat-topbar-text {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .chat-topbar-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .chat-topbar-subtitle {
      font-size: 12px;
      color: var(--muted);
    }
    .chat-topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .12s ease, color .12s ease, transform .12s ease;
      flex: 0 0 auto;
      padding: 0;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); transform: none; }

    .messages-wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px 18px 12px;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }

    .date-sep {
      align-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      margin: 10px 0 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 100%;
      min-width: 0;
    }
    .msg-row.mine { align-items: flex-end; }
    .msg-row.their { align-items: flex-start; }

    .msg-bubble {
      max-width: min(760px, 82%);
      padding: 13px 14px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      word-wrap: break-word;
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: var(--shadow);
    }
    .msg-bubble.mine {
      background: linear-gradient(180deg, var(--accent), var(--accent-strong));
      border-color: rgba(255,255,255,0.08);
      color: #fff;
      border-bottom-right-radius: 7px;
    }
    .msg-bubble.their {
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border-bottom-left-radius: 7px;
    }

    .msg-text {
      font-size: 15px;
      line-height: 1.45;
    }
    .inline-code {
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(0,0,0,0.18);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }
    .msg-bubble.their .inline-code { background: rgba(255,255,255,0.08); }

    .rich-red { color: #ff6460; }
    .rich-cyan { color: #5de7ff; }
    .rich-green { color: #44d38c; }
    .rich-blue { color: #63a4ff; }
    .rich-yellow { color: #ffd55c; }

    .msg-images {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }
    .msg-images.count-1 { grid-template-columns: 1fr; }
    .msg-images.count-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .msg-images.count-3,
    .msg-images.count-4,
    .msg-images.count-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .msg-image {
      width: 100%;
      display: block;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      object-fit: cover;
      cursor: pointer;
      max-height: 340px;
      background: rgba(255,255,255,0.03);
    }
    .msg-image.single { max-height: 420px; }

    .msg-files {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .file-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      text-decoration: none;
      color: var(--text);
      overflow: hidden;
      cursor: pointer;
      width: 100%;
      text-align: left;
      font: inherit;
    }
    .file-card:hover { background: rgba(255,255,255,0.07); }
    .file-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(107,33,168,0.18);
      flex: 0 0 auto;
      font-size: 18px;
    }
    .file-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }
    .file-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-url {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .msg-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      padding: 0 2px;
    }
    .msg-row.mine .msg-footer { justify-content: flex-end; }
    .msg-status {
      font-weight: 700;
    }

    .composer-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-shrink: 0;
      padding: 22px 16px calc(28px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: color-mix(in srgb, var(--panel) 90%, transparent);
      backdrop-filter: blur(18px);
    }

    .composer {
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--card) 90%, transparent);
      border-radius: 16px;
      padding: 14px 14px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-areas:
        "previews previews previews"
        "tools input actions";
      gap: 10px 12px;
      align-items: center;
      position: relative;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: visible;
    }
    .composer-previews {
      grid-area: previews;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .composer-previews {
      grid-area: previews;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .composer-previews::-webkit-scrollbar {
      display: none;
    }

    .composer-preview-card {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .composer-preview-card--image {
      padding: 0;
    }
    .composer-preview-card--file {
      padding: 8px;
      flex-direction: column;
      gap: 6px;
      text-align: center;
      color: var(--text);
    }
    .composer-preview-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.04);
      border-radius: 0;
    }
    .composer-preview-card--file .composer-preview-card__emoji {
      font-size: 22px;
    }
    .composer-preview-card--file .composer-preview-card__format {
      font-size: 10px;
    }
    .composer-preview-card--file .composer-preview-card__name {
      font-size: 10px;
      line-height: 1.2;
      -webkit-line-clamp: 2;
    }
    .composer-preview-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5,5,5,0.45);
      backdrop-filter: blur(2px);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
    }
    .composer-preview-overlay .composer-preview-spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.28);
      border-top-color: #fff;
      animation: composer-spin 0.8s linear infinite;
    }
    .composer-preview-overlay .composer-preview-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: rgba(255,213,92,0.95);
      color: #1f1a02;
      font-size: 16px;
      font-weight: 900;
    }
    .composer-preview-card__emoji {
      font-size: 28px;
      line-height: 1;
    }
    .composer-preview-card__format {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .composer-preview-card__name {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .composer-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.78);
      color: #fff;
      cursor: pointer;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
      z-index: 3;
      padding: 0;
    }
    @keyframes composer-spin {
      to { transform: rotate(360deg); }
    }

    .composer-field {
      position: relative;
      min-height: 0;
      display: flex;
      align-items: center;
    }

    .composer-preview, .composer-textarea {
      width: 100%;
      min-height: 36px;
      max-height: 140px;
      padding: 8px 2px;
      border-radius: 0;
      font: inherit;
      line-height: 1.4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      overflow-y: hidden;
    }

    .composer-preview {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: var(--text);
      background: transparent;
    }
    .composer-preview.empty {
      color: var(--muted);
    }
    .composer-placeholder {
      opacity: .7;
    }

    .composer-textarea {
      position: relative;
      z-index: 1;
      background: transparent;
      color: transparent;
      caret-color: var(--text);
      border: none;
      outline: none;
      resize: none;
      overflow: hidden;
      min-height: 36px;
      padding: 8px 2px;
    }
    .composer-textarea::placeholder { color: transparent; }

    .composer-actions {
      grid-area: actions;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 0;
    }

    .composer-tools {
      grid-area: tools;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .attachment-menu-wrap {
      position: relative;
      display: inline-flex;
    }

    .attachment-menu {
      position: absolute;
      left: 0;
      bottom: calc(100% + 8px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      box-shadow: var(--shadow);
      z-index: 5;
    }

    .attachment-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      border: none;
      border-radius: 10px;
      padding: 9px 10px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .attachment-menu-item:hover {
      background: rgba(255,255,255,0.06);
    }

    .attachment-menu-item.disabled,

      height: 22px;

      flex: 0 0 auto;

        height: 24px;

      height: 44px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(91,33,182,.24);
      padding: 0;
    }

    .hidden-file-input {
      display: none;
    }

    .send-btn img {
      width: 18px;
      height: 18px;
      filter: none;
    }
    .send-btn:disabled,
    .icon-btn:disabled,
    .composer-remove:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .empty-state {
      position: relative;
      z-index: 1;
      margin: auto;
      max-width: 560px;
      width: calc(100% - 32px);
      border: 1px dashed var(--border);
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      box-shadow: var(--shadow);
    }
    .empty-state h2 {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    .empty-state p { margin: 0; line-height: 1.6; }

    .composer-disabled-note {
      display: none;
    }

    dialog {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
      width: min(92vw, 460px);
      padding: 0;
    }
    dialog::backdrop { background: rgba(0,0,0,.56); backdrop-filter: blur(4px); }
    .dialog-card {
      padding: 18px;
      display: grid;
      gap: 14px;
    }
    .dialog-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .dialog-title h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.02em;
    }
    .dialog-title span {
      color: var(--muted);
      font-size: 12px;
    }
    .dialog-input {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      outline: none;
      font: inherit;
    }
    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .dialog-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .dialog-btn.primary {
      background: linear-gradient(180deg, var(--accent), var(--accent-strong));
      border: none;
    }


    .composer-tools-row {
      display: contents;
    }

    .composer-hint {
      display: none;
    }

    .composer-input {
      grid-area: input;
      width: 100%;
      min-height: 56px;
      max-height: 160px;
      padding: 12px 12px;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
      font: inherit;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      overflow: hidden;
      overflow-y: hidden;
      box-sizing: border-box;
      caret-color: var(--text);
      scrollbar-width: none;
    }
    .composer-input::-webkit-scrollbar { width: 0; height: 0; display: none; }
    .composer-input:empty::before {
      content: attr(data-placeholder);
      color: var(--muted);
      opacity: .72;
      pointer-events: none;
    }
    .composer-input:focus {
      outline: none;
      box-shadow: none;
    }
    .composer-input .inline-code {
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 2px 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .composer-input .rich-red { color: #ff6b6b; }
    .composer-input .rich-cyan { color: #22d3ee; }
    .composer-input .rich-green { color: #22c55e; }
    .composer-input .rich-blue { color: #60a5fa; }
    .composer-input .rich-yellow { color: #fbbf24; }
    .composer-input .composer-link {
      color: #8ab4ff;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .msg-link {
      color: #8ab4ff;
      text-decoration: underline;
      text-underline-offset: 2px;
      word-break: break-word;
    }

    .msg-attachments {
      display: grid;
      gap: 10px;
      margin-bottom: 10px;
    }

    .msg-images {
      display: grid;
      gap: 8px;
    }
    .msg-images.count-1 { grid-template-columns: 1fr; }
    .msg-images.count-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .msg-images.count-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .msg-image {
      width: 100%;
      border-radius: 16px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      max-height: 280px;
    }
    .msg-image.single {
      max-height: 360px;
    }

    .msg-files {
      display: grid;
      gap: 8px;
    }
    .file-card,
    .special-card {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      text-decoration: none;
      padding: 12px;
      overflow: hidden;
    }
    .special-card {
      cursor: pointer;
      flex-direction: column;
      align-items: stretch;
      padding: 14px;
      background: rgba(255,255,255,0.03);
    }
    .special-card img {
      max-width: 100%;
      border-radius: 14px;
      display: block;
    }
    .file-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.06);
      flex: 0 0 auto;
      font-size: 18px;
    }
    .file-meta, .special-card .card-meta {
      min-width: 0;
      flex: 1;
      display: grid;
      gap: 3px;
    }
    .file-name, .card-title {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-url, .card-subtitle {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pending-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .msg-row.local .msg-bubble {
      border-style: dashed;
      opacity: 0.95;
    }

    .msg-row .msg-bubble {
      max-width: min(72%, 780px);
    }
    .msg-row.mine .msg-bubble { margin-left: auto; }
    .msg-row.their .msg-bubble { margin-right: auto; }

    @media (max-width: 860px) {
      .msg-row .msg-bubble {
        max-width: 92%;
      }
      .composer-input {
        min-height: 48px;
        padding: 10px 16px;
      }
      .composer {
        align-items: center;
      }
      .composer-tools-row {
        align-items: center;
      }
      .send-btn {
        display: inline-flex;
      }
    }

    #toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      box-shadow: var(--shadow);
      display: none;
      max-width: calc(100vw - 32px);
      text-align: center;
    }
    #toast.purple { background: var(--accent-strong); color: #fff; }
    #toast.yellow { background: #e6b800; color: #111; }
    #toast.red { background: #cf3c3c; color: #fff; }

    .hidden { display: none !important; }

    @media (max-width: 980px) {
      .app { grid-template-columns: 300px 1fr; }
      .msg-bubble { max-width: 90%; }
    }

    @media (max-width: 860px) {
      html, body { overflow: hidden; }
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: absolute;
        inset: 0;
        z-index: 30;
        width: 100%;
        transform: translateX(0);
        transition: transform .2s ease, opacity .2s ease;
      }
      body.chat-open-mobile .sidebar {
        transform: translateX(-100%);
        opacity: 0;
        pointer-events: none;
      }
      body.chat-open-mobile .chat-panel {
        display: flex;
      }
      .chat-panel {
        width: 100%;
      }
      .chat-topbar .back-btn { display: inline-flex; }
      .mobile-sidebar-toggle { display: inline-flex; }
      .msg-bubble { max-width: 94%; }
      .composer-actions { align-items: stretch; }
      .send-btn { padding-inline: 16px; }
    }

    @media (max-width: 560px) {
      .sidebar-header { padding: 16px; }
      .sidebar-toolbar { padding: 12px 16px; }

        border-radius: 18px;
        padding: 7px 8px;
      }
      .composer-input {
        min-height: 40px;
        padding: 8px 8px;
      }
      .msg-bubble { padding: 12px 12px; }
      .msg-text { font-size: 14px; }
      .chat-name { font-size: 13px; }

    function detectLegacyAttachments(text) {

    function safeUrl(url) {
      try {

        if (!/^https?:$/.test(u.protocol)) return null;

      } catch {

    function linkifyHtml(s) {
      return s.replace(/((?:https?:\/\/)[^\s<>"']+)/gi, (m) => {
        const safe = safeUrl(m);
        if (!safe) return m;
        return '<a class="msg-link" href="' + escapeHtml(safe) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(m) + '</a>';
      });

    function renderRichText(raw) {
      if (!raw) return '';
      let s = escapeHtml(raw);

      s = s.replace(/`([\s\S]*?)`/g, '<code class="inline-code" data-token="code">$1</code>');
      s = s.replace(/\*([^*\n]+)\*/g, '<strong data-token="bold">$1</strong>');
      s = s.replace(/_([^_\n]+)_/g, '<em data-token="italic">$1</em>');

      const colors = {
        red: 'rich-red',
        cyan: 'rich-cyan',
        green: 'rich-green',
        blue: 'rich-blue',
        yellow: 'rich-yellow'
      };
      s = s.replace(/&lt;(red|cyan|green|blue|yellow)&gt;([\s\S]*?)&lt;\/\1&gt;/gi, (_, c, content) => {
        const cls = colors[c.toLowerCase()];
        return '<span data-token="color-' + c.toLowerCase() + '" class="' + cls + '">' + content + '</span>';
      });

      s = linkifyHtml(s);
      s = s.replace(/\n/g, '<br>');
      return s;
    }

    function normalizeMessagePayload(data) {
      const base = {
        text: data?.text || '',
        images: Array.isArray(data?.images) ? [...data.images] : [],
        files: Array.isArray(data?.files) ? [...data.files] : []
      };
      const legacy = detectLegacyAttachments(base.text);
      if (!base.images.length && legacy.images.length) base.images = legacy.images;
      if (!base.files.length && legacy.files.length) base.files = legacy.files;
      base.text = legacy.text;
      return base;
    }

    function previewFromMessage(data) {
      const payload = normalizeMessagePayload(data);
      const text = (payload.text || '').trim();
      let result = '';
      if (payload.images.length && !text) result = '📷 Image';
      else if (payload.files.length && !text) result = '📎 File';
      else if (payload.images.length) result = '📷 ' + truncate(text || 'Image');
      else if (payload.files.length) result = '📎 ' + truncate(text || 'File');
      else result = truncate((text || '').replace(/<[^>]+>/g, ''));
      return renderRichText(result);
    }

    function formatSidebarTimestamp(ts) {
      try {
        let d = null;
        if (!ts) return '';
        if (typeof ts.toDate === 'function') d = ts.toDate();
        else if (ts instanceof Date) d = ts;
        else if (typeof ts === 'number') d = new Date(ts);
        else return '';

        const today = new Date();
        const startToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const startYesterday = new Date(startToday);
        startYesterday.setDate(startYesterday.getDate() - 1);
        const startDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());

        if (startDate.getTime() === startToday.getTime()) {
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        if (startDate.getTime() === startYesterday.getTime()) {
          return 'Yesterday';
        }
        return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
      } catch {
        return '';
      }
    }

    function buildSidebarPreview(message) {
      const currentUserEmail = state.currentUser?.email || '';
      const currentUserName = getCurrentUserDisplayName();
      const payload = normalizeMessagePayload(message);
      const text = (payload.text || '').trim();
      let previewText = '';

      if (payload.images.length && !text) previewText = t('sidebarImage');
      else if (payload.files.length && !text) previewText = t('sidebarFile');
      else if (!text && !payload.images.length && !payload.files.length) previewText = '';
      else previewText = truncate(text || (payload.images.length ? t('sidebarImage') : payload.files.length ? t('sidebarFile') : ''));

      const isFromCurrentUser = (message?.senderId || '') === currentUserEmail;
      const isUnreadIncoming = !isFromCurrentUser && Boolean(message?.read === false && message?.senderId);

      if (isFromCurrentUser) {
        const displayName = currentUserName || 'You';
        const content = previewText || t('sidebarSentMessage');
        return {
          html: escapeHtml(displayName + ': ' + content),
          text: displayName + ': ' + content,
          isFromCurrentUser,
          isUnreadIncoming: false,
          unread: false
        };
      }

      const html = previewText ? (isUnreadIncoming ? '<strong>' + renderRichText(previewText) + '</strong>' : renderRichText(previewText)) : '';
      return {
        html,
        text: previewText,
        isFromCurrentUser,
        isUnreadIncoming,
        unread: isUnreadIncoming
      };
    }

    function detectSpecialDarkPurpleUrls(text) {
      const results = [];
      const urlRegex = /https?:\/\/(?:www\.)?darkpurpleof\.github\.io\/([^?\s]+)(?:\?([^\s]+))?/gi;
      let match;
      while ((match = urlRegex.exec(text)) !== null) {
        const path = match[1];
        const query = match[2] || '';
        const fullUrl = match[0];
        let special = null;
        if (path === 'profile') {
          const params = new URLSearchParams(query);
          const email = params.get('email');
          if (email) special = { type: 'profile', email };
        } else if (path === 'chat') {
          const params = new URLSearchParams(query);
          const id = params.get('id') || params.get('email');
          if (id) special = { type: 'chat', id };
        } else if (path === 'ugc/viewugc') {
          const params = new URLSearchParams(query);
          const id = params.get('id');
          const author = params.get('author');
          const type = params.get('type');
          if (id && author && type) special = { type: 'ugc', id, author, collType: type };
        } else if (path === 'posts' || path.startsWith('posts/')) {
          const params = new URLSearchParams(query);
          const id = params.get('id');
          if (id) special = { type: 'post', id };
        }
        if (special) results.push({ url: fullUrl, special });
      }
      return results;
    }

        return createPostCardElement(url, full);

    function createPostCardElement(url, data) {
      const card = document.createElement('div');
      card.className = 'special-card post-card';

      const title = document.createElement('div');

      }
      return card;
    }

    function serializeComposerNode(node) {
      if (!node) return '';
      if (node.nodeType === Node.TEXT_NODE) return node.textContent || '';
      if (node.nodeType !== Node.ELEMENT_NODE) return '';
      if (node.tagName === 'BR') return '\n';
      const el = node;
      const children = Array.from(el.childNodes).map(serializeComposerNode).join('');
      const token = el.dataset ? el.dataset.token : '';
      if (token === 'bold') return '*' + children + '*';
      if (token === 'italic') return '_' + children + '_';
      if (token === 'code') return '`' + children + '`';
      if (token && token.startsWith('color-')) return '<' + token.slice(6) + '>' + children + '</' + token.slice(6) + '>';
      return children;
    }

    function serializeComposerContent() {
      return Array.from(els.composerInput.childNodes).map(serializeComposerNode).join('').replace(/\r/g, '');
    }

    function renderComposerMarkup(raw) {
      if (!raw) return '';
      let s = escapeHtml(raw);
      s = s.replace(/`([\s\S]*?)`/g, '<span class="inline-code" data-token="code">$1</span>');
      s = s.replace(/\*([^*\n]+)\*/g, '<strong data-token="bold">$1</strong>');
      s = s.replace(/_([^_\n]+)_/g, '<em data-token="italic">$1</em>');
      const colors = { red: 'rich-red', cyan: 'rich-cyan', green: 'rich-green', blue: 'rich-blue', yellow: 'rich-yellow' };
      s = s.replace(/&lt;(red|cyan|green|blue|yellow)&gt;([\s\S]*?)&lt;\/\1&gt;/gi, (_, c, content) => '<span data-token="color-' + c.toLowerCase() + '" class="' + colors[c.toLowerCase()] + '">' + content + '</span>');
      s = s.replace(/((?:https?:\/\/)[^\s<>"']+)/gi, (m) => {
        const safe = safeUrl(m);
        if (!safe) return m;
        return '<a class="composer-link" data-token="link" href="' + escapeHtml(safe) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(m) + '</a>';
      });
      return s.replace(/\n/g, '<br>');
    }

    function revokeComposerPreview(entry) {
      if (!entry || !entry.previewUrl || !entry.previewUrl.startsWith('blob:')) return;
      try { URL.revokeObjectURL(entry.previewUrl); } catch (_) {}
    }

    function normalizeComposerAttachment(entry, kind) {
      if (!entry) return null;
      if (typeof entry === 'string') {
        return {
          id: `${kind}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          kind,
          status: 'ready',
          url: entry,
          name: '',
          type: '',
          previewUrl: null,
          errorMessage: ''
        };
      }
      return {
        id: entry.id || `${kind}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
        kind: entry.kind || kind,
        status: entry.status || 'ready',
        url: entry.url || entry.link || entry.full_url || entry.downloadUrl || null,
        name: entry.name || entry.fileName || '',
        type: entry.type || '',
        previewUrl: entry.previewUrl || null,
        errorMessage: entry.errorMessage || ''
      };
    }

    function getComposerAttachmentName(entry, fallback = 'Attachment') {
      const normalized = normalizeComposerAttachment(entry, entry && entry.kind ? entry.kind : 'file');
      if (normalized && normalized.name) return normalized.name;
      return fallback;
    }

    function getComposerAttachmentFormat(entry) {
      const normalized = normalizeComposerAttachment(entry, entry && entry.kind ? entry.kind : 'file');
      if (normalized && normalized.type) {
        const type = String(normalized.type).split('/').pop();
        if (type) return type.toUpperCase();
      }
      if (normalized && normalized.name) {
        const ext = String(normalized.name).split('.').pop();
        if (ext && ext.length <= 5) return ext.toUpperCase();
      }
      return 'FILE';
    }

    function hasBlockingComposerAttachments() {
      const imagesBlocked = state.localAttachments.images.some(item => {
        const normalized = normalizeComposerAttachment(item, 'image');
        return normalized && (normalized.status === 'uploading' || normalized.status === 'error');
      });
      const fileBlocked = state.localAttachments.file && (() => {
        const normalized = normalizeComposerAttachment(state.localAttachments.file, 'file');
        return normalized && (normalized.status === 'uploading' || normalized.status === 'error');
      })();
      return imagesBlocked || Boolean(fileBlocked);
    }

    async function attachPickedFile(kind, file) {
      if (!file) return;
      if (kind === 'image') {
        if (state.localAttachments.images.length >= 5) {
          showToast(t('maxImages'), 'yellow');
          return;
        }
      } else if (kind === 'file') {
        if (state.localAttachments.file) {
          showToast(t('maxFiles'), 'yellow');
          return;
        }
      }

      const previewUrl = kind === 'image' ? URL.createObjectURL(file) : null;
      const entry = {
        id: `${kind}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
        kind,
        status: 'uploading',
        name: file.name || (kind === 'image' ? 'Image' : 'File'),
        type: file.type || '',
        previewUrl,
        url: null,
        errorMessage: ''
      };

      if (kind === 'image') {
        state.localAttachments.images.push(entry);
      } else {
        state.localAttachments.file = entry;
      }
      syncComposerAttachments();
      saveDraftState();

      let uploadUrl = null;
      try {
        if (window.CatboxUploader && typeof window.CatboxUploader.upload === 'function') {
          const result = await Promise.race([
            (async () => {
              try {
                return await window.CatboxUploader.upload(file);
              } catch (err) {
                return { success: false, error: err && err.message ? err.message : 'Upload failed' };
              }
            })(),
            new Promise((resolve) => setTimeout(() => resolve({ success: false, error: 'Upload timed out' }), 20000))
          ]);
          if (result && result.success) {
            uploadUrl = result.url || result.full_url || result.file_url || result.link || result.downloadUrl || null;
          } else if (result && result.error) {
            entry.errorMessage = result.error;
          }
        }
      } catch (err) {
        entry.errorMessage = err && err.message ? err.message : 'Upload failed';
        console.warn('Catbox upload failed', err);
      }

      if (uploadUrl) {
        entry.status = 'ready';
        entry.url = uploadUrl;
        revokeComposerPreview(entry);
        entry.previewUrl = null;
      } else {
        entry.status = 'error';
        entry.url = null;
        revokeComposerPreview(entry);
        entry.previewUrl = null;
      }

      syncComposerAttachments();
      saveDraftState();
    }

        remove.onclick = () => {
          const entryToRemove = state.localAttachments.images[idx];
          revokeComposerPreview(entryToRemove);
          state.localAttachments.images.splice(idx, 1);
          syncComposerAttachments();
          saveDraftState();
        };

        card.appendChild(remove);
        els.composerPreviews.appendChild(card);
      });

      if (file) {
        const normalized = normalizeComposerAttachment(file, 'file');
        if (normalized) {
          const card = document.createElement('div');
          card.className = 'composer-preview-card composer-preview-card--file';

          if (normalized.status === 'uploading') {
            const overlay = document.createElement('div');
            overlay.className = 'composer-preview-overlay';
            const spinner = document.createElement('div');
            spinner.className = 'composer-preview-spinner';
            overlay.appendChild(spinner);
            card.appendChild(overlay);
          } else if (normalized.status === 'error') {
            const overlay = document.createElement('div');
            overlay.className = 'composer-preview-overlay';
            const badge = document.createElement('div');
            badge.className = 'composer-preview-status';
            badge.textContent = '!';
            overlay.appendChild(badge);
            card.appendChild(overlay);
          }

          const icon = document.createElement('div');
          icon.className = 'composer-preview-card__emoji';
          icon.textContent = '📎';

          const format = document.createElement('div');
          format.className = 'composer-preview-card__format';
          format.textContent = getComposerAttachmentFormat(normalized);

          const name = document.createElement('div');
          name.className = 'composer-preview-card__name';
          name.textContent = getComposerAttachmentName(normalized, 'File');

          card.appendChild(icon);
          card.appendChild(format);
          card.appendChild(name);

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'composer-remove';
          remove.textContent = '×';
          remove.onclick = () => {
            revokeComposerPreview(state.localAttachments.file);
            state.localAttachments.file = null;
            syncComposerAttachments();
            saveDraftState();
          };

          card.appendChild(remove);
          els.composerPreviews.appendChild(card);
        }
      }

      els.sendBtn.disabled = Boolean(els.sendBtn.disabled || hasBlockingComposerAttachments());
      updateAttachmentMenuState();
      saveDraftState();
    }

    async function findOrCreateChat(email) {
      const snaps = await db.collection('chats')
        .where('users', 'array-contains', state.currentUser.email)
        .get();

      for (const doc of snaps.docs) {
        const users = doc.data().users || [];
        if (users.includes(email)) return doc.id;

      const other = await db.collection('user_data').doc(email).get();

      const ref = await db.collection('chats').add({

        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      return ref.id;

    async function renderMessage(data, id) {
      const payload = normalizeMessagePayload(data);
      const isMine = data.senderId === state.currentUser.email;
      const isLocal = data.local === true || data.status === 'failed' || data.status === 'sending' || data.status === 'local';

      const row = document.createElement('div');
      row.className = 'msg-row ' + (isMine ? 'mine' : 'their') + (isLocal ? ' local' : '');
      row.id = 'msg-' + id;

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble ' + (isMine ? 'mine' : 'their');

      const attachments = document.createElement('div');
      attachments.className = 'msg-attachments';

      if (payload.images.length) {
        const count = Math.min(payload.images.length, 5);
        const grid = document.createElement('div');
        grid.className = 'msg-images ' + (count <= 1 ? 'count-1' : count === 2 ? 'count-2' : 'count-3');
        payload.images.slice(0, 5).forEach((url) => {
          const img = document.createElement('img');
          img.className = 'msg-image' + (count === 1 ? ' single' : '');
          img.src = url;
          img.alt = 'Image';
          img.loading = 'lazy';
          img.onerror = () => { img.style.display = 'none'; };
          img.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (window.ImageViewer && typeof window.ImageViewer.open === 'function') {
              window.ImageViewer.open({ imageUrl: url, authorEmail: data.senderId, secure: false, advancedMode: true });
            } else {
              window.open(url, '_blank', 'noopener');
            }
          };
          grid.appendChild(img);
        });
        attachments.appendChild(grid);
      }

      if (payload.files.length) {
        const filesWrap = document.createElement('div');
        filesWrap.className = 'msg-files';
        payload.files.slice(0, 5).forEach(url => filesWrap.appendChild(buildMsgFileCard(url)));
        attachments.appendChild(filesWrap);
      }

      const detected = detectSpecialDarkPurpleUrls(payload.text || '');
      let textForRender = payload.text || '';

      if (attachments.childNodes.length) bubble.appendChild(attachments);

      for (const { url, special } of detected) {
        textForRender = removeFirstOccurrenceOfUrl(textForRender, url);
        let cardElement = null;
        if (special.type === 'profile') cardElement = await renderProfileCard(url, special.email);
        else if (special.type === 'chat') cardElement = await renderChatCard(url, special.id);
        else if (special.type === 'ugc') cardElement = await renderUGCCard(url, special.id, special.author, special.collType);
        else if (special.type === 'post') cardElement = await renderPostCard(url, special.id);
        if (cardElement) bubble.appendChild(cardElement);
      }

      const text = document.createElement('div');
      text.className = 'msg-text';
      text.innerHTML = renderRichText(textForRender);
      bubble.appendChild(text);

      row.appendChild(bubble);

      const footer = document.createElement('div');
      footer.className = 'msg-footer';

      const time = document.createElement('div');
      time.textContent = formatTime(data.timestamp);
      footer.appendChild(time);

      if (isMine) {
        const status = document.createElement('div');
        status.className = 'msg-status';
        if (data.status === 'sending') status.textContent = 'Sending';
        else if (data.status === 'failed' || data.local) status.textContent = 'Not sent';
        else if (data.status === 'local') status.textContent = 'Draft';
        else status.textContent = data.read ? 'Read' : 'Sent';
        footer.appendChild(status);
      }

      if (data.local === true) {
        const pill = document.createElement('div');
        pill.className = 'pending-pill';
        pill.textContent = 'Pending';
        footer.appendChild(pill);
      }

      row.appendChild(footer);
      return row;
    }

    async function listenMessages(chatId, token = state.openChatToken) {
      if (state.messagesUnsub) {
        try { state.messagesUnsub(); } catch {}
        state.messagesUnsub = null;
      }

      state.messageDocs = new Map();
      state.messageOrder = [];
      state.oldestMessageDoc = null;
      state.reachedStart = false;
      state.loadingOlder = false;

      function isStale() {
        return token !== state.openChatToken || state.currentChatId !== chatId;
      }

      function sortMessages() {
        return Array.from(state.messageDocs.values()).sort((a, b) => {
          const at = a.data.timestamp?.toMillis ? a.data.timestamp.toMillis() : (a.data.timestamp instanceof Date ? a.data.timestamp.getTime() : (a.data.timestamp || 0));
          const bt = b.data.timestamp?.toMillis ? b.data.timestamp.toMillis() : (b.data.timestamp instanceof Date ? b.data.timestamp.getTime() : (b.data.timestamp || 0));
          return at - bt;
        });
      }

      async function renderAll() {
        if (isStale()) return;
        els.messages.innerHTML = '';
        let lastDate = null;
        for (const item of sortMessages()) {
          if (isStale()) return;
          const data = item.data;
          const dateKey = data.timestamp ? data.timestamp.toDate().toDateString() : '';
          if (dateKey && dateKey !== lastDate) {
            lastDate = dateKey;
            const sep = document.createElement('div');
            sep.className = 'date-sep';
            sep.textContent = formatDate(data.timestamp);
            els.messages.appendChild(sep);
          }
          const node = await renderMessage(data, item.id);
          if (isStale()) return;
          els.messages.appendChild(node);
        }
      }

      async function loadOlderPage() {
        if (isStale() || state.loadingOlder || state.reachedStart || !state.oldestMessageDoc) return;
        state.loadingOlder = true;
        const prevTop = els.messagesWrap.scrollTop;
        const prevHeight = els.messagesWrap.scrollHeight;

        try {
          const olderSnap = await db.collection('chats')
            .doc(chatId)
            .collection('messages')
            .orderBy('timestamp', 'desc')
            .startAfter(state.oldestMessageDoc)
            .limit(10)
            .get();

          if (isStale()) return;
          if (olderSnap.empty) {
            state.reachedStart = true;
            return;
          }

          olderSnap.docs.forEach(docSnap => {
            if (!state.messageDocs.has(docSnap.id)) {
              state.messageDocs.set(docSnap.id, { id: docSnap.id, data: docSnap.data() });
            }
          });
          state.oldestMessageDoc = olderSnap.docs[olderSnap.docs.length - 1];
          await renderAll();
          if (isStale()) return;
          els.messagesWrap.scrollTop = Math.max(0, prevTop + (els.messagesWrap.scrollHeight - prevHeight));
        } finally {
          state.loadingOlder = false;
        }
      }

      els.messagesWrap.onscroll = () => {
        if (els.messagesWrap.scrollTop < 140) loadOlderPage();
      };

      state.messagesUnsub = db.collection('chats')
        .doc(chatId)
        .collection('messages')
        .orderBy('timestamp', 'desc')
        .limit(10)
        .onSnapshot(async snap => {
          if (isStale()) return;
          const wasAtBottom = (els.messagesWrap.scrollHeight - els.messagesWrap.scrollTop - els.messagesWrap.clientHeight) < 160;
          const prevTop = els.messagesWrap.scrollTop;
          const prevHeight = els.messagesWrap.scrollHeight;

          snap.docs.forEach(docSnap => {
            state.messageDocs.set(docSnap.id, { id: docSnap.id, data: docSnap.data() });
          });
          if (!state.oldestMessageDoc && snap.docs.length) {
            state.oldestMessageDoc = snap.docs[snap.docs.length - 1];
          }

          const pending = loadPendingMessages(chatId);
          pending.forEach(m => {
            state.messageDocs.set(m.id, { id: m.id, data: { ...m, local: true } });
          });

          await renderAll();
          if (isStale()) return;

          for (const docSnap of snap.docs) {
            const data = docSnap.data();
            if (data.senderId !== state.currentUser.email && !data.read) {
              db.collection('chats').doc(chatId).collection('messages').doc(docSnap.id).update({
                read: true,
                readAt: firebase.firestore.FieldValue.serverTimestamp()
              }).catch(() => {});
            }
          }

          if (wasAtBottom) {
            els.messagesWrap.scrollTop = els.messagesWrap.scrollHeight;
          } else {
            els.messagesWrap.scrollTop = Math.max(0, prevTop + (els.messagesWrap.scrollHeight - prevHeight));
          }
          applyChatBackground();
        });
    }

    async function listenChat(chatId) {
      if (state.chatUnsub) {
        try { state.chatUnsub(); } catch {}
        state.chatUnsub = null;
      }
      if (state.userDataUnsub) {
        try { state.userDataUnsub(); } catch {}
        state.userDataUnsub = null;
      }

      state.chatUnsub = db.collection('chats').doc(chatId).onSnapshot(async doc => {
        const data = doc.data();
        if (!data) return;
        const other = (data.users || []).find(u => u !== state.currentUser.email);
        if (!other) return;

        state.otherUserEmail = other;
        if (state.userDataUnsub) {
          try { state.userDataUnsub(); } catch {}
          state.userDataUnsub = null;

        state.userDataUnsub = db.collection('user_data').doc(other).onSnapshot(async userDoc => {

          renderChatHeader(other, otherData);

        async function refreshChatListSnapshot() {
      if (!state.currentUser) return;
      if (state.chatsUnsub) {
        try { state.chatsUnsub(); } catch {}
        state.chatsUnsub = null;
      }

      state.chatsUnsub = db.collection('chats')
        .where('users', 'array-contains', state.currentUser.email)
        .onSnapshot(snap => {
          const keepIds = new Set();
          state.chatIndex.clear();

          snap.docs.forEach(docSnap => {
            const data = docSnap.data();
            const other = (data.users || []).find(u => u !== state.currentUser.email);
            if (!other) return;

            keepIds.add(docSnap.id);

            state.chatIndex.set(docSnap.id, {
              chatId: docSnap.id,
              email: other,
              displayName: other,
              verified: false,
              avatar: AVATAR_FALLBACK,
              lastPreview: 'Loading…',
              lastPreviewText: 'Loading…',
              lastTimestamp: data.createdAt || null,
              lastTimestampMs: (data.createdAt?.toMillis && data.createdAt.toMillis()) || 0,
              createdAtMs: (data.createdAt?.toMillis && data.createdAt.toMillis()) || 0,
              lastMessageSenderId: null,
              lastMessageRead: true,
              lastMessageFromCurrentUser: false,
              lastMessageUnread: false,
              lastMessageUnreadIncoming: false,
              profileLoaded: false
            });

            withTimeout(db.collection('user_data').doc(other).get(), 2500)
              .then(userDoc => {
                const current = state.chatIndex.get(docSnap.id);
                if (!current) return;
                const otherData = userDoc.exists ? userDoc.data() : {};
                current.displayName = otherData['display name'] || otherData.displayName || otherData.display_name || other;
                current.verified = !!otherData.is_verified;
                current.avatar = otherData.profile_picture || AVATAR_FALLBACK;
                current.profileLoaded = true;
                state.chatIndex.set(docSnap.id, current);
                scheduleChatListRender();
              })
              .catch(() => {
                const current = state.chatIndex.get(docSnap.id);
                if (!current) return;
                current.displayName = current.displayName || other;
                current.avatar = AVATAR_FALLBACK;
                current.profileLoaded = false;
                state.chatIndex.set(docSnap.id, current);
                scheduleChatListRender();
              });

            withTimeout(db.collection('chats').doc(docSnap.id)
              .collection('messages')
              .orderBy('timestamp', 'desc')
              .limit(1)
              .get(), 2500)
              .then(msgSnap => {
                if (msgSnap.empty) return;
                const current = state.chatIndex.get(docSnap.id);
                if (!current) return;
                const lastMessage = msgSnap.docs[0].data();
                const preview = lastMessage ? buildSidebarPreview(lastMessage) : { html: t('noMessagesYet'), text: t('noMessagesYet'), isFromCurrentUser: false, isUnreadIncoming: false, unread: false };
                current.lastPreview = preview.html;
                current.lastPreviewText = preview.text;
                current.lastTimestamp = lastMessage?.timestamp || current.lastTimestamp || null;
                current.lastTimestampMs = (lastMessage?.timestamp?.toMillis && lastMessage.timestamp.toMillis()) || current.lastTimestampMs || 0;
                current.lastMessageSenderId = lastMessage?.senderId || null;
                current.lastMessageRead = Boolean(lastMessage?.read);
                current.lastMessageFromCurrentUser = preview.isFromCurrentUser;
                current.lastMessageUnread = preview.unread;
                current.lastMessageUnreadIncoming = preview.isUnreadIncoming;
                state.chatIndex.set(docSnap.id, current);
                scheduleChatListRender();
              })
              .catch(() => {});

            ensureSidebarPreviewListener({ chatId: docSnap.id });
          });

          stopSidebarPreviewListeners(keepIds);
          renderChatList();

          if (state.currentChatId && !state.chatIndex.has(state.currentChatId)) {
            state.currentChatId = null;
            setEmptyView(true);
          }
        });
    }
        async function openChat(chatId) {
      const token = ++state.openChatToken;
      state.currentChatId = chatId;
      history.replaceState(null, '', location.pathname + '?id=' + chatId);
      setEmptyView(false);
      clearMessages();
      renderChatList();

      if (state.chatUnsub) {
        try { state.chatUnsub(); } catch {}
        state.chatUnsub = null;
      }
      if (state.messagesUnsub) {
        try { state.messagesUnsub(); } catch {}
        state.messagesUnsub = null;
      }
      if (state.userDataUnsub) {
        try { state.userDataUnsub(); } catch {}
        state.userDataUnsub = null;
      }

      let chatDoc = null;
      try {
        chatDoc = await withTimeout(db.collection('chats').doc(chatId).get(), 2500);
      } catch {
        if (token !== state.openChatToken) return;
        setEmptyView(true);
        return;
      }
      if (!chatDoc.exists || token !== state.openChatToken) return;

      const users = chatDoc.data().users || [];
      const other = users.find(u => u !== state.currentUser.email);
      if (!other || token !== state.openChatToken) return;

      state.otherUserEmail = other;

      renderChatHeader(other, { displayName: other, avatar: AVATAR_FALLBACK });
      updateComposerStateForPair(other).catch(() => {});
      await listenChat(chatId, token);
      await listenMessages(chatId, token);
      if (token !== state.openChatToken) return;
      updateLayoutMode();

      withTimeout(db.collection('user_data').doc(other).get(), 2500)
        .then(otherDoc => {
          if (token !== state.openChatToken) return;
          renderChatHeader(other, otherDoc.exists ? otherDoc.data() : {});
          updateComposerStateForPair(other).catch(() => {});
        })
        .catch(() => {
          if (token !== state.openChatToken) return;
          renderChatHeader(other, {});
          updateComposerStateForPair(other).catch(() => {});
        });
    }
    function resetComposer() {
      els.composerInput.innerHTML = '';
      state.localAttachments.images = [];
      state.localAttachments.file = null;
      syncComposerAttachments();
      autoGrowTextarea();
    }

    function buildAttachmentPayload() {
      const images = state.localAttachments.images
        .map(entry => normalizeComposerAttachment(entry, 'image'))
        .filter(entry => entry && entry.status === 'ready' && entry.url)
        .slice(0, 5)
        .map(entry => entry.url);
      const files = state.localAttachments.file
        ? (() => {
            const entry = normalizeComposerAttachment(state.localAttachments.file, 'file');
            return entry && entry.status === 'ready' && entry.url ? [entry.url] : [];
          })()
        : [];
      return { images, files };
    }

    async function sendMessage() {
      if (!state.currentChatId) return;
      if (hasBlockingComposerAttachments()) {
        showToast('Remove the pending or failed attachments first.', 'yellow');
        return;
      }
      const text = serializeComposerContent().trim();
      const { images, files } = buildAttachmentPayload();
      if (!text && !images.length && !files.length) {
        showToast(t('sendEmpty'), 'yellow');
        return;
      }

      const payload = {
        senderId: state.currentUser.email,
        text,
        images,
        files,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        read: false
      };

      try {
        await db.collection('chats').doc(state.currentChatId).collection('messages').add(payload);
        resetComposer();
        clearDraftState(state.currentChatId);
        scrollMessagesToBottom(true);
      } catch (err) {
        console.error(err);
        const local = {
          id: 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
          senderId: state.currentUser.email,
          text,
          images,
          files,
          timestamp: Date.now(),
          read: false,
          status: 'failed',
          local: true
        };
        pushPendingMessage(state.currentChatId, local);
        state.messageDocs.set(local.id, { id: local.id, data: local });
        const wrap = els.messagesWrap;
        const prevTop = wrap.scrollTop;
        const prevHeight = wrap.scrollHeight;
        els.messages.innerHTML = '';
        let lastDate = null;
        for (const item of Array.from(state.messageDocs.values()).sort((a, b) => {
          const at = a.data.timestamp?.toMillis ? a.data.timestamp.toMillis() : (a.data.timestamp instanceof Date ? a.data.timestamp.getTime() : (a.data.timestamp || 0));
          const bt = b.data.timestamp?.toMillis ? b.data.timestamp.toMillis() : (b.data.timestamp instanceof Date ? b.data.timestamp.getTime() : (b.data.timestamp || 0));
          return at - bt;
        })) {
          const data = item.data;
          const dateKey = data.timestamp ? (data.timestamp.toDate ? data.timestamp.toDate().toDateString() : new Date(data.timestamp).toDateString()) : '';
          if (dateKey && dateKey !== lastDate) {
            lastDate = dateKey;
            const sep = document.createElement('div');
            sep.className = 'date-sep';
            sep.textContent = formatDate(data.timestamp);
            els.messages.appendChild(sep);
          }
          const node = await renderMessage(data, item.id);
          els.messages.appendChild(node);
        }
        wrap.scrollTop = Math.max(0, prevTop + (wrap.scrollHeight - prevHeight));
        showToast(t('sendFailed'), 'red');
      }
    }

    function isInsideToken(node) {
      let cur = node;
      while (cur && cur !== els.composerInput) {
        if (cur.nodeType === 1 && cur.dataset && cur.dataset.token) return cur;
        cur = cur.parentNode;
      }
      return null;
    }

    function deleteTokenAtSelection() {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return false;
      const token = isInsideToken(sel.anchorNode);
      if (!token) return false;
      const parent = token.parentNode;
      if (parent) parent.removeChild(token);
      updateComposerPreview();
      return true;
    }

    function deleteFormattedWordIfNeeded() {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return false;
      const anchor = sel.anchorNode;
      const token = isInsideToken(anchor);
      if (token) {
        const parent = token.parentNode;
        if (parent) parent.removeChild(token);
        updateComposerPreview();
        return true;
      }
      return deleteTokenAtSelection();
    }

        }

        db.collection('user_data').doc(state.currentUser.email).onSnapshot(doc => {
          state.currentUserData = doc.exists ? doc.data() : null;
          applyUiLanguage();
          applyChatBackground();
          if (state.otherUserEmail) updateComposerStateForPair(state.otherUserEmail);
        });

        await refreshChatListSnapshot();

        if (new URLSearchParams(location.search).get('email')) {
          const id = await findOrCreateChat(new URLSearchParams(location.search).get('email'));
          if (id) {
            await openChat(id);
          }
        } else if (state.currentChatId) {
          await openChat(state.currentChatId);
        } else {
          setEmptyView(true);
        }

        updateLayoutMode();
      });
    }

    boot();
    syncComposerAttachments();
    updateComposerPreview();
  </script>
</body>
</html>
