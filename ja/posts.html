  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: #171717;
      --card: #1f1f1f;
      --text: #e9e9e9;
      --text2: #9ca3af;
      --muted: #6b7280;
      --accent: #6b21a8;
      --accent-s: #5b21b6;
      --accent-h: rgba(107,33,168,0.12);
      --border: rgba(255,255,255,0.08);
      --div: rgba(255,255,255,0.06);
      --hover: rgba(255,255,255,0.03);
      --like: #f91880;
    }
    body.light {
      --bg:#f6f8fb; --card:#fff; --text:#0f172a; --text2:#475569;
      --muted:#94a3b8; --border:rgba(0,0,0,0.08); --hover:rgba(0,0,0,0.02); --div:rgba(0,0,0,0.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      overflow-x: hidden;
      width: 100%;
      min-height: 100vh;
    }

    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    dp-topbar {
      display: block;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
    }

    /* ── Shell: flex centering so feed sits in the middle on PC ── */
    .shell {
      padding-top: 56px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ── Feed column ── */
    .feed {
      width: 100%;
      /* 700px on PC feels roomier than 600px */
      max-width: 700px;
      border-left: 1px solid var(--div);
      border-right: 1px solid var(--div);
      min-height: calc(100vh - 56px);
    }

    /* ── Col header ── */
    .col-head {
      position: sticky;
      top: 56px;
      z-index: 100;
      background: rgba(23,23,23,0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--div);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    body.light .col-head { background: rgba(246,248,251,0.9); }

    .back-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none; background: transparent; color: var(--text);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .12s;
    }
    .back-btn:hover { background: var(--hover); }
    .col-title { font-size: 17px; font-weight: 700; color: var(--text); }

    /* ── Post article ──
       NO overflow:hidden — it clips the dropdown menu! */
    .post-art {
      padding: 14px 16px 0;
      border-bottom: 1px solid var(--div);
    }

    /* pinned */
    .pinned-label {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--muted);
      margin-bottom: 8px;
    }

    /* author row */
    .author-row {
      display: flex;
      align-items: flex-start;   /* top-align so long names don't push avatar */
      gap: 10px;
    }

    .pfp {
      /* hard fixed size that cannot flex-shrink */
      width: 44px; height: 44px;
      min-width: 44px; min-height: 44px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
      cursor: pointer;
    }
    .pfp-frame {
      position: absolute; inset: 0;
      border-radius: 50%;
      background-size: cover;
      pointer-events: none;
    }

    /* author text: min-width:0 is the key — lets it shrink inside flex */
    .author-info {
      flex: 1;
      min-width: 0;
    }
    .author-name-row {
      display: flex; align-items: center; gap: 4px;
      min-width: 0;
    }
    .author-name {
      font-weight: 700; font-size: 15px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }
    .author-handle {
      font-size: 14px; color: var(--text2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 1px;
    }
    .vbadge {
      width: 16px; height: 16px; flex-shrink: 0;
      display: inline-block;
      background-image: url('/assets/verified.png');
      background-size: contain; background-repeat: no-repeat;
    }

    /* menu — NO overflow:hidden on parent so dropdown shows */
    .menu-wrap { position: relative; flex-shrink: 0; margin-left: auto; }
    .more-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: none; background: transparent; color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s, color .12s;
    }
    .more-btn:hover { background: var(--accent-h); color: var(--accent); }

    .pmenu {
      position: absolute; top: 38px; right: 0;
      min-width: 200px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.55);
      display: none; flex-direction: column; padding: 4px 0; z-index: 400;
    }
    .pmenu.open { display: flex; }
    .pmenu button {
      width: 100%; padding: 12px 16px; text-align: left;
      border: none; background: transparent; color: var(--text);
      cursor: pointer; font-size: 15px; font-weight: 500; font-family: inherit;
      transition: background .1s;
    }
    .pmenu button:hover:not([disabled]) { background: var(--hover); }
    .pmenu button[disabled] { opacity: 0.4; cursor: not-allowed; }

    /* ── Post body ──
       KEY FIX: no flex/gap here. Use plain margin-top on the media child.
       This avoids ghost space when rich-markdown element is empty/upgrading. */
    .post-body {
      margin-top: 10px;
    }

    .post-text {
      font-size: 17px; line-height: 1.6; color: var(--text);
      word-break: break-word; overflow-wrap: break-word;
      white-space: pre-wrap;
    }
    /* rich-markdown fills its container, inherits wrapping */
    .post-text rich-markdown {
      display: block;
      word-break: break-word; overflow-wrap: break-word;
    }

    /* Media: only margin-top when it actually has content.
       We add the margin via JS only when images exist,
       OR use the :not(:empty) trick below. */
    .media-grid {
      border-radius: 14px; overflow: hidden;
    }
    /* Only show margin when the grid has children */
    .media-grid:not(:empty) { margin-top: 10px; }

    .media-grid.single { display: block; }
    .media-grid.multi {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2px;
    }
    .media-grid img,
    .media-grid video {
      width: 100%; display: block;
      object-fit: cover;
      transition: filter .12s;
    }
    .media-grid.single img,
    .media-grid.single video {
      max-height: 480px; object-fit: contain;
      background: rgba(0,0,0,0.15);
    }
    .media-grid.multi img,
    .media-grid.multi video { height: 210px; }
    .media-grid img:hover { filter: brightness(0.88); }

    /* padding below media / text before the divider */
    .post-body-end { padding-bottom: 12px; }

    /* ── Timestamp ── */
    .ts-row {
      padding: 12px 0;
      border-top: 1px solid var(--div);
      border-bottom: 1px solid var(--div);
    }
    .ts-text { font-size: 14px; color: var(--text2); }

    /* ── Stats ── */
    .stats-row {
      display: flex; gap: 20px; flex-wrap: wrap;
      padding: 12px 0;
      border-bottom: 1px solid var(--div);
    }
    .stat { font-size: 14px; }
    .stat b { font-weight: 700; color: var(--text); }
    .stat span { color: var(--text2); margin-left: 3px; }

    /* ── Action bar ── */
    .act-bar {
      display: flex; align-items: center;
      justify-content: space-around;
      padding: 2px 0;
      border-bottom: 1px solid var(--div);
    }
    .act {
      display: flex; align-items: center; gap: 6px;
      background: transparent; border: none; cursor: pointer;
      color: var(--muted); padding: 10px 14px;
      border-radius: 50px; font-size: 13px; font-weight: 500;
      font-family: inherit; line-height: 1;
      transition: color .12s, background .12s;
      flex-shrink: 1; min-width: 0;
    }
    .act svg { flex-shrink: 0; }
    .act:hover { color: var(--accent); background: var(--accent-h); }
    .act.liked,
    .act.liked:hover { color: var(--like); background: rgba(249,24,128,0.10); }
    .act.reposted,
    .act.reposted:hover { color: var(--accent); background: var(--accent-h); }
    .act-n { font-size: 13px; }

    /* ── Comments ── */
    .cmt-item {
      display: flex; gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--div);
      transition: background .1s;
    }
    .cmt-item:hover { background: var(--hover); }

    .cmt-pfp {
      width: 38px; height: 38px;
      min-width: 38px; min-height: 38px;
      border-radius: 50%;
      background-size: cover; background-position: center;
      background-repeat: no-repeat;
      border: 1px solid var(--border);
      flex-shrink: 0; position: relative;
    }
    .cmt-pfp-frame {
      position: absolute; inset: 0; border-radius: 50%;
      background-size: cover; pointer-events: none;
    }
    .cmt-body { flex: 1; min-width: 0; }
    .cmt-who {
      display: flex; align-items: center; gap: 4px;
      flex-wrap: wrap; margin-bottom: 3px;
    }
    .cmt-name { font-weight: 700; font-size: 14px; color: var(--text); }
    .cmt-handle { font-size: 13px; color: var(--text2); }
    .cmt-text {
      font-size: 14px; color: var(--text); line-height: 1.5;
      white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word;
    }
    .cmt-text rich-markdown {
      display: block;
      word-break: break-word; overflow-wrap: break-word;
    }

    .no-cmt {
      padding: 36px 16px; text-align: center;
      color: var(--text2); font-size: 15px;
    }
    /* state-msg: constrained so it doesn't overflow on narrow screens */
    .state-msg {
      padding: 40px 16px; text-align: center;
      color: var(--text2); font-size: 15px;
      width: 100%; max-width: 100%;
    }

    /* ── Compose ── */
    .compose {
      display: none;
      align-items: center; gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--div);
      position: sticky; bottom: 0;
      background: rgba(23,23,23,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    body.light .compose { background: rgba(246,248,251,0.96); }

    .compose-pfp {
      width: 36px; height: 36px;
      min-width: 36px; min-height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--border);
      background-size: cover; background-position: center;
      border: 1px solid var(--border);
    }
    .compose-wrap {
      flex: 1; min-width: 0;
      display: flex; align-items: center;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 50px; padding: 8px 14px;
      transition: border-color .15s;
    }
    .compose-wrap:focus-within { border-color: var(--accent); }
    .compose-input {
      flex: 1; min-width: 0; border: none; background: transparent;
      color: var(--text); font-size: 15px; font-family: inherit; outline: none;
    }
    .compose-input::placeholder { color: var(--muted); }
    .compose-send {
      flex-shrink: 0;
      background: var(--accent); border: none; color: #fff;
      border-radius: 50px; padding: 7px 18px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; white-space: nowrap;
      transition: background .12s, opacity .12s;
    }
    .compose-send:hover { background: var(--accent-s); }
    .compose-send:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Towall ── */
    .towall-banner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: rgba(107,33,168,0.07);
      border-bottom: 1px solid var(--div);
      font-size: 13px; color: var(--text2); gap: 12px;
    }
    .towall-rm {
      flex-shrink: 0;
      background: transparent; border: 1px solid var(--border);
      color: var(--text2); border-radius: 50px; padding: 4px 12px;
      font-size: 12px; cursor: pointer; font-family: inherit;
      transition: border-color .12s, color .12s;
    }
    .towall-rm:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      display: none; padding: 10px 20px; border-radius: 50px;
      color: #fff; z-index: 99999; font-size: 14px; font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); white-space: nowrap;
      pointer-events: none;
    }

    /* ── Responsive ── */
    @media (max-width: 740px) {
      .shell { padding-top: 52px; }
      .col-head { top: 52px; }
      /* full-bleed on mobile — no side borders, no margin */
      .feed {
        max-width: 100%;
        border-left: none; border-right: none;
      }
    }
    @media (max-width: 480px) {
      .post-art { padding: 12px 12px 0; }
      .post-text { font-size: 16px; }
      .pfp { width: 40px; height: 40px; min-width: 40px; min-height: 40px; }
      .media-grid.multi img,
      .media-grid.multi video { height: 150px; }
      .act { padding: 8px 8px; gap: 4px; font-size: 12px; }
      .cmt-item { padding: 10px 12px; }
      .compose { padding: 8px 12px; }
      .compose-send { padding: 6px 14px; font-size: 13px; }
      .stats-row { gap: 14px; }
    }
    @media (max-width: 360px) {
      .act-n { display: none; }
      .act { padding: 8px 6px; }
    }
  </style>
</head>

let currentLang = 'en';

function supportedLang(raw) {
  const v = String(raw || '').trim().toLowerCase().slice(0, 2);
  return SUPPORTED_LANGS.includes(v) ? v : null;
}

function detectBrowserLang() {
  return supportedLang(navigator.language || navigator.userLanguage || '') || 'en';
}

function t(key) {
  return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.en[key] || key;
}

function setLang(lang) {
  currentLang = supportedLang(lang) || 'en';
  document.documentElement.lang = currentLang;
  syncStaticUi();
}

function syncStaticUi() {
  document.documentElement.lang = currentLang;
  document.title = t('post');
  const colTitle = document.querySelector('.col-title');
  if (colTitle) colTitle.textContent = t('post');
  const backBtn = document.querySelector('.back-btn');
  if (backBtn) backBtn.setAttribute('aria-label', t('back'));
}

function setRootMessage(key, color = 'default') {
  postRoot.innerHTML = `<div class="state-msg"${color === 'red' ? ' style="color:#f66"' : ''}>${esc(t(key))}</div>`;
}

function applyPostLabels(opts = {}) {
  const pinnedLabel = postRoot.querySelector('.pinned-label');
  if (pinnedLabel) pinnedLabel.innerHTML = `${pinnedLabel.querySelector('svg') ? pinnedLabel.querySelector('svg').outerHTML : ''}${esc(t('pinned'))}`;

  const delBtn = postRoot.querySelector('#delBtn');
  if (delBtn) delBtn.textContent = t('deletePost');

  const pinBtn = postRoot.querySelector('#pinBtn');
  if (pinBtn) pinBtn.textContent = opts.pinnedLocal ? t('unpinPost') : t('pinToProfile');

  const rmWallBtn = postRoot.querySelector('#rmWallBtn');
  if (rmWallBtn) rmWallBtn.textContent = t('removeFromMyWall');

  const statLabels = postRoot.querySelectorAll('.stat span');
  if (statLabels[0]) statLabels[0].textContent = t('reposts');
  if (statLabels[1]) statLabels[1].textContent = t('likes');

  const cToggle = postRoot.querySelector('#cToggle');
  if (cToggle) cToggle.setAttribute('aria-label', t('reply'));

  const cSend = postRoot.querySelector('#cSend');
  if (cSend) cSend.textContent = t('reply');

  const cInput = postRoot.querySelector('#cInput');
  if (cInput) cInput.placeholder = t('postYourReply');

  const twBanner = postRoot.querySelector('#twBanner');
  if (twBanner && opts.showTowall) {
    twBanner.innerHTML = `<div class="towall-banner"><span>${esc(t('thisPostIsInYourWall'))}</span><button class="towall-rm" id="twRm">${esc(t('remove'))}</button></div>`;
  }
}

  const params = new URLSearchParams(window.location.search);
  const postId = (params.get('post') || '').trim();
  const postRoot = document.getElementById('postRoot');

  setLang(detectBrowserLang());
  if (postId) {
    // show localized loading text immediately
    setRootMessage('loadingPost');
  }

  function esc(s) {
    return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function toMs(v) {
    if (v==null) return null;
    if (typeof v==='number') return v;
    if (v instanceof Date) return v.getTime();
    if (v?.toDate) return v.toDate().getTime();
    if (typeof v==='object' && typeof v.seconds==='number')
      return v.seconds*1000 + Math.floor((v.nanoseconds||0)/1e6);
    return null;
  }
  function fmtDate(v) {
    const ms = toMs(v); if (!ms) return '';
    try {
      return new Intl.DateTimeFormat(currentLang, {
        dateStyle: 'long',
        timeStyle: 'short'
      }).format(new Date(ms));
    } catch {
      return new Date(ms).toLocaleString();
    }
  }
  function toast(msg, color='purple', t=2800) {
    const el=document.getElementById('toast');
    el.textContent=msg; el.style.display='block';
    if (color==='red') el.style.background='#b91c1c';
    else if (color==='yellow') el.style.background='#d97706';
    else if (color==='green') el.style.background='#059669';
    else el.style.background='linear-gradient(135deg,#5b21b6,#6b21a8)';
    clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',t);
  }

  /* Build media HTML — returns '' when no images so no empty div is injected */
  function mediaHtml(images) {
    if (!images||!images.length) return '';
    const cls=images.length===1?'single':'multi';
    const items=images.map(u=>{
      const url=String(u||'');
      if (url.match(/\.mp4(\?.*)?$/i))
        return `<video controls src="${esc(url)}" preload="metadata" playsinline></video>`;
      return `<img src="${esc(url)}" alt="post image" loading="lazy">`;
    }).join('');
    return `<div class="media-grid ${cls}">${items}</div>`;
  }

  /* Rich-markdown: try every known method, retry async in case CE upgrades late */
  function setRM(el, text) {
    if (!el) return;
    const txt=String(text||'');
    function attempt() {
      if (typeof el.setMarkdown==='function') { try{el.setMarkdown(txt);}catch(e){} }
      ['text','content','value','src'].forEach(a=>{ try{el.setAttribute(a,txt);}catch(e){} });
      /* Only fall back to textContent if shadow DOM is empty */
      if (!el.shadowRoot||!el.shadowRoot.textContent.trim()) el.textContent=txt;
    }
    attempt();
    Promise.resolve().then(attempt);
    requestAnimationFrame(attempt);
    setTimeout(attempt, 300);
  }

  if (!postId) {
    setRootMessage('noPostId', 'red');
  } else {
    let curEmail=null, curUD=null, postData=null, unsubCmt=null;
    let userLiked=false, userReposted=false;

    auth.onAuthStateChanged(async user=>{
      curEmail=user?.email?.toLowerCase()||null;
      curUD=null;
      let resolvedLang = detectBrowserLang();
      if (curEmail) {
        try {
          const d=await db.collection('user_data').doc(curEmail).get();
          if(d.exists) {
            curUD=d.data() || {};
            const accountLang = supportedLang(curUD.lang);
            if (accountLang) resolvedLang = accountLang;
          }
        }
        catch(e){console.error(e);}
      }
      setLang(resolvedLang);
      await loadPost();
    });

    async function loadPost() {
      try {
        const ref=db.collection('posts').doc(postId);
        const snap=await ref.get();
        if (!snap.exists) { setRootMessage('postNotFound', 'red'); return; }
        postData=snap.data();

        const editor=(postData.editor||'').toLowerCase();
        if (!editor) { setRootMessage('authorMissing', 'red'); return; }

        const aSnap=await db.collection('user_data').doc(editor).get();
        const aData=aSnap.exists?aSnap.data():{};
        const blocked=Array.isArray(aData.blockedUsers)?aData.blockedUsers.map(s=>s.toLowerCase()):[];
        if (curEmail&&blocked.includes(curEmail)) {
          setRootMessage('noPermission', 'red'); return;
        }

        const name     =aData['display name']||editor;
        const pfpUrl   =aData.profile_picture||'/org-owner.jpg';
        const frame    =aData.profile_picture_frame||'';
        const verified =!!aData.is_verified;
        const isPinned =!!(postData.pinnedByOwner||postData.pinned_by_owner||postData.pinned);
        const text     =postData.text||'';
        const images   =Array.isArray(postData.images)?postData.images:[];
        const dateLabel=fmtDate(postData.timestamp||postData.createdAt||postData.created||postData.created_at);
        const isOwner  =!!(curEmail&&curEmail===editor);
        const canRmWall=!!(curEmail&&postData.towall&&curEmail===String(postData.towall).toLowerCase());
        const cSetting =(postData.comments||'everyone').toLowerCase();

        const likedBy   =Array.isArray(postData.likedBy)?postData.likedBy.map(s=>s.toLowerCase()):[];
        const repostedBy=Array.isArray(postData.repostedBy)?postData.repostedBy.map(s=>s.toLowerCase()):[];
        userLiked   =curEmail?likedBy.includes(curEmail):false;
        userReposted=curEmail?repostedBy.includes(curEmail):false;

        let pinnedLocal=isPinned;
        const med=mediaHtml(images);

        postRoot.innerHTML=`
<article class="post-art">
  ${isPinned?`<div class="pinned-label"><svg width="12" height="12" viewBox="0 0 24 24" fill="var(--muted)"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>Pinned</div>`:''}
  <div class="author-row">
    <div class="pfp" style="background-image:url('${esc(pfpUrl)}')" title="${esc(name)}">
      ${frame?`<div class="pfp-frame" style="background-image:url('${esc(frame)}')"></div>`:''}
    </div>
    <div class="author-info">
      <div class="author-name-row">
        <span class="author-name">${esc(name)}</span>
        ${verified?'<span class="vbadge" title="Verified"></span>':''}
      </div>
      <div class="author-handle">@${esc(editor)}</div>
    </div>
    <div class="menu-wrap">
      <button class="more-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="More">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <div class="pmenu" id="postMenu" role="menu">
        <button id="delBtn" ${isOwner?'':'disabled'}>Delete post</button>
        <button id="pinBtn" ${isOwner?'':'disabled'}>${isPinned?'Unpin post':'Pin to profile'}</button>
        <button id="rmWallBtn" ${canRmWall?'':'disabled'}>Remove from my wall</button>
      </div>
    </div>
  </div>

  <div class="post-body">
    <div class="post-text"><rich-markdown id="postRich" mode="markdown" chat-components></rich-markdown></div>
    ${med}
    <div class="post-body-end"></div>
  </div>

  ${dateLabel?`<div class="ts-row"><span class="ts-text">${esc(dateLabel)}</span></div>`:''}

  <div class="stats-row">
    <div class="stat"><b id="rcnt">${repostedBy.length||0}</b><span>Reposts</span></div>
    <div class="stat"><b id="lcnt">${likedBy.length||0}</b><span>Likes</span></div>
  </div>

  <div class="act-bar" role="toolbar">
    <button id="cToggle" class="act" aria-label="Reply">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="act-n" id="ccnt">0</span>
    </button>
    <button id="rpBtn" class="act ${userReposted?'reposted':''}" aria-label="Repost" aria-pressed="${userReposted}">
      <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor"><path d="M280-80 120-240l160-160 56 58-62 62h406v-160h80v240H274l62 62-56 58Zm-80-440v-240h486l-62-62 56-58 160 160-160 160-56-58 62-62H280v160h-80Z"/></svg>
      <span class="act-n" id="rcntb">${repostedBy.length||0}</span>
    </button>
    <button id="lkBtn" class="act ${userLiked?'liked':''}" aria-label="Like" aria-pressed="${userLiked}">
      <svg id="lkSvg" width="18" height="18" viewBox="0 0 24 24" fill="${userLiked?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span class="act-n" id="lcntb">${likedBy.length||0}</span>
    </button>
    <button id="shBtn" class="act" aria-label="Share">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
    </button>
    <button id="rprtBtn" class="act" aria-label="Report">
      <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor"><path d="M480-280q17 0 28.5-11.5T520-320q0-17-11.5-28.5T480-360q-17 0-28.5 11.5T440-320q0 17 11.5 28.5T480-280Zm-40-160h80v-240h-80v240ZM330-120 120-330v-300l210-210h300l210 210v300L630-120H330Zm34-80h232l164-164v-232L596-760H364L200-596v232l164 164Zm116-280Z"/></svg>
    </button>
  </div>
</article>

<section class="cmt-section" id="cmtSection">
  <div id="twBanner"></div>
  <div id="cmtList"></div>
  <div class="compose" id="compose">
    <div class="compose-pfp" id="cPfp"></div>
    <div class="compose-wrap">
      <input id="cInput" class="compose-input" placeholder="Post your reply" maxlength="500" autocomplete="off">
    </div>
    <button id="cSend" class="compose-send" disabled>Reply</button>
  </div>
</section>`;

        setRM(document.getElementById('postRich'), text);
        applyPostLabels({ pinnedLocal, showTowall: !!canRmWall });

        /* Menu */
        const menuBtn=document.getElementById('menuBtn');
        const postMenu=document.getElementById('postMenu');
        function closeMenu(){postMenu.classList.remove('open');menuBtn.setAttribute('aria-expanded','false');}
        menuBtn.addEventListener('click',e=>{
          e.stopPropagation();
          const open=postMenu.classList.toggle('open');
          menuBtn.setAttribute('aria-expanded',String(open));
          if (open) setTimeout(()=>document.addEventListener('click',closeMenu,{once:true}),0);
        });

        document.getElementById('delBtn').addEventListener('click',async()=>{
          if (!isOwner) return;
          if (!confirm(t('deleteConfirm'))) return;
          try { await db.collection('posts').doc(postId).delete(); window.location.href='/ugc/posts'; }
          catch(e){console.error(e);toast(t('failedDeletePost'),'red');}
        });
        document.getElementById('pinBtn').addEventListener('click',async()=>{
          if (!isOwner) return;
          const pb=document.getElementById('pinBtn');
          if (!confirm(pinnedLocal ? t('unpinConfirm') : t('pinConfirm'))) return;
          try {
            if (pinnedLocal){
              await db.collection('posts').doc(postId).update({pinnedByOwner:firebase.firestore.FieldValue.delete()});
              pb.textContent='Pin to profile'; pinnedLocal=false;
            } else {
              await db.collection('posts').doc(postId).update({pinnedByOwner:true});
              pb.textContent='Unpin post'; pinnedLocal=true;
            }
            toast(`Post ${pinnedLocal?'pinned':'unpinned'}.`);
          } catch(e){console.error(e);toast(t('failedUpdatePin'),'red');}
        });
        document.getElementById('rmWallBtn').addEventListener('click',async()=>{
          if (!canRmWall) return;
          if (!confirm(t('removeWallConfirm'))) return;
          try {
            await db.collection('posts').doc(postId).update({towall:firebase.firestore.FieldValue.delete()});
            toast(t('removedFromYourWall'));
            document.getElementById('twBanner').innerHTML='';
          } catch(e){console.error(e);toast(t('failedGeneric'),'red');}
        });

        wireActions(editor, ref, cSetting);

      } catch(e) {
        console.error(e);
        setRootMessage('failedLoadPost', 'red');
      }
    }

    function canComment(cs,authorEmail){
      if (!curEmail) return false;
      switch((cs||'everyone').toLowerCase()){
        case 'none':     return curEmail===(authorEmail||'').toLowerCase();
        case 'admins':   return curEmail.endsWith('@darkpurpleof.github.io');
        case 'verified': return !!(curUD&&curUD.is_verified===true);
        default:         return true;
      }
    }

    function wireActions(authorEmail,docRef,cs){
      const lkBtn  =document.getElementById('lkBtn');
      const lkSvg  =document.getElementById('lkSvg');
      const lcnt   =document.getElementById('lcnt');
      const lcntb  =document.getElementById('lcntb');
      const rpBtn  =document.getElementById('rpBtn');
      const rcnt   =document.getElementById('rcnt');
      const rcntb  =document.getElementById('rcntb');
      const ccnt   =document.getElementById('ccnt');
      const shBtn  =document.getElementById('shBtn');
      const rprtBtn=document.getElementById('rprtBtn');
      const compose=document.getElementById('compose');
      const cInput =document.getElementById('cInput');
      const cSend  =document.getElementById('cSend');
      const cmtList=document.getElementById('cmtList');
      const twBanner=document.getElementById('twBanner');
      const cPfp   =document.getElementById('cPfp');
      let localLiked=userLiked, localReposted=userReposted;

      /* Towall */
      if (curEmail&&postData.towall&&String(postData.towall).toLowerCase()===curEmail){
        twBanner.innerHTML=`<div class="towall-banner"><span>${esc(t('thisPostIsInYourWall'))}</span><button class="towall-rm" id="twRm">${esc(t('remove'))}</button></div>`;
        document.getElementById('twRm').addEventListener('click',async()=>{
          try{await docRef.update({towall:firebase.firestore.FieldValue.delete()});twBanner.innerHTML='';toast(t('removedFromYourWall'));}
          catch(e){console.error(e);toast(t('failedGeneric'),'red');}
        });
      }

      /* Compose pfp */
      if (cPfp){
        if (curUD?.profile_picture) cPfp.style.backgroundImage=`url('${esc(curUD.profile_picture)}')`;
        cPfp.style.cssText+=';background-size:cover;background-position:center;';
      }
      if (canComment(cs,authorEmail)) compose.style.display='flex';

      /* Like */
      lkBtn.addEventListener('click',async()=>{
        if (!curEmail){toast(t('signInToLike'),'yellow');return;}
        lkBtn.disabled=true;
        try {
          if (localLiked){
            await docRef.update({likedBy:firebase.firestore.FieldValue.arrayRemove(curEmail)});
            localLiked=false;lkBtn.classList.remove('liked');lkBtn.setAttribute('aria-pressed','false');
            lkSvg.setAttribute('fill','none');
            const c=Math.max(0,+lcnt.textContent-1);lcnt.textContent=c;lcntb.textContent=c;
          } else {
            await docRef.update({likedBy:firebase.firestore.FieldValue.arrayUnion(curEmail)});
            localLiked=true;lkBtn.classList.add('liked');lkBtn.setAttribute('aria-pressed','true');
            lkSvg.setAttribute('fill','currentColor');
            const c=+lcnt.textContent+1;lcnt.textContent=c;lcntb.textContent=c;
          }
        } catch(e){console.error(e);toast(t('failedUpdateLike'),'red');}
        finally{lkBtn.disabled=false;}
      });

      /* Repost */
      rpBtn.addEventListener('click',async()=>{
        if (!curEmail){toast(t('signInToRepost'),'yellow');return;}
        rpBtn.disabled=true;
        try {
          if (localReposted){
            await docRef.update({repostedBy:firebase.firestore.FieldValue.arrayRemove(curEmail)});
            localReposted=false;rpBtn.classList.remove('reposted');rpBtn.setAttribute('aria-pressed','false');
            const c=Math.max(0,+rcnt.textContent-1);rcnt.textContent=c;rcntb.textContent=c;
          } else {
            await docRef.update({repostedBy:firebase.firestore.FieldValue.arrayUnion(curEmail)});
            localReposted=true;rpBtn.classList.add('reposted');rpBtn.setAttribute('aria-pressed','true');
            const c=+rcnt.textContent+1;rcnt.textContent=c;rcntb.textContent=c;
          }
        } catch(e){console.error(e);toast(t('failedUpdateRepost'),'red');}
        finally{rpBtn.disabled=false;}
      });

      /* Share */
      shBtn.addEventListener('click',async()=>{
        try{
          if (navigator.share){await navigator.share({title:document.title,url:location.href});toast(t('shared'),'green');}
          else if (navigator.clipboard){await navigator.clipboard.writeText(location.href);toast(t('linkCopied'));}
          else prompt('Copy this link:',location.href);
        }catch(e){console.error(e);}
      });

      rprtBtn.addEventListener('click',()=>{window.location.href=`/reportabuse?email=${encodeURIComponent(authorEmail)}`;});

      cInput.addEventListener('input',()=>{cSend.disabled=!cInput.value.trim();});
      cSend.addEventListener('click',async()=>{
        const txt=cInput.value.trim();
        if (!txt){toast('Reply cannot be empty.','yellow');return;}
        if (!curEmail){toast(t('signInToReply'),'yellow');return;}
        if (!canComment(cs,authorEmail)){toast(t('noPermission'),'red');return;}
        cSend.disabled=true;
        try {
          await docRef.collection('comments').add({author:curEmail,text:txt,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
          cInput.value='';cSend.disabled=true;toast(t('replyPosted'));
        } catch(e){console.error(e);toast(t('failedPostReply'),'red');cSend.disabled=false;}
      });

      loadComments(docRef,ccnt,cmtList);
      window.addEventListener('beforeunload',()=>{if(unsubCmt)unsubCmt();});
    }

    function loadComments(docRef,countEl,listEl){
      if (unsubCmt) unsubCmt();
      unsubCmt=docRef.collection('comments').orderBy('timestamp','asc').onSnapshot(async snap=>{
        countEl.textContent=snap.size;
        if (snap.empty){listEl.innerHTML=`<div class="no-cmt">${esc(t('noRepliesYet'))}</div>`;return;}

        const emails=Array.from(new Set(snap.docs.map(d=>(d.data().author||'').toLowerCase()).filter(Boolean)));
        let aMap={};
        if (emails.length){
          try{
            const docs=await Promise.all(emails.map(e=>db.collection('user_data').doc(e).get()));
            docs.forEach(d=>{if(d.exists)aMap[d.id.toLowerCase()]=d.data();});
          }catch(e){console.error(e);}
        }

        listEl.innerHTML='';
        for (const doc of snap.docs){
          const c =doc.data();
          const ae=(c.author||'').toLowerCase();
          const ad=aMap[ae]||{};
          if (ad.blockedUsers&&curEmail&&ad.blockedUsers.map(x=>x.toLowerCase()).includes(curEmail)) continue;

          const nm =ad['display name']||ae||'Unknown';
          const pfp=ad.profile_picture||'/org-owner.jpg';
          const fr =ad.profile_picture_frame||'';
          const vrf=ad.is_verified?`<span class="vbadge" style="width:14px;height:14px"></span>`:'';

          const el=document.createElement('div');
          el.className='cmt-item';
          el.innerHTML=`
<div class="cmt-pfp" style="background-image:url('${esc(pfp)}')">
  ${fr?`<div class="cmt-pfp-frame" style="background-image:url('${esc(fr)}')"></div>`:''}
</div>
<div class="cmt-body">
  <div class="cmt-who">
    <span class="cmt-name">${esc(nm)}</span>${vrf}
    <span class="cmt-handle">@${esc(ae)}</span>
  </div>
  <div class="cmt-text"><rich-markdown mode="markdown" chat-components></rich-markdown></div>
</div>`;
          listEl.appendChild(el);
          setRM(el.querySelector('rich-markdown'),c.text||'');
        }
      },err=>{
        console.error(err);
        listEl.innerHTML=`<div class="no-cmt" style="color:#f66">${esc(t('failedLoadReplies'))}</div>`;
      });
    }
  }
</script>
</body>
</html>
