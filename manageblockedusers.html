<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blocked Users</title>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#171717;
      --card:#1f1f1f;
      --muted:#9ca3af;
      --accent:#6b21a8;
      --accent-strong:#5b21b6;
      --text:#eaeaea;
      --border:rgba(255,255,255,0.07);
      --hover:rgba(255,255,255,0.035);
    }
    body.light{
      --bg:#f6f8fb;
      --card:#fff;
      --muted:#475569;
      --text:#0f172a;
      --border:rgba(0,0,0,0.07);
      --hover:rgba(0,0,0,0.02);
    }

    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;overflow-x:hidden;}
    body{
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background:var(--bg);
      color:var(--text);
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    dp-topbar{display:block;position:sticky;top:0;z-index:100;}

    main.page{
      flex:1;
      width:100%;
      max-width:640px;
      margin:0 auto;
      padding:32px 20px 60px;
    }

    .page-head{ margin-bottom:22px; }
    .page-head h1{ margin:0; font-size:20px; font-weight:700; letter-spacing:-0.01em; }
    .page-head p{ margin:6px 0 0; font-size:13.5px; color:var(--muted); }

    .block-row{ display:flex; gap:8px; margin-bottom:14px; }
    .block-row input{
      flex:1; min-width:0; padding:11px 13px; border-radius:10px;
      border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px;
    }
    .block-row input::placeholder{ color:var(--muted); }
    .block-row input:focus{ outline:2px solid var(--accent); outline-offset:1px; }

    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
      padding:11px 16px; border-radius:10px; border:1px solid var(--border);
      background:transparent; color:var(--text); cursor:pointer; font-family:inherit;
      font-weight:600; font-size:13.5px; white-space:nowrap;
      transition:background .15s, opacity .15s, transform .05s;
    }
    .btn:hover{ background:var(--hover); }
    .btn:active{ transform:translateY(1px); }
    .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }
    .btn.primary{ background:var(--accent); border-color:transparent; color:#fff; }
    .btn.primary:hover{ background:var(--accent-strong); }
    .btn.ghost{ background:transparent; }
    .btn.small{ padding:7px 10px; font-size:12.5px; border-radius:8px; }
    .btn.danger-text{ background:transparent; border:none; color:#e06565; padding:6px 4px; font-weight:600; }
    .btn.danger-text:hover{ text-decoration:underline; background:none; }

    .toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .search-wrap{ position:relative; flex:1; min-width:0; }
    .search-wrap input{
      width:100%; padding:9px 12px 9px 32px; border-radius:9px;
      border:1px solid var(--border); background:var(--card); color:var(--text); font-size:13.5px;
    }
    .search-wrap svg{
      position:absolute; left:10px; top:50%; transform:translateY(-50%);
      width:14px; height:14px; color:var(--muted); pointer-events:none;
    }

    .count-pill{ font-size:12.5px; color:var(--muted); white-space:nowrap; padding:0 2px; }

    .list{
      margin-top:14px; display:flex; flex-direction:column; border:1px solid var(--border);
      border-radius:12px; overflow:hidden; background:var(--card);
    }
    .row{
      display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border); min-width:0;
    }
    .row:last-child{ border-bottom:none; }
    .row:hover{ background:var(--hover); }

    .pfp{
      width:38px; height:38px; border-radius:8px; background-size:cover; background-position:center; background-repeat:no-repeat;
      border:1px solid var(--border); flex-shrink:0;
    }
    .row-info{ flex:1; min-width:0; }
    .row-name{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row-sub{ font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row-actions{ display:flex; gap:6px; flex-shrink:0; }

    .empty-state{
      padding:36px 20px; text-align:center; color:var(--muted); font-size:13.5px;
    }
    .empty-state strong{ display:block; color:var(--text); font-size:14.5px; margin-bottom:4px; }

    .footer-row{ display:flex; justify-content:space-between; align-items:center; margin-top:16px; }

    #toast{
      position:fixed; top:18px; left:50%; transform:translateX(-50%);
      padding:10px 14px; border-radius:10px; font-weight:700; font-size:13.5px;
      display:none; z-index:99999; color:#fff;
    }
    #toast.purple{ background:var(--accent-strong); }
    #toast.yellow{ background:#e6b800; color:#222; }
    #toast.red{ background:#c00; }

    @media (max-width:480px){
      main.page{ padding:22px 14px 48px; }
      .block-row{ flex-direction:column; }
      .block-row .btn{ width:100%; }
    }
  </style>
</head>
<body>
  <script type="module" src="/dp-topbar.js"></script>
  <dp-topbar></dp-topbar>

  <main class="page" aria-label="Manage blocked users">
    <div class="page-head">
      <h1 id="t-title">Blocked users</h1>
      <p id="t-subtitle">Manage the users you have blocked from your account.</p>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Search blocked users" aria-label="Search blocked users">
      </div>
    </div>

    <div id="listContainer" class="list" aria-live="polite">
      <div class="empty-state" id="loadingState">Loading…</div>
    </div>

    <div class="footer-row"></div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCAPZF2zwU6z5rhikrIVZ4TVxf1tS5aTbA",
      authDomain: "darkpurpleof-s-website.firebaseapp.com",
      projectId: "darkpurpleof-s-website",
      storageBucket: "darkpurpleof-s-website.firebasestorage.app",
      messagingSenderId: "520651082420",
      appId: "1:520651082420:web:bb05c0c3fd64517952e5e1"
    };
    if (!window.firebase || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const SUPPORTED_LANGS = ['en', 'es', 'ru', 'de', 'ja'];
    const I18N = {
      en: {
        title: 'Blocked users',
        subtitle: 'Manage the users you have blocked from your account.',
        searchPlaceholder: 'Search blocked users',
        loading: 'Loading…',
        noBlockedUsersTitle: 'No blocked users',
        noBlockedUsersBody: 'Anyone you block will show up here.',
        noMatchesTitle: 'No matches',
        noMatchesBody: 'Try a different name or email.',
        view: 'View',
        unblock: 'Unblock',
        confirmUnblock: 'Unblock {email}?',
        userDataNotFound: 'User data not found',
        failedLoad: 'Failed to load blocked users',
        notSignedIn: 'Not signed in',
        failedUnblock: 'Failed to unblock',
        loginToManage: 'Log in to manage blocked users',
        loginToSee: 'Log in to see your blocked users.',
        unblocked: 'Unblocked {email}'
      },
      es: {
        title: 'Usuarios bloqueados',
        subtitle: 'Administra los usuarios que has bloqueado desde tu cuenta.',
        searchPlaceholder: 'Buscar usuarios bloqueados',
        loading: 'Cargando…',
        noBlockedUsersTitle: 'No hay usuarios bloqueados',
        noBlockedUsersBody: 'Cualquier persona que bloquees aparecerá aquí.',
        noMatchesTitle: 'Sin resultados',
        noMatchesBody: 'Prueba con otro nombre o correo.',
        view: 'Ver',
        unblock: 'Desbloquear',
        confirmUnblock: '¿Desbloquear a {email}?',
        userDataNotFound: 'No se encontraron los datos del usuario',
        failedLoad: 'No se pudieron cargar los usuarios bloqueados',
        notSignedIn: 'No has iniciado sesión',
        failedUnblock: 'No se pudo desbloquear',
        loginToManage: 'Inicia sesión para administrar usuarios bloqueados',
        loginToSee: 'Inicia sesión para ver tus usuarios bloqueados.',
        unblocked: 'Desbloqueado {email}'
      },
      ru: {
        title: 'Заблокированные пользователи',
        subtitle: 'Управляйте пользователями, которых вы заблокировали в аккаунте.',
        searchPlaceholder: 'Поиск среди заблокированных',
        loading: 'Загрузка…',
        noBlockedUsersTitle: 'Заблокированных пользователей нет',
        noBlockedUsersBody: 'Все, кого вы заблокируете, будут показаны здесь.',
        noMatchesTitle: 'Совпадений нет',
        noMatchesBody: 'Попробуйте другое имя или email.',
        view: 'Открыть',
        unblock: 'Разблокировать',
        confirmUnblock: 'Разблокировать {email}?',
        userDataNotFound: 'Данные пользователя не найдены',
        failedLoad: 'Не удалось загрузить заблокированных пользователей',
        notSignedIn: 'Вы не вошли в аккаунт',
        failedUnblock: 'Не удалось разблокировать',
        loginToManage: 'Войдите, чтобы управлять заблокированными пользователями',
        loginToSee: 'Войдите, чтобы увидеть заблокированных пользователей.',
        unblocked: 'Разблокирован {email}'
      },
      de: {
        title: 'Blockierte Nutzer',
        subtitle: 'Verwalte die Nutzer, die du in deinem Konto blockiert hast.',
        searchPlaceholder: 'Blockierte Nutzer suchen',
        loading: 'Wird geladen…',
        noBlockedUsersTitle: 'Keine blockierten Nutzer',
        noBlockedUsersBody: 'Alle von dir blockierten Personen werden hier angezeigt.',
        noMatchesTitle: 'Keine Treffer',
        noMatchesBody: 'Versuche es mit einem anderen Namen oder einer anderen E-Mail.',
        view: 'Ansehen',
        unblock: 'Entsperren',
        confirmUnblock: '{email} entsperren?',
        userDataNotFound: 'Nutzerdaten nicht gefunden',
        failedLoad: 'Blockierte Nutzer konnten nicht geladen werden',
        notSignedIn: 'Nicht angemeldet',
        failedUnblock: 'Entsperren fehlgeschlagen',
        loginToManage: 'Melde dich an, um blockierte Nutzer zu verwalten',
        loginToSee: 'Melde dich an, um deine blockierten Nutzer zu sehen.',
        unblocked: '{email} entsperrt'
      },
      ja: {
        title: 'ブロックしたユーザー',
        subtitle: 'アカウントでブロックしたユーザーを管理します。',
        searchPlaceholder: 'ブロックしたユーザーを検索',
        loading: '読み込み中…',
        noBlockedUsersTitle: 'ブロックしたユーザーはいません',
        noBlockedUsersBody: 'ブロックした相手はここに表示されます。',
        noMatchesTitle: '一致する結果がありません',
        noMatchesBody: '別の名前またはメールアドレスで試してください。',
        view: '表示',
        unblock: 'ブロック解除',
        confirmUnblock: '{email} のブロックを解除しますか？',
        userDataNotFound: 'ユーザーデータが見つかりません',
        failedLoad: 'ブロックしたユーザーの読み込みに失敗しました',
        notSignedIn: 'サインインしていません',
        failedUnblock: 'ブロック解除に失敗しました',
        loginToManage: 'ブロックしたユーザーを管理するにはログインしてください',
        loginToSee: 'ブロックしたユーザーを見るにはログインしてください。',
        unblocked: '{email} をブロック解除しました'
      }
    };

    let currentLang = 'en';
    let currentUserEmail = null;
    let blockedList = [];
    let blockedDetails = [];

    const listContainer = document.getElementById('listContainer');
    const searchInput = document.getElementById('searchInput');
    const toastEl = document.getElementById('toast');

    function normalizeLang(v) {
      const s = String(v || '').trim().toLowerCase();
      if (!s) return '';
      const base = s.split(/[-_]/)[0];
      const map = { english: 'en', spanish: 'es', russian: 'ru', german: 'de', japanese: 'ja', jp: 'ja' };
      return SUPPORTED_LANGS.includes(base) ? base : (map[s] || map[base] || '');
    }

    function browserLang() {
      return SUPPORTED_LANGS.includes(normalizeLang(navigator.language)) ? normalizeLang(navigator.language) : 'en';
    }

    function t(key, params = {}) {
      const dict = I18N[currentLang] || I18N.en;
      let value = dict[key] ?? I18N.en[key] ?? key;
      for (const [k, v] of Object.entries(params)) value = String(value).replaceAll(`{${k}}`, String(v));
      return value;
    }

    function applyTranslations() {
      document.documentElement.lang = currentLang;
      document.title = t('title');
      document.getElementById('t-title').textContent = t('title');
      document.getElementById('t-subtitle').textContent = t('subtitle');
      searchInput.placeholder = t('searchPlaceholder');
      searchInput.setAttribute('aria-label', t('searchPlaceholder'));
      const loadingState = document.getElementById('loadingState');
      if (loadingState && loadingState.textContent.trim() === 'Loading…') loadingState.textContent = t('loading');
    }

    function showToast(message, color = 'purple', duration = 3000) {
      if (!toastEl) return;
      toastEl.textContent = message;
      toastEl.className = color;
      toastEl.style.display = 'block';
      setTimeout(() => {
        toastEl.style.display = 'none';
        toastEl.className = '';
      }, duration);
    }

    async function fetchUserData(email) {
      try {
        const snap = await db.collection('user_data').doc(email).get();
        if (!snap.exists) return null;
        return snap.data();
      } catch (e) {
        console.warn('fetchUserData error', e);
        return null;
      }
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    function renderList(filter = '') {
      const normalized = (filter || '').toLowerCase().trim();
      const visible = blockedDetails.filter(b => {
        if (!b) return false;
        return !normalized ||
          (b.displayName && b.displayName.toLowerCase().includes(normalized)) ||
          b.email.toLowerCase().includes(normalized) ||
          (b.tagline && b.tagline.toLowerCase().includes(normalized));
      });

      if (visible.length === 0) {
        listContainer.innerHTML = blockedList.length === 0
          ? `<div class="empty-state"><strong>${escapeHtml(t('noBlockedUsersTitle'))}</strong>${escapeHtml(t('noBlockedUsersBody'))}</div>`
          : `<div class="empty-state"><strong>${escapeHtml(t('noMatchesTitle'))}</strong>${escapeHtml(t('noMatchesBody'))}</div>`;
        return;
      }

      listContainer.innerHTML = '';
      visible.forEach(item => {
        const row = document.createElement('div');
        row.className = 'row';

        const pfp = document.createElement('div');
        pfp.className = 'pfp';
        pfp.style.backgroundImage = `url('${item.profile_picture || '/org-owner.jpg'}')`;

        const info = document.createElement('div');
        info.className = 'row-info';
        info.innerHTML = `
          <div class="row-name">${escapeHtml(item.displayName || item.email)}</div>
          <div class="row-sub">${escapeHtml(item.tagline || item.email)}</div>
        `;

        const actions = document.createElement('div');
        actions.className = 'row-actions';

        const viewBtn = document.createElement('button');
        viewBtn.className = 'btn small';
        viewBtn.textContent = t('view');
        viewBtn.onclick = () => { window.location.href = `/viewprofile?profile=${encodeURIComponent(item.email)}`; };

        const unblockBtn = document.createElement('button');
        unblockBtn.className = 'btn small';
        unblockBtn.textContent = t('unblock');
        unblockBtn.onclick = async () => {
          if (!confirm(t('confirmUnblock', { email: item.email }))) return;
          await unblockEmail(item.email);
        };

        actions.appendChild(viewBtn);
        actions.appendChild(unblockBtn);
        row.appendChild(pfp);
        row.appendChild(info);
        row.appendChild(actions);
        listContainer.appendChild(row);
      });
    }

    async function loadBlockedUsers(email) {
      listContainer.innerHTML = `<div class="empty-state">${escapeHtml(t('loading'))}</div>`;
      try {
        const userSnap = await db.collection('user_data').doc(email).get();
        if (!userSnap.exists) {
          blockedList = [];
          blockedDetails = [];
          renderList(searchInput.value);
          showToast(t('userDataNotFound'), 'yellow', 2000);
          return;
        }
        const data = userSnap.data();
        blockedList = Array.isArray(data.blockedUsers) ? data.blockedUsers.slice() : [];
        const emails = blockedList.slice(0, 200);
        const detailPromises = emails.map(async e => {
          const ud = await fetchUserData(e).catch(() => null);
          return {
            email: e,
            displayName: ud && ud['display name'] ? ud['display name'] : e,
            profile_picture: ud && ud.profile_picture ? ud.profile_picture : '/org-owner.jpg',
            tagline: ud && ud.tagline ? ud.tagline : ''
          };
        });
        blockedDetails = await Promise.all(detailPromises);
        renderList(searchInput.value);
      } catch (err) {
        console.error('loadBlockedUsers', err);
        showToast(t('failedLoad'), 'red', 3000);
      }
    }

    async function unblockEmail(email) {
      if (!currentUserEmail) return showToast(t('notSignedIn'), 'yellow');
      try {
        await db.collection('user_data').doc(currentUserEmail).update({
          blockedUsers: firebase.firestore.FieldValue.arrayRemove(email)
        });
        showToast(t('unblocked', { email }), 'purple', 2000);
        await loadBlockedUsers(currentUserEmail);
      } catch (e) {
        console.error('unblockEmail', e);
        showToast(t('failedUnblock'), 'red', 3000);
      }
    }

    searchInput.addEventListener('input', () => renderList(searchInput.value));

    async function resolveLanguage(user) {
      let lang = '';
      try {
        if (user && user.email) {
          const snap = await db.collection('user_data').doc(user.email).get();
          lang = normalizeLang(snap.exists ? snap.data()?.lang : '') || '';
        }
      } catch (e) {}
      currentLang = SUPPORTED_LANGS.includes(lang) ? lang : browserLang();
      applyTranslations();
    }

    auth.onAuthStateChanged(async user => {
      await resolveLanguage(user);

      if (!user) {
        showToast(t('loginToManage'), 'yellow', 3000);
        currentUserEmail = null;
        blockedList = [];
        blockedDetails = [];
        listContainer.innerHTML = `<div class="empty-state">${escapeHtml(t('loginToSee'))}</div>`;
        return;
      }

      currentUserEmail = user.email;
      await loadBlockedUsers(currentUserEmail);
    });
  </script>
</body>
</html>
