      height: 56px;
      margin: 0 auto 20px auto;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--soft);
      border: 1px solid var(--border-strong);
      color: var(--accent);
    }
    .icon-badge svg { width: 26px; height: 26px; display: block; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .eyebrow .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .eyebrow.pending .dot { background: #e6b800; }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .sub {
      color: var(--muted);
      margin-top: 10px;
      font-size: 14.5px;
      line-height: 1.6;
      max-width: 46ch;
      margin-left: auto;
      margin-right: auto;
    }

    .path-row {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
    }
    .path-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .file-path {

      background: var(--soft);
      padding: 6px 10px;
      border-radius: 8px;
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 12.5px;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

    .actions {
      margin-top: 26px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn svg { width: 15px; height: 15px; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #fff;
    }
    .btn-secondary {
      background: var(--soft);
      border-color: var(--border-strong);
      color: var(--text);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.06); }

      margin-top: 22px;
      display: flex;
      justify-content: center;
      gap: 6px;
    }
    .progress-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .35;
      animation: pulse 1.4s ease-in-out infinite;

    .progress-dots span:nth-child(3) { animation-delay: .36s; }

      0%, 100% { opacity: .25; transform: scale(1); }

      margin-top: 22px;
      font-size: 12px;
      color: var(--muted);

      function renderState(state) {
        const card = document.getElementById('state-card');
        const iconBadge = document.getElementById('icon-badge');
        const eyebrow = document.getElementById('eyebrow');
        const eyebrowText = document.getElementById('eyebrow-text');
        const title = document.getElementById('state-title');
        const sub = document.getElementById('state-sub');
        const pathRow = document.getElementById('path-row');
        const pathLabel = document.getElementById('path-label');
        const missingFile = document.getElementById('missing-file');

        iconBadge.innerHTML = state.icon || ICONS.notfound;
        eyebrow.className = 'eyebrow' + (state.pending ? ' pending' : '');
        eyebrow.style.display = state.eyebrow ? 'inline-flex' : 'none';
        eyebrowText.dataset.role = 'dynamic';
        eyebrowText.textContent = state.eyebrow || (state.pending ? currentT.comingSoon : currentT.eyebrow);
        title.textContent = state.title || currentT.defaultTitle;
        sub.textContent = state.sub || currentT.defaultSub;

        if (state.showPath) {
          pathLabel.textContent = state.pathLabel || currentT.requestedLabel;
          missingFile.textContent = state.pathValue || '/unknown';
          pathRow.style.display = 'none';
        } else {
          pathRow.style.display = 'none';
        }

        document.title = state.pageTitle || currentT.pageTitle;
        card.classList.remove('visible');
        card.style.display = 'block';
        requestAnimationFrame(() => card.classList.add('visible'));
      }

      function resolveState(currentPath, pages) {
        if (pages.includes(currentPath)) {
          return {
            pending: true,
            eyebrow: currentT.comingSoon,
            pageTitle: currentT.comingSoon,
            title: currentT.soonTitle,
            sub: currentT.soonSub,
            icon: ICONS.soon,
            showPath: true,
            pathLabel: currentT.sectionLabel,
            pathValue: currentPath
          };
        }

        if (currentPath.startsWith('/legacy/')) {
          return {
            eyebrow: currentT.legacy,
            pageTitle: currentT.legacy,
            title: currentT.legacyTitle,
            sub: currentT.legacySub,
            icon: ICONS.legacy,
            showPath: true,
            pathLabel: currentT.legacyPathLabel,
            pathValue: currentPath
          };
        }

        if (currentPath.startsWith('/docs/')) {
          return {
            eyebrow: currentT.docs,
            pageTitle: currentT.docs,
            title: currentT.docsTitle,
            sub: currentT.docsSub,
            icon: ICONS.docs,
            showPath: true,
            pathLabel: currentT.docsPathLabel,
            pathValue: currentPath
          };
        }

        if (currentPath.startsWith('/events/')) {
          return {
            eyebrow: currentT.events,
            pageTitle: currentT.events,
            title: currentT.eventTitle,
            sub: currentT.eventSub,
            icon: ICONS.event,
            showPath: true,
            pathLabel: currentT.eventPathLabel,
            pathValue: currentPath
          };
        }

        if (currentPath.startsWith('/playgrounds/')) {
          return {
            eyebrow: currentT.playgrounds,
            pageTitle: currentT.playgrounds,
            title: currentT.playgroundsTitle,
            sub: currentT.playgroundsSub,
            icon: ICONS.playground,
            showPath: true,
            pathLabel: currentT.playgroundPathLabel,
            pathValue: currentPath
          };
        }

        const lastSegment = (currentPath.split('/').pop() || '').trim();
        const hasExtension = /\.[^/.]+$/.test(lastSegment);
        const isHtml = /\.html?$/i.test(lastSegment);

        if (hasExtension && !isHtml) {
          return {
            eyebrow: currentT.files,
            pageTitle: currentT.files,
            title: currentT.fileTitle,
            sub: currentT.fileSub,
            icon: ICONS.file,
            showPath: true,
            pathLabel: currentT.filePathLabel,
            pathValue: currentPath
          };
        }

        return {
          eyebrow: currentT.eyebrow,
          pageTitle: currentT.pageTitle,
          title: currentT.defaultTitle,
          sub: currentT.defaultSub,
          icon: ICONS.notfound,
          showPath: true,
          pathLabel: currentT.requestedLabel,
          pathValue: currentPath
        };
      }

      const rawPath = window.location.pathname || '/';
      const currentPath = normalizePath(rawPath);

      function bootstrapWithPages(pages) {
        const normalizedPages = Array.isArray(pages) ? pages.map(normalizePath) : [];
        const state = resolveState(currentPath, normalizedPages);
        renderState(state);
      }

      async function loadLanguage() {
        try {
          const user = auth.currentUser;
          if (!user || !user.email) {
            setStaticTexts(DEFAULT_LANG);
            return;
          }
          const doc = await db.collection('user_data').doc(user.email).get();
          const lang = doc.exists ? doc.data()?.lang : null;
          setStaticTexts(lang);
        } catch (e) {
          setStaticTexts(DEFAULT_LANG);
        }
      }

      async function init() {
        await loadLanguage();

        db.collection('server_global_data').doc('general').get()
          .then(doc => {
            const pages = (doc.exists && Array.isArray(doc.data().coming_soon_pages))
              ? doc.data().coming_soon_pages
              : [];
            bootstrapWithPages(pages);
          })
          .catch(() => {
            bootstrapWithPages([]);
          });
      }

      auth.onAuthStateChanged(() => {
        init();
      });
    })();
  </script>
