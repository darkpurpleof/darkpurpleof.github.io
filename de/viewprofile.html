<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile</title>

  <script src="/authorUGCList.js"></script>

    <script src="/sendgift.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#171717;
      --card:#1f1f1f;
      --card-2:#232323;
      --muted:#9ca3af;
      --accent:#6b21a8;
      --accent-strong:#5b21b6;
      --text:#eaeaea;
      --border:rgba(255,255,255,0.06);
      --border-strong:rgba(255,255,255,0.10);
      --danger:#c01b1b;
      --danger-dark:#6a0f0f;
      --white-btn-bg:rgba(255,255,255,0.03);
      --btn-border-muted:rgba(255,255,255,0.05);
      --soft-shadow:0 10px 28px rgba(2,6,23,0.34);
    }
    body.light{
      --bg:#f6f8fb;
      --card:#ffffff;
      --card-2:#ffffff;
      --muted:#475569;
      --text:#0f172a;
      --border:rgba(0,0,0,0.06);
      --border-strong:rgba(0,0,0,0.10);
      --white-btn-bg:rgba(0,0,0,0.04);
      --btn-border-muted:rgba(0,0,0,0.06);
      --soft-shadow:0 10px 24px rgba(15,23,42,0.08);
    }

    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
    body{display:flex;flex-direction:column;min-height:100vh;}

    dp-topbar{display:block;position:sticky;top:0;z-index:100;}

    main.container{
      width:min(880px, calc(100% - 28px));
      margin:28px auto 60px;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    /* ---------------- Hero ---------------- */
    .hero{
      position:relative;
      border-radius:22px;
      overflow:visible;
      background:linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0));
      background-color:var(--card);
      border:1px solid var(--border);
      box-shadow:var(--soft-shadow);
    }
    .hero-banner{
      width:100%;
      height:210px;
      background:#2a2a2a center/cover no-repeat;
      position:relative;
      cursor:pointer;
      border-radius:22px 22px 0 0;
    }
    .hero-banner::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.5) 100%),
        linear-gradient(120deg, rgba(107,33,168,0.20), rgba(0,0,0,0) 60%);
    }

    .hero-body{position:relative;padding:0 28px 28px;}
    .owner-actions{
      position:absolute;
      top:12px;
      right:28px;
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      z-index:20;
      pointer-events:auto;
    }
    .owner-action-btn{
      border:1px solid var(--btn-border-muted);
      background:var(--card-2);
      color:var(--text);
      border-radius:12px;
      padding:8px 12px;
      min-height:36px;
      font-size:13px;
      font-weight:700;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      transition:transform .14s ease, border-color .14s ease, background .14s ease;
    }
    .owner-action-btn:hover{transform:translateY(-1px);border-color:var(--border-strong);}

    .identity-row{
      display:flex;
      gap:18px;
      align-items:flex-end;
      margin-top:-58px;
      flex-wrap:wrap;
    }

    .pfp-wrap{position:relative;flex:0 0 auto;width:132px;height:132px;}
    .pfp-ring{
      width:132px;height:132px;
      border-radius:50%;
      padding:4px;
      background:transparent;
      overflow:hidden;
    }
    .pfp{
      width:100%;height:100%;
      border-radius:50%;
      background-size:cover;background-position:center;background-repeat:no-repeat;
      background-color:#303030;
      border:3px solid var(--card);
      cursor:pointer;
      overflow:hidden;
    }
    .pfp-frame{
      position:absolute;inset:4px;
      border-radius:50%;
      pointer-events:none;
      display:none;
      background-size:cover;background-position:center;background-repeat:no-repeat;
    }

    .identity-main{flex:1;min-width:220px;padding-bottom:8px;}
    .display-name{
      font-size:26px;font-weight:800;line-height:1.15;
      display:flex;gap:8px;align-items:center;flex-wrap:wrap;letter-spacing:-0.02em;
      text-shadow:0 2px 12px rgba(0,0,0,0.25);
    }
    .verified{width:19px;height:19px;background-image:url('/assets/verified.png');background-size:contain;background-repeat:no-repeat;display:inline-block;transform:translateY(1px);}
    .email{color:var(--muted);font-size:13px;margin-top:5px;word-break:break-all;}

    .status-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
    .chip{
      display:inline-flex;align-items:center;gap:7px;
      padding:6px 11px;border-radius:999px;
      border:1px solid var(--border);background:var(--white-btn-bg);
      color:var(--text);font-size:12.5px;font-weight:600;
    }
    .chip:empty{display:none;}
    .chip.dot::before{
      content:"";width:7px;height:7px;border-radius:999px;
      background:var(--accent);box-shadow:0 0 0 4px rgba(107,33,168,0.18);flex:0 0 auto;
    }

    .section-label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
    .subtle{color:var(--muted);font-size:13px;line-height:1.55;margin:0;}
    .muted{color:var(--muted);}

    .stat-strip{display:flex;align-items:center;gap:0;margin-top:20px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--border);}
    .stat-strip .stat-item{display:flex;align-items:baseline;gap:6px;padding-right:16px;margin-right:16px;border-right:1px solid var(--border-strong);}
    .stat-strip .stat-item:last-child{border-right:none;margin-right:0;padding-right:0;}
    .stat-strip .stat-item .v{font-size:16px;font-weight:800;letter-spacing:-0.01em;}
    .stat-strip .stat-item .k{font-size:12.5px;color:var(--muted);font-weight:600;}

    .bio-block{margin-top:18px;}
    #bio-text{font-size:14.5px;line-height:1.65;color:var(--text);max-width:640px;}

    /* ---------------- Prominent interaction bar ---------------- */
    .hero-actions-row{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      margin-top:20px;flex-wrap:wrap;
    }
    .action-buttons{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .action-tools{display:flex;align-items:center;gap:8px;}
    .share-btn,
    .more-btn{
      width:44px;height:44px;
      border-radius:999px;
      border:1px solid var(--btn-border-muted);
      background:var(--white-btn-bg);
      color:var(--text);
      display:inline-flex;
      align-items:center;justify-content:center;
      cursor:pointer;
      transition:background .14s ease, border-color .14s ease, transform .14s ease;
    }
    .share-btn:hover,
    .more-btn:hover{border-color:var(--border-strong);transform:translateY(-1px);}
    .share-btn svg,
    .more-btn svg{width:18px;height:18px;}
    .action-btn{
      padding:11px 18px;
      border-radius:999px;
      border:1px solid var(--btn-border-muted);
      background:var(--white-btn-bg);
      color:var(--text);
      cursor:pointer;
      font-weight:700;
      font-size:14px;
      min-height:44px;
      display:inline-flex;
      gap:8px;
      align-items:center;
      justify-content:center;
      white-space:nowrap;
      transition:transform .14s ease, opacity .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease;
    }
    .action-btn svg{width:17px;height:17px;flex:0 0 auto;}
    .action-btn:hover{transform:translateY(-1px);border-color:var(--border-strong);box-shadow:0 6px 16px rgba(0,0,0,0.18);}
    .action-btn:active{transform:translateY(0);}
    .action-btn:disabled{cursor:not-allowed;transform:none;box-shadow:none;}
    .action-btn:disabled,
    .more-btn:disabled{
      opacity:0.6;
      filter:grayscale(0.7);
      cursor:not-allowed;
    }
    .action-btn.primary{
      background:linear-gradient(135deg, var(--accent), var(--accent-strong));
      color:#fff;
      border:1px solid transparent;
      box-shadow:0 8px 20px rgba(107,33,168,0.34);
    }
    .action-btn.primary:hover{filter:brightness(1.08);}
    .action-btn.secondary{background:var(--card-2);}
    .action-btn.red{background:rgba(192,27,27,0.08);color:var(--danger-dark);border:1px solid rgba(106,15,15,0.16);}
    .action-btn.red:hover{background:rgba(192,27,27,0.14);border-color:rgba(106,15,15,0.3);}
    .action-btn.friend-remove{background:#fca5a5;color:#7f1d1d;border-color:#f87171;}
    .action-btn.friend-remove:hover{background:#f87171;border-color:#ef4444;}

    body.light .action-btn.friend-remove{background:#fee2e2;color:#991b1b;border-color:#fecaca;}
    body.light .action-btn.friend-remove:hover{background:#fecaca;border-color:#fca5a5;}

    .more-wrap{position:relative;z-index:60;flex:0 0 auto;}
    .more-menu{
      position:absolute;top:calc(100% + 8px);right:0;min-width:210px;
      background:var(--card);border:1px solid var(--border-strong);border-radius:14px;
      box-shadow:0 16px 40px rgba(0,0,0,0.38);padding:6px;
      display:none;flex-direction:column;gap:2px;z-index:100;
    }
    .more-menu.open{display:flex;}
    .more-menu .action-btn{
      justify-content:flex-start;width:100%;border-radius:9px;border:none;
      background:transparent;padding:9px 10px;min-height:36px;font-size:13.5px;box-shadow:none;
    }
    .more-menu .action-btn:hover{transform:none;background:var(--white-btn-bg);box-shadow:none;}
    .more-menu .action-btn.red:hover{background:rgba(192,27,27,0.1);}

    @media (max-width: 560px){
      .hero-actions-row{width:100%;position:static;display:flex;align-items:center;justify-content:space-between;gap:8px;}
      .action-buttons{width:auto;flex:1 1 auto;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0;}
      .action-buttons .action-btn{width:auto;flex:0 0 auto;}
      .hero-actions-row > .action-tools{position:static;margin-left:8px;display:flex;align-items:center;gap:8px;flex:0 0 auto;}
      .share-btn{display:none;}
      .more-btn{border-radius:14px;}
      .action-btn{border-radius:14px;}
      .action-buttons #friendBtn{
        flex:1 1 auto;
        width:auto;
        min-width:0;
        padding:11px 14px;
        height:44px;
        border-radius:14px;
      }
    }

    @media (min-width: 561px){
      .hero-actions-row{
        justify-content:flex-start;
        gap:8px;
      }

      .hero-actions-row > .action-buttons{
        flex:1 1 auto;
        min-width:0;
      }

      .hero-actions-row > .action-buttons .action-btn{
        width:100%;
        border-radius:14px;
      }

      .hero-actions-row > .more-wrap .more-btn{
        border-radius:14px;
      }
    }

    /* ---------------- Tabs ---------------- */
    .tab-nav{
      display:flex;gap:4px;
      background:var(--card);border:1px solid var(--border);
      padding:6px;border-radius:14px;box-shadow:var(--soft-shadow);
      position:sticky;top:12px;z-index:10;
    }
    .tab-btn{
      flex:1;padding:10px 14px;border-radius:10px;border:none;background:transparent;
      color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer;
      transition:background .15s ease,color .15s ease;
      font-family:inherit;
    }
    .tab-btn.active{background:var(--accent);color:#fff;}
    .tab-btn:hover:not(.active){background:var(--white-btn-bg);color:var(--text);}

    .tab-panel{display:none;animation:fadeIn .18s ease;}
    .tab-panel.active{display:block;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

    .panel-card{
      background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0));
      background-color:var(--card);
      border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:var(--soft-shadow);
    }
    .panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
    .panel-title h3{margin:0;font-size:16px;letter-spacing:-0.01em;}

    /* Overview */
    .feature-list{display:flex;flex-direction:column;gap:12px;}
    .feature-item{display:flex;gap:14px;align-items:flex-start;padding:15px;border:1px solid var(--border);border-radius:14px;background:var(--card-2);}
    .feature-item .f-icon{
      width:38px;height:38px;border-radius:11px;flex:0 0 auto;
      background:rgba(107,33,168,0.14);color:var(--accent);
      display:flex;align-items:center;justify-content:center;
    }
    .feature-item .f-icon svg{width:19px;height:19px;}
    .feature-item strong{display:block;font-size:14.5px;margin-bottom:4px;}

    /* Roles grid */
    .role-grid{display:flex;flex-direction:column;gap:12px;}
    .role-item{
      display:flex;gap:12px;align-items:center;padding:14px;
      border:1px solid var(--border);border-radius:14px;background:var(--card-2);
      transition:transform .15s ease,border-color .15s ease;
    }
    .role-item:hover{transform:translateY(-2px);border-color:var(--border-strong);}
    .role-item img{width:34px;height:34px;object-fit:cover;border-radius:9px;flex:0 0 auto;background:rgba(255,255,255,0.04);}
    .role-item strong{font-size:14px;display:block;color:var(--text);}
    .role-item .subtle{margin-top:2px;}

    .post-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
    .post-filter{
      padding:8px 12px;border-radius:10px;border:1px solid var(--border);
      background:var(--white-btn-bg);color:var(--muted);font:inherit;font-size:12.5px;
      font-weight:700;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease;
    }
    .post-filter:hover{background:var(--hover, var(--white-btn-bg));color:var(--text);border-color:var(--border-strong);}
    .post-filter.active{background:var(--accent);border-color:var(--accent);color:#fff;}
    .profile-posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
    .profile-post-card{
      min-width:0;background:var(--card-2);border:1px solid var(--border);
      border-left:3px solid var(--accent);border-radius:14px;padding:16px;
      cursor:pointer;display:flex;flex-direction:column;gap:11px;box-shadow:var(--soft-shadow);
      transition:transform .15s ease,border-color .15s ease;
    }
    .profile-post-card:hover{transform:translateY(-3px);border-color:var(--accent);}
    .profile-post-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
    .profile-post-head{display:flex;align-items:center;gap:8px;min-width:0;}
    .profile-post-author{min-width:0;flex:1;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .profile-post-date{flex:0 0 auto;color:var(--muted);font-size:11px;white-space:nowrap;}
    .profile-post-text{font-size:14px;line-height:1.55;max-height:110px;overflow:hidden;white-space:pre-wrap;word-break:break-word;}
    .profile-post-image-wrap{position:relative;border-radius:10px;overflow:hidden;height:160px;background:var(--bg);}
    .profile-post-image{width:100%;height:100%;object-fit:cover;display:block;}
    .profile-post-image-dim{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-size:23px;font-weight:800;}
    .profile-post-empty{grid-column:1/-1;padding:28px 8px;color:var(--muted);font-size:13px;text-align:center;}

    @media (max-width:560px){
      .profile-posts{grid-template-columns:1fr;}
    }

    #ugc-list{margin-top:2px;}

    #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:10px 14px;border-radius:10px;font-weight:700;display:none;z-index:99999;color:#fff;box-shadow:var(--soft-shadow);}
    #toast.purple{background:var(--accent-strong);}
    #toast.red{background:#c00;}
    #toast.yellow{background:#e6b800;color:#222;}

    .share-dialog-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.62);display:none;align-items:center;justify-content:center;padding:20px;z-index:99999;}
    .share-dialog-backdrop.open{display:flex;}
    .share-dialog{width:min(460px, 100%);background:var(--card);border:1px solid var(--border-strong);border-radius:18px;padding:20px;box-shadow:var(--soft-shadow);color:var(--text);}
    .share-dialog h3{margin:0 0 8px;font-size:18px;}
    .share-dialog p{margin:0 0 12px;color:var(--muted);line-height:1.55;font-size:14px;}
    .share-dialog input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card-2);color:var(--text);font:inherit;margin-bottom:12px;}
    .share-dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
    .share-dialog-actions button{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--white-btn-bg);color:var(--text);font:inherit;font-weight:700;cursor:pointer;}
    .share-dialog-actions .primary{background:var(--accent);color:#fff;border-color:var(--accent);} 
  </style>
</head>
<body>
  <script type="module" src="/dp-topbar.js"></script>
  <script type="module" src="/dp-rich-components.js"></script>
  <script src="/dp-diag.js"></script>
  <script type="module" src="/imageviewer.js"></script>
  <dp-topbar></dp-topbar>
 
  <main class="container" role="main" aria-label="View profile">

    <article class="hero">
      <div id="banner" class="hero-banner" title="Profile banner"></div>
      <div class="hero-body">
        <div id="ownerActions" class="owner-actions" hidden></div>
        <div class="identity-row">
          <div class="pfp-wrap">
            <div class="pfp-ring">
              <div id="profile-pic" class="pfp" title="Profile picture"></div>
            </div>
            <div id="pfp-frame" class="pfp-frame"></div>
          </div>

          <div class="identity-main">
            <div class="display-name">
              <div id="display-name">Loading…</div>
              <div id="verified" class="verified" title="Verified" style="display:none;"></div>
            </div>
            <div id="email" class="email"></div>
          </div>
        </div>

        <div class="stat-strip" id="counters">
          <div class="stat-item"><span class="v" id="followers-count">0</span><span class="k">Followers</span></div>
          <div class="stat-item"><span class="v" id="following-count">0</span><span class="k">Following</span></div>
          <div class="stat-item"><span class="v" id="friends-count">0</span><span class="k">Friends</span></div>
        </div>

        <div class="bio-block">
          <span class="section-label">Bio</span>
          <div id="bio-text">Loading…</div>
        </div>

        <div class="hero-actions-row" id="interactionArea">
          <div id="interactionButtons" class="action-buttons">
            <div style="color:var(--muted)">Loading actions…</div>
          </div>
          <div class="action-tools">
            <button id="shareBtn" class="share-btn" type="button" title="Share profile" aria-label="Share profile">
              <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#CCCCCC"><path d="M680-80q-50 0-85-35t-35-85q0-6 3-28L282-392q-16 15-37 23.5t-45 8.5q-50 0-85-35t-35-85q0-50 35-85t85-35q24 0 45 8.5t37 23.5l281-164q-2-7-2.5-13.5T560-760q0-50 35-85t85-35q50 0 85 35t35 85q0 50-35 85t-85 35q-24 0-45-8.5T598-672L317-508q2 7 2.5 13.5t.5 14.5q0 8-.5 14.5T317-452l281 164q16-15 37-23.5t45-8.5q50 0 85 35t35 85q0 50-35 85t-85 35Zm0-80q17 0 28.5-11.5T720-200q0-17-11.5-28.5T680-240q-17 0-28.5 11.5T640-200q0 17 11.5 28.5T680-160ZM200-440q17 0 28.5-11.5T240-480q0-17-11.5-28.5T200-520q-17 0-28.5 11.5T200-480q0 17 11.5 28.5T200-440Zm508.5-291.5Q720-743 720-760t-11.5-28.5Q697-800 680-800t-28.5 11.5Q640-777 640-760t11.5 28.5Q663-720 680-720t28.5-11.5ZM680-200ZM200-480Zm480-280Z"/></svg>
            </button>

    let currentLang = 'en';

    function normalizeLang(code) {
      const raw = String(code || '').trim().toLowerCase();
      if (!raw) return '';
      const two = raw.slice(0, 2);
      return SUPPORTED_LANGS.has(raw) ? raw : (SUPPORTED_LANGS.has(two) ? two : '');
    }

    function getBrowserLang() {
      return normalizeLang(navigator.language || navigator.userLanguage || 'en') || 'en';
    }

    function t(key, vars = {}) {
      const pack = I18N[currentLang] || I18N.en;
      const fallback = I18N.en || {};
      let out = pack[key] ?? fallback[key] ?? key;
      return String(out).replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? ''));
    }

    function postCountLabel(count) {
      const n = Number(count) || 0;
      if (currentLang === 'ru') {
        const mod10 = n % 10;
        const mod100 = n % 100;
        const word = (mod10 === 1 && mod100 !== 11) ? 'пост' : ((mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) ? 'поста' : 'постов');
        return `${n} ${word}`;
      }
      if (currentLang === 'ja') return `${n}件の投稿`;
      if (currentLang === 'de') return `${n} ${n === 1 ? 'Beitrag' : 'Beiträge'}`;
      if (currentLang === 'es') return `${n} ${n === 1 ? 'publicación' : 'publicaciones'}`;
      return `${n} ${n === 1 ? 'post' : 'posts'}`;
    }

    async function resolvePreferredLang(email) {
      const fallback = getBrowserLang();
      if (!email) return fallback;
      try {
        const snap = await db.collection('user_data').doc(email).get();
        const raw = snap.exists ? normalizeLang(snap.get('lang')) : '';
        return raw || fallback;
      } catch (err) {
        return fallback;
      }
    }

    const followersCountEl = document.getElementById('followers-count');

    function showToast(msg, color='purple', duration=3000){
      toastEl.textContent = msg;
      toastEl.className = color;
      toastEl.style.display = 'block';
      setTimeout(()=>{ toastEl.style.display = 'none'; toastEl.className=''; }, duration);

    function getProfileParam(){
      const params = new URLSearchParams(window.location.search);
      const p = params.get('profile');
      return p ? decodeURIComponent(p) : null;
    }

    function fallbackProfile(emailArg){
      return {
        displayName: t('noDisplayName'),
        email: emailArg,
        profile_picture: '/org-owner.jpg',
        banner: '/assets/def_banner.png',
        bannedBanner: '/assets/def_banner.png',
        roles: ['Member'],
        bio: t('noBioAvailable'),

      };

    function docIdFromEmail(email){ return email; }
    const permissionDeniedFor = {};

    let relationshipState = {
      isBlockedByCurrent: false,
      hasBlockedCurrent: false,
      isFollowing: false,
      isFollowedBy: false,
      friendExists: false,
      requestSent: false,
      requestReceived: false
    };

    let currentUser = null;
    let viewedEmail = null;
    let viewedData = null;
    let isFallbackProfile = false;
    let hasShownBlockedProfileWarning = false;
    let unsubscribes = [];
    let profilePosts = [];
    let profilePostsEmail = '';
    let profilePostsFilter = 'posts';
    let profilePostsRequestId = 0;

    function clearUnsubscribes(){
      for(const u of unsubscribes){
        try { if (typeof u === 'function') u(); } catch(e) {}
      }
      unsubscribes = [];
    }

    function isFirestorePermissionError(err){
      if (!err) return false;
      try {
        if (err.code === 'permission-denied' || err.code === 'PERMISSION_DENIED') return true;
        const msg = String(err.message || err);
        return /missing|insufficient permissions|permission-denied/i.test(msg);
      } catch(e){ return false; }
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>\"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":"&#39;"}[m]));
    }

    function getProfileShareUrl(emailArg){
      return `https://darkpurpleofswebsite.netlify.app/users/profile/${encodeURIComponent(emailArg)}`;
    }

    function getProfileShareText(nameArg, emailArg){
      const displayName = String(nameArg || '').trim();
      const profileName = displayName || (emailArg || t('pageTitle').toLowerCase());
      const url = getProfileShareUrl(emailArg);
      return t('shareProfileText', { name: profileName, url });
    }

    function ensureShareDialog(){
      if (document.getElementById('shareDialogBackdrop')) return document.getElementById('shareDialogBackdrop');
      const backdrop = document.createElement('div');
      backdrop.id = 'shareDialogBackdrop';
      backdrop.className = 'share-dialog-backdrop';
      backdrop.innerHTML = `
        <div class="share-dialog" role="dialog" aria-modal="true" aria-labelledby="shareDialogTitle">
          <h3 id="shareDialogTitle">${t('shareDialogTitle')}</h3>
          <p>${t('shareDialogText')}</p>
          <input id="shareDialogInput" type="text" readonly />
          <div class="share-dialog-actions">
            <button id="shareDialogCopyBtn" class="primary" type="button">${t('copyLink')}</button>
            <button id="shareDialogCloseBtn" type="button">${t('close')}</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);
      backdrop.querySelector('#shareDialogCopyBtn').addEventListener('click', async () => {
        const input = backdrop.querySelector('#shareDialogInput');
        const text = input.value;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            showToast(t('linkCopied'), 'purple');
          } else {
            input.select();
            document.execCommand('copy');
            showToast(t('linkCopied'), 'purple');
          }
        } catch (err) {
          console.warn('Copy failed', err);
          showToast(t('copyFailed'), 'red');
        }
      });
      backdrop.querySelector('#shareDialogCloseBtn').addEventListener('click', () => {
        backdrop.classList.remove('open');
      });
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) backdrop.classList.remove('open');
      });
      return backdrop;
    }

    function showShareDialog(url){
      const backdrop = ensureShareDialog();
      const input = backdrop.querySelector('#shareDialogInput');
      input.value = url;
      backdrop.classList.add('open');
    }

    function maybeShowBlockedProfileWarning(){
      if (hasShownBlockedProfileWarning || !currentUser || !viewedEmail || currentUser.email === viewedEmail) return;
      if (!relationshipState.isBlockedByCurrent) return;

      hasShownBlockedProfileWarning = true;
      const profileName = (viewedData && viewedData.displayName) ? viewedData.displayName : viewedEmail;
      if (window.DPDiag && typeof window.DPDiag.alert === 'function') {
        window.DPDiag.alert({
          title: t('blockedProfileWarningTitle'),
          text: t('blockedProfileWarningText', { name: profileName }),
          okText: t('okay'),
          closeOnBackdrop: true,
          closeOnEscape: true,
        }).catch(() => {});
      } else {
        showToast(`You have blocked ${profileName}.`, 'yellow', 5000);
      }
    }

    async function shareProfile(){
      if (!viewedEmail) return;
      const name = viewedData && viewedData.displayName ? viewedData.displayName : viewedEmail;
      const url = getProfileShareUrl(viewedEmail);
      const shareText = getProfileShareText(name, viewedEmail);
      try {
        if (navigator.share && navigator.canShare && navigator.canShare({ title: 'Profile', text: shareText, url })) {
          await navigator.share({ title: `${name}'s profile`, text: shareText, url });
          showToast(t('profileShared'), 'purple');
          return;
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
      showShareDialog(url);
    }

    function postTimestampMillis(value){
      if (value && typeof value.toMillis === 'function') return value.toMillis();
      if (value && typeof value.seconds === 'number') return value.seconds * 1000;
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric : 0;
    }

    function formatPostDate(value){
      const millis = postTimestampMillis(value);
      if (!millis) return '';
      return new Date(millis).toLocaleString(currentLang || undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit'
      });
    }

    function fieldContainsEmail(field, email){
      if (Array.isArray(field)) return field.includes(email);
      return typeof field === 'string' && field.includes(email);
    }

    function postsForFilter(filter, email){
      return profilePosts.filter(post => {
        const editor = String(post.editor || post.author || '');
        if (filter === 'wall') return fieldContainsEmail(post.towall, email);
        if (filter === 'pinned') return editor === email && post.pinnedByOwner === true;
        if (filter === 'reposted') return editor !== email && fieldContainsEmail(post.repostedBy, email);
        return editor === email;
      });
    }

    async function getPostAuthorData(email){
      if (!email || !db) return {};
      try {
        const snap = await db.collection('user_data').doc(email).get();
        return snap.exists ? snap.data() || {} : {};
      } catch (err) {
        console.warn('Failed to load post author data', err);
        return {};
      }
    }

    async function renderProfilePosts(){
      if (!profilePostsEl) return;
      const requestId = ++profilePostsRequestId;
      const filteredPosts = postsForFilter(profilePostsFilter, profilePostsEmail);
      const authorData = {};
      await Promise.all(filteredPosts.map(async post => {
        const editor = String(post.editor || post.author || '');
        if (!authorData[editor]) authorData[editor] = await getPostAuthorData(editor);
      }));
      if (requestId !== profilePostsRequestId) return;

      profilePostsEl.innerHTML = '';
      if (profilePostCountEl) {
        profilePostCountEl.textContent = postCountLabel(filteredPosts.length);
      }
      if (!filteredPosts.length) {
        const empty = document.createElement('div');
        empty.className = 'profile-post-empty';
        empty.textContent = t('noPostsFound');
        profilePostsEl.appendChild(empty);
        return;
      }

      filteredPosts.forEach(post => {
        const editor = String(post.editor || post.author || '');
        const data = authorData[editor] || {};
        const card = document.createElement('article');
        card.className = 'profile-post-card';
        card.tabIndex = 0;

        const head = document.createElement('div');
        head.className = 'profile-post-head';
        const author = document.createElement('div');
        author.className = 'profile-post-author';
        author.textContent = data['display name'] || editor || t('unknownUser');
        if (data.is_verified) {
          const badge = document.createElement('span');
          badge.className = 'verified';
          badge.title = t('verified');
          author.appendChild(badge);
        }
        const date = document.createElement('time');
        date.className = 'profile-post-date';
        const dateMillis = postTimestampMillis(post.timestamp);
        if (dateMillis) date.dateTime = new Date(dateMillis).toISOString();
        date.textContent = formatPostDate(post.timestamp) || t('unknownDate');
        head.appendChild(author);
        head.appendChild(date);
        card.appendChild(head);

        const text = document.createElement('div');
        text.className = 'profile-post-text';
        text.textContent = String(post.text || '');
        card.appendChild(text);

        const images = Array.isArray(post.images) ? post.images : [];
        if (images.length) {
          const imageWrap = document.createElement('div');
          imageWrap.className = 'profile-post-image-wrap';
          const image = document.createElement('img');
          image.className = 'profile-post-image';
          image.src = images[0];
          image.alt = '';
          image.loading = 'lazy';
          imageWrap.appendChild(image);
          if (images.length > 1) {
            const more = document.createElement('div');
            more.className = 'profile-post-image-dim';
            more.textContent = `+${images.length - 1}`;
            imageWrap.appendChild(more);
          }
          card.appendChild(imageWrap);
        }

        const openPost = () => { window.location.href = `/posts?post=${encodeURIComponent(post.id)}`; };
        card.addEventListener('click', openPost);
        card.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openPost();
          }
        });
        profilePostsEl.appendChild(card);
      });
    }

    async function loadProfilePosts(email){
      if (!profilePostsEl || !db || !email) return;
      profilePostsEmail = email;
      profilePosts = [];
      profilePostsEl.innerHTML = `<div class="profile-post-empty">${t('loadingPosts')}</div>`;
      try {
        const snap = await db.collection('posts').get();
        profilePosts = snap.docs
          .map(doc => ({ id: doc.id, ...doc.data() }))
          .sort((left, right) => postTimestampMillis(right.timestamp) - postTimestampMillis(left.timestamp));
        await renderProfilePosts();
      } catch (err) {
        console.error('Failed to load profile posts:', err);
        profilePostsEl.innerHTML = `<div class="profile-post-empty">${t('loadingPostsLater')}</div>`;
        if (profilePostCountEl) profilePostCountEl.textContent = '';
      }
    }

    function renderRoleList(roleArr){
      rolesList.innerHTML = '';
      (roleArr || ['Member']).forEach(r => {
        const el = document.createElement('div');
        el.className = 'role-item muted';
        if (roleMap[r]){
          const img = document.createElement('img');
          img.src = roleMap[r].icon;
          img.alt = r;
          img.title = `${r} — ${t(roleMap[r].descKey || '')}`;
          el.appendChild(img);
          const wrap = document.createElement('div');
          const txt = document.createElement('strong');
          txt.textContent = r;
          const desc = document.createElement('div');
          desc.className = 'subtle';
          desc.textContent = t(roleMap[r].descKey || '');
          wrap.appendChild(txt);
          wrap.appendChild(desc);
          el.appendChild(wrap);
        } else {
          const txt = document.createElement('strong');
          txt.textContent = r;
          el.appendChild(txt);
        }
        rolesList.appendChild(el);
      });
    }

    function renderProfileFallbackFields(emailArg, reason){
      console.warn('Rendering fallback profile fields for', emailArg, 'reason:', reason);
      const fb = fallbackProfile(emailArg);
      viewedData = fb;
      isFallbackProfile = true;

      bannerEl.style.backgroundImage = `url(${fb.banner})`;
      profilePicEl.style.backgroundImage = `url(${fb.profile_picture})`;
      displayNameEl.textContent = fb.displayName;
      emailEl.textContent = fb.email;
      bioTextEl.innerHTML = '';
      const richEl = document.createElement('rich-text');
      richEl.textContent = fb.bio;
      bioTextEl.appendChild(richEl);
      verifiedEl.style.display = fb.is_verified ? 'inline-block' : 'none';
      pfpFrameEl.style.display = 'none';
      renderRoleList(fb.roles);
      showToast(t('userNotFound'), 'yellow', 4500);
    }

    function handleFirestoreError(err, emailArg, key){
      console.error('Firestore listener error for', key, err);
      if (isFirestorePermissionError(err)){
        permissionDeniedFor[key] = true;
        if (key === 'viewedUser') {
          renderProfileFallbackFields(emailArg || viewedEmail, err && err.message ? err.message : 'permission error');
        } else {
          if (key === 'followers') followersCountEl.textContent = '—';
          if (key === 'following') followingCountEl.textContent = '—';
          if (key === 'friends') friendsCountEl.textContent = '—';
          if (key === 'friendDocs' || key === 'friendExists') relationshipState.friendExists = false;
        }
        renderInteractionButtons();
      } else {
        showToast(t('dataLoadingError'), 'red');
      }
    }

    function isActionDisabled(reason){
      if (reason === 'follow') return !!(permissionDeniedFor.followers || permissionDeniedFor.following || permissionDeniedFor.followDoc);
      if (reason === 'friend') return !!(permissionDeniedFor.friends || permissionDeniedFor.friendDocs || permissionDeniedFor.requests);
      if (reason === 'post') return !!(permissionDeniedFor.posts || permissionDeniedFor.viewedUser);
      return false;
    }

    function setupListenersForViewedEmail(emailArg){
      if (!emailArg) return;

      const fallback = fallbackProfile(emailArg);
      interactionArea.style.display = (currentUser && currentUser.email === emailArg) ? 'none' : 'flex';
      loadProfilePosts(emailArg);

      const viewedUserDocRef = db.collection('user_data').doc(docIdFromEmail(emailArg));
      const unsubViewedUser = viewedUserDocRef.onSnapshot(snap => {
        const data = snap.exists ? snap.data() : null;
        viewedData = {
          displayName: data && (data['display name'] || data.displayName || data.display_name) ? (data['display name'] || data.displayName || data.display_name) : fallback.displayName,
          email: emailArg,
          profile_picture: data && data.profile_picture ? data.profile_picture : (data && data.profile_picture_url ? data.profile_picture_url : fallback.profile_picture),
          banner: data && data.banner ? data.banner : (data && data.banner_url ? data.banner_url : fallback.banner),
          roles: data && (Array.isArray(data.roles) ? data.roles : (data.role ? [data.role] : fallback.roles)),
          bio: data && data.bio ? data.bio : fallback.bio,
          is_verified: data && data.is_verified ? !!data.is_verified : false,
          profile_picture_frame: data && data.profile_picture_frame ? data.profile_picture_frame : ''
        };

        bannerEl.style.backgroundImage = `url(${viewedData.banner})`;
        profilePicEl.style.backgroundImage = `url(${viewedData.profile_picture})`;
        displayNameEl.textContent = viewedData.displayName || fallback.displayName;
        emailEl.textContent = viewedData.email;
        bioTextEl.innerHTML = '';
        const richEl = document.createElement('rich-text');
        richEl.textContent = viewedData.bio;
        bioTextEl.appendChild(richEl);
        verifiedEl.style.display = viewedData.is_verified ? 'inline-block' : 'none';
        if (viewedData.profile_picture_frame) {
          pfpFrameEl.style.backgroundImage = `url(${viewedData.profile_picture_frame})`;
          pfpFrameEl.style.display = 'block';
        } else {
          pfpFrameEl.style.display = 'none';
        }

        renderRoleList(viewedData.roles);

        createAuthorUGCList("#ugc-list", {
          authorEmail: emailArg,
          firestore: firebase.firestore(),
          auth: firebase.auth()
        });

        if (permissionDeniedFor.viewedUser) delete permissionDeniedFor.viewedUser;
        renderInteractionButtons();
      }, err => {
        handleFirestoreError(err, emailArg, 'viewedUser');
      });
      unsubscribes.push(unsubViewedUser);

      const followersColRef = db.collection('followers').doc(docIdFromEmail(emailArg)).collection('usersWhoFollowMe');
      const unsubFollowers = followersColRef.onSnapshot(snap => {
        followersCountEl.textContent = `${snap.size || 0}`;
        if (permissionDeniedFor.followers) delete permissionDeniedFor.followers;
      }, err => { handleFirestoreError(err, emailArg, 'followers'); followersCountEl.textContent = '0'; });
      unsubscribes.push(unsubFollowers);

      const followingColRef = db.collection('following').doc(docIdFromEmail(emailArg)).collection('usersIFollow');
      const unsubFollowing = followingColRef.onSnapshot(snap => {
        followingCountEl.textContent = `${snap.size || 0}`;
        if (permissionDeniedFor.following) delete permissionDeniedFor.following;
      }, err => { handleFirestoreError(err, emailArg, 'following'); followingCountEl.textContent = '0'; });
      unsubscribes.push(unsubFollowing);

      const friendsColRef = db.collection('friends').doc(docIdFromEmail(emailArg)).collection('friendlist');
      const unsubFriends = friendsColRef.onSnapshot(snap => {
        friendsCountEl.textContent = `${snap.size || 0}`;
        if (permissionDeniedFor.friends) delete permissionDeniedFor.friends;
      }, err => { handleFirestoreError(err, emailArg, 'friends'); friendsCountEl.textContent = '0'; });
      unsubscribes.push(unsubFriends);

      if (currentUser) {
        const currentUserRef = db.collection('user_data').doc(docIdFromEmail(currentUser.email));
        const unsubCurrentUser = currentUserRef.onSnapshot(snap => {
          const data = snap.exists ? snap.data() : {};
          relationshipState.isBlockedByCurrent = Array.isArray(data.blockedUsers) && data.blockedUsers.includes(emailArg);
          if (currentUser.email === emailArg) interactionArea.style.display = 'none';
          if (permissionDeniedFor.currentUser) delete permissionDeniedFor.currentUser;
          if (relationshipState.isBlockedByCurrent) {
            maybeShowBlockedProfileWarning();
          }
          renderInteractionButtons();
        }, err => { handleFirestoreError(err, emailArg, 'currentUser'); });
        unsubscribes.push(unsubCurrentUser);
      }

      const otherUserRef = db.collection('user_data').doc(docIdFromEmail(emailArg));
      const unsubOtherUser = otherUserRef.onSnapshot(snap => {
        const data = snap.exists ? snap.data() : {};
        relationshipState.hasBlockedCurrent = Array.isArray(data.blockedUsers) && currentUser ? data.blockedUsers.includes(currentUser.email) : false;
        if (permissionDeniedFor.otherUser) delete permissionDeniedFor.otherUser;
        renderInteractionButtons();
      }, err => { handleFirestoreError(err, emailArg, 'otherUser'); });
      unsubscribes.push(unsubOtherUser);

      if (currentUser) {
        const currentEmail = currentUser.email;
        const otherEmail = emailArg;

        const followDocRef = db.collection('following').doc(currentEmail).collection('usersIFollow').doc(otherEmail);
        const unsubFollowDoc = followDocRef.onSnapshot(snap => {
          relationshipState.isFollowing = snap.exists;
          if (permissionDeniedFor.followDoc) delete permissionDeniedFor.followDoc;
          renderInteractionButtons();
        }, err => { handleFirestoreError(err, emailArg, 'followDoc'); });
        unsubscribes.push(unsubFollowDoc);

        const followedByDocRef = db.collection('followers').doc(currentEmail).collection('usersWhoFollowMe').doc(otherEmail);
        const unsubFollowedByDoc = followedByDocRef.onSnapshot(snap => {
          relationshipState.isFollowedBy = snap.exists;
          if (permissionDeniedFor.followedByDoc) delete permissionDeniedFor.followedByDoc;
          renderInteractionButtons();
        }, err => { handleFirestoreError(err, emailArg, 'followedByDoc'); });
        unsubscribes.push(unsubFollowedByDoc);

        const friendARef = db.collection('friends').doc(currentEmail).collection('friendlist').doc(otherEmail);
        const unsubFriendA = friendARef.onSnapshot(snap => {
          renderInteractionButtons();
        }, err => { handleFirestoreError(err, emailArg, 'friendA'); });
        unsubscribes.push(unsubFriendA);

        const friendBRef = db.collection('friends').doc(otherEmail).collection('friendlist').doc(currentEmail);
        const unsubFriendB = friendBRef.onSnapshot(async snap => {
          try {
            const aSnap = await db.collection('friends').doc(currentEmail).collection('friendlist').doc(otherEmail).get();
            const bSnap = await db.collection('friends').doc(otherEmail).collection('friendlist').doc(currentEmail).get();
            relationshipState.friendExists = aSnap.exists && bSnap.exists;
            if (permissionDeniedFor.friendDocs) delete permissionDeniedFor.friendDocs;
          } catch(e) {
            if (isFirestorePermissionError(e)) {
              permissionDeniedFor.friendDocs = true;
              relationshipState.friendExists = false;
              handleFirestoreError(e, emailArg, 'friendDocs');
            } else {
              console.error('friend exists check failed', e);
              relationshipState.friendExists = false;
            }
          }
          renderInteractionButtons();
        }, err => { handleFirestoreError(err, emailArg, 'friendDocs'); });
        unsubscribes.push(unsubFriendB);

        const requestSentRef = db.collection('friends').doc(otherEmail).collection('requests').doc(currentEmail);
        const unsubRequestSent = requestSentRef.onSnapshot(snap => {
          relationshipState.requestSent = snap.exists;
          if (permissionDeniedFor.requests) delete permissionDeniedFor.requests;
          renderInteractionButtons();
        }, err => { handleFirestoreError(err, emailArg, 'requests'); });
        unsubscribes.push(unsubRequestSent);

        const requestReceivedRef = db.collection('friends').doc(currentEmail).collection('requests').doc(otherEmail);
        const unsubRequestReceived = requestReceivedRef.onSnapshot(snap => {
          relationshipState.requestReceived = snap.exists;
          if (permissionDeniedFor.requestReceived) delete permissionDeniedFor.requestReceived;
          renderInteractionButtons();
        }, err => { handleFirestoreError(err, emailArg, 'requestReceived'); });
        unsubscribes.push(unsubRequestReceived);
      }

      renderInteractionButtons();
    }

    function renderInteractionButtons(){
      renderOwnerQuickActions();
      if (currentUser && viewedEmail && currentUser.email === viewedEmail) {
        interactionArea.style.display = 'none';
        return;
      }
      interactionArea.style.display = 'flex';

      if (!currentUser) {
        interactionButtons.innerHTML = '';
        moreMenuEl.innerHTML = '';
        moreMenuEl.classList.remove('open');
        moreBtnEl.setAttribute('aria-expanded', 'false');
        moreBtnEl.disabled = true;
        moreBtnEl.title = t('signInViewMore');
        moreBtnEl.style.opacity = '0.6';
        moreBtnEl.style.filter = 'grayscale(0.7)';
        moreBtnEl.style.cursor = 'not-allowed';
        shareBtnEl.disabled = true;
        shareBtnEl.title = t('signInShare');
        shareBtnEl.style.opacity = '0.6';
        shareBtnEl.style.filter = 'grayscale(0.7)';
        shareBtnEl.style.cursor = 'not-allowed';

        const guestHint = disableGuestActionButton(
          makeActionBtn({ icon: ICONS.post, text: t('signInInteract'), className: 'action-btn secondary' }),
          t('signInUseActions')
        );
        interactionButtons.appendChild(guestHint);
        return;
      }

      shareBtnEl.disabled = false;
      shareBtnEl.title = t('shareProfile');
      shareBtnEl.style.opacity = '';
      shareBtnEl.style.filter = '';
      shareBtnEl.style.cursor = '';
      moreBtnEl.disabled = false;
      moreBtnEl.title = t('moreOptions');
      moreBtnEl.style.opacity = '';
      moreBtnEl.style.filter = '';
      moreBtnEl.style.cursor = '';
      interactionButtons.innerHTML = '';
      moreMenuEl.innerHTML = '';
      moreMenuEl.classList.remove('open');
      moreBtnEl.setAttribute('aria-expanded', 'false');

      const nameForButtons = (viewedData && viewedData.displayName) ? viewedData.displayName : viewedEmail;
      const otherEmailEsc = encodeURIComponent(viewedEmail);

      const shareMenuBtn = makeActionBtn({ icon: ICONS.share, text: t('shareProfile'), className: 'action-btn secondary' });
      shareMenuBtn.addEventListener('click', () => {
        shareProfile();
        moreMenuEl.classList.remove('open');
        moreBtnEl.setAttribute('aria-expanded', 'false');
      });
      if (mobileMediaQuery.matches) {
        moreMenuEl.appendChild(shareMenuBtn);
      }

      const postBtn = makeActionBtn({ icon: ICONS.post, text: t('filterWall'), className: 'action-btn secondary' });
      if (relationshipState.isBlockedByCurrent) {
        postBtn.disabled = true;
        postBtn.title = t('userDoesNotExist');
        postBtn.style.opacity = 0.6;
      } else {
        postBtn.addEventListener('click', () => { window.location.href = `/createpost?wall=${otherEmailEsc}`; });
      }
      moreMenuEl.appendChild(postBtn);

      const giftBtn = makeActionBtn({ icon: ICONS.gift, text: t('sendGift'), className: 'action-btn secondary' });
      giftBtn.title = `${t('sendGift')} ${nameForButtons}`;
      if (relationshipState.isBlockedByCurrent) {
        giftBtn.disabled = true;
        giftBtn.title = 'User does not exist';
        giftBtn.style.opacity = 0.6;
      } else if (!window.SendGiftSheet) {
        giftBtn.disabled = true;
        giftBtn.title = t('giftUnavailable');
        giftBtn.style.opacity = 0.5;
      } else {
        giftBtn.addEventListener("click", () => {
          if (!window.SendGiftSheet) {
            showToast(t('giftUnavailable'), "red");
            return;
          }

          window.SendGiftSheet.open({
              email: viewedEmail,
              username: viewedData.displayName
            });
        });
      }
      moreMenuEl.appendChild(giftBtn);

      const chatBtn = makeActionBtn({ icon: ICONS.chat, text: t('chat'), className: 'action-btn secondary' });
      chatBtn.title = `${t('chat')} ${nameForButtons}`;
      if (relationshipState.isBlockedByCurrent) {
        chatBtn.disabled = true;
        chatBtn.title = 'User does not exist';
        chatBtn.style.opacity = 0.6;
      } else {
        chatBtn.addEventListener('click', () => { window.location.href = `/chat?email=${otherEmailEsc}`; });
      }
      moreMenuEl.appendChild(chatBtn);

      const followBtn = document.createElement('button');
      followBtn.className = 'action-btn secondary';
      followBtn.id = 'followBtn';
      followBtn.title = relationshipState.isFollowing ? `${t('unfollow')} ${nameForButtons}` : `${t('follow')} ${nameForButtons}`;
      followBtn.innerHTML = `${relationshipState.isFollowing ? ICONS.unfollow : ICONS.follow}<span>${relationshipState.isFollowing ? t('unfollow') : t('follow')}</span>`;

      if (relationshipState.isBlockedByCurrent) {
        followBtn.disabled = true;
        followBtn.title = t('blockedUnfollow');
        followBtn.style.opacity = 0.6;
      } else if (isFallbackProfile) {
        followBtn.disabled = true;
        followBtn.title = t('unavailableBecauseUserNotFound');
        followBtn.style.opacity = 0.6;
      } else {
        followBtn.addEventListener('click', async () => {
          followBtn.disabled = true;
          try {
            if (relationshipState.isFollowing) {
              await db.collection('followers').doc(viewedEmail).collection('usersWhoFollowMe').doc(currentUser.email).delete().catch(()=>{});
              await db.collection('following').doc(currentUser.email).collection('usersIFollow').doc(viewedEmail).delete().catch(()=>{});
              showToast(t('unfollowed'), 'purple');
            } else {
              await db.collection('followers').doc(viewedEmail).collection('usersWhoFollowMe').doc(currentUser.email).set({ email: currentUser.email, created: firebase.firestore.FieldValue.serverTimestamp() });
              await db.collection('following').doc(currentUser.email).collection('usersIFollow').doc(viewedEmail).set({ email: viewedEmail, created: firebase.firestore.FieldValue.serverTimestamp() });
              showToast(t('followed'), 'purple');
            }
          } catch (err) {
            console.error('follow/unfollow', err);
            if (isFirestorePermissionError(err)) handleFirestoreError(err, viewedEmail, 'followAction');
            else showToast(t('actionFailed'), 'red');
          } finally {
            followBtn.disabled = false;
          }
        });
      }
      moreMenuEl.appendChild(followBtn);

      const friendBtn = document.createElement('button');
      friendBtn.className = 'action-btn secondary';
      friendBtn.id = 'friendBtn';

      if (relationshipState.friendExists) {
        friendBtn.className = 'action-btn friend-remove';
        friendBtn.innerHTML = `${ICONS.friendRemove}<span>${t('removeFriend')}</span>`;
        if (isActionDisabled('friend')) {
          friendBtn.disabled = true;
          friendBtn.title = t('userDoesNotExist');
          friendBtn.style.opacity = 0.6;
        } else {
          friendBtn.addEventListener('click', async () => {
            const confirmed = await DPDiag.confirm({ title: t('removeFriend'), text: `${t('removeFriend')} ${nameForButtons}?` });
            if (!confirmed) return;
            try {
              await db.collection('friends').doc(currentUser.email).collection('friendlist').doc(viewedEmail).delete().catch(()=>{});
              await db.collection('friends').doc(viewedEmail).collection('friendlist').doc(currentUser.email).delete().catch(()=>{});
              showToast(t('friendRemoved'), 'purple');
            } catch (err) {
              console.error('remove friend', err);
              if (isFirestorePermissionError(err)) handleFirestoreError(err, viewedEmail, 'friendAction');
              else showToast(t('failed'), 'red');
            }
          });
        }
      } else if (relationshipState.requestReceived) {
        friendBtn.className = 'action-btn primary';
        friendBtn.innerHTML = `${ICONS.friendAccept}<span>${t('acceptFriendRequest')}</span>`;
        if (isActionDisabled('friend')) {
          friendBtn.disabled = true;
          friendBtn.title = t('userDoesNotExist');
          friendBtn.style.opacity = 0.6;
        } else {
          friendBtn.addEventListener('click', async () => {
            try {
              await db.collection('friends').doc(currentUser.email).collection('requests').doc(viewedEmail).delete().catch(()=>{});
              await db.collection('friends').doc(currentUser.email).collection('friendlist').doc(viewedEmail).set({ email: viewedEmail, created: firebase.firestore.FieldValue.serverTimestamp() });
              await db.collection('friends').doc(viewedEmail).collection('friendlist').doc(currentUser.email).set({ email: currentUser.email, created: firebase.firestore.FieldValue.serverTimestamp() });
              showToast(t('friendRequestAccepted'), 'purple');
            } catch (err) {
              console.error('accept friend', err);
              if (isFirestorePermissionError(err)) handleFirestoreError(err, viewedEmail, 'friendAction');
              else showToast(t('failed'), 'red');
            }
          });
        }
      } else if (relationshipState.requestSent) {
        friendBtn.innerHTML = `${ICONS.friendPending}<span>${t('requestPending')}</span>`;
        friendBtn.disabled = true;
        friendBtn.title = t('alreadySentFriendRequest');
      } else {
        friendBtn.className = 'action-btn primary';
        friendBtn.innerHTML = `${ICONS.friendAdd}<span>${t('addFriend')}</span>`;
        if (relationshipState.isBlockedByCurrent) {
          friendBtn.disabled = true;
          friendBtn.title = t('blockedSendRequest');
          friendBtn.style.opacity = 0.6;
        } else if (isActionDisabled('friend')) {
          friendBtn.disabled = true;
          friendBtn.title = t('userDoesNotExist');
          friendBtn.style.opacity = 0.6;
        } else {
          friendBtn.addEventListener('click', async () => {
            try {
              const friendExistsDoc = await db.collection('friends').doc(viewedEmail).collection('friendlist').doc(currentUser.email).get();
              if (friendExistsDoc.exists) { showToast(t('youAreAlreadyFriends'), 'yellow'); return; }
              const alreadySent = await db.collection('friends').doc(viewedEmail).collection('requests').doc(currentUser.email).get();
              if (alreadySent.exists) { showToast(t('requestAlreadyPending'), 'yellow'); return; }
              await db.collection('friends').doc(viewedEmail).collection('requests').doc(currentUser.email).set({ from: currentUser.email, to: viewedEmail, created: firebase.firestore.FieldValue.serverTimestamp() });
              showToast(t('friendRequestSent'), 'purple');
            } catch (err) {
              console.error('send request', err);
              if (isFirestorePermissionError(err)) handleFirestoreError(err, viewedEmail, 'friendAction');
              else showToast(t('failed'), 'red');
            }
          });
        }
      }
      interactionButtons.appendChild(friendBtn);

      const blockBtn = makeActionBtn({
        icon: ICONS.block,
        text: relationshipState.isBlockedByCurrent ? `Unblock ${nameForButtons}` : `Block ${nameForButtons}`,
        className: 'action-btn red'
      });
      blockBtn.id = 'blockBtn';
      blockBtn.addEventListener('click', async () => {
        try {
          if (!relationshipState.isBlockedByCurrent) {
            const confirmed = await DPDiag.confirm({ title: `${t('block')} ${nameForButtons}?`, text: `${t('blockedUnfollow')} ${nameForButtons}.` });
            if (!confirmed) return;
            await db.collection('user_data').doc(currentUser.email).set({ blockedUsers: firebase.firestore.FieldValue.arrayUnion(viewedEmail) }, { merge: true });
            const ops = [
              db.collection('followers').doc(currentUser.email).collection('usersWhoFollowMe').doc(viewedEmail).delete().catch(()=>{}),
              db.collection('following').doc(currentUser.email).collection('usersIFollow').doc(viewedEmail).delete().catch(()=>{}),
              db.collection('friends').doc(currentUser.email).collection('friendlist').doc(viewedEmail).delete().catch(()=>{}),
              db.collection('friends').doc(viewedEmail).collection('friendlist').doc(currentUser.email).delete().catch(()=>{}),
              db.collection('friends').doc(currentUser.email).collection('requests').doc(viewedEmail).delete().catch(()=>{}),
              db.collection('friends').doc(viewedEmail).collection('requests').doc(currentUser.email).delete().catch(()=>{})
            ];
            await Promise.all(ops);
            showToast(t('userBlocked'), 'purple');
          } else {
            await db.collection('user_data').doc(currentUser.email).set({ blockedUsers: firebase.firestore.FieldValue.arrayRemove(viewedEmail) }, { merge: true });
            showToast(t('userUnblocked'), 'purple');
          }
        } catch (err) {
          console.error('block/unblock', err);
          if (isFirestorePermissionError(err)) showToast(t('blockedPermError'), 'red');
          else showToast('Failed', 'red');
        }
      });
      moreMenuEl.appendChild(blockBtn);

      const reportBtn = makeActionBtn({ icon: ICONS.report, text: `${t('report')} ${nameForButtons}`, className: 'action-btn red' });
      reportBtn.addEventListener('click', () => {
        window.location.href = `/reportabuse?email=${otherEmailEsc}`;
      });
      moreMenuEl.appendChild(reportBtn);

      if (relationshipState.hasBlockedCurrent) {
        [postBtn, chatBtn, followBtn, friendBtn].forEach(b => {
          if (b) {
            b.disabled = true;
            b.title = 'Action unavailable';
            b.style.opacity = 0.6;
          }
        });
      }
    }

    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-tab');
        tabBtns.forEach(b => { b.classList.toggle('active', b === btn); b.setAttribute('aria-selected', b === btn ? 'true' : 'false'); });
        tabPanels.forEach(p => p.classList.toggle('active', p.getAttribute('data-panel') === target));
      });
    });

    document.querySelectorAll('.post-filter').forEach(filterButton => {
      filterButton.addEventListener('click', () => {
        profilePostsFilter = filterButton.getAttribute('data-post-filter') || 'posts';
        document.querySelectorAll('.post-filter').forEach(button => {
          button.classList.toggle('active', button === filterButton);
        });
        renderProfilePosts();
      });
    });

    shareBtnEl.addEventListener('click', () => {
      shareProfile();
    });

    const mobileMediaQuery = window.matchMedia('(max-width: 560px)');
    function syncMobileHeaderActions(){
      if (!mobileMediaQuery.matches) {
        shareBtnEl.style.display = '';
        return;
      }
      shareBtnEl.style.display = 'none';
    }
    mobileMediaQuery.addEventListener('change', syncMobileHeaderActions);
    syncMobileHeaderActions();

    moreBtnEl.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = moreMenuEl.classList.toggle('open');
      moreBtnEl.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    document.addEventListener('click', (e) => {
      if (!moreMenuEl.classList.contains('open')) return;
      if (moreMenuEl.contains(e.target) || moreBtnEl.contains(e.target)) return;
      moreMenuEl.classList.remove('open');
      moreBtnEl.setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && moreMenuEl.classList.contains('open')) {
        moreMenuEl.classList.remove('open');
        moreBtnEl.setAttribute('aria-expanded', 'false');
      }
    });

    auth.onAuthStateChanged(async (u) => {
      currentUser = u || null;
      currentLang = await resolvePreferredLang(currentUser ? currentUser.email : null);
      applyStaticTranslations();
      const emailArg = getProfileParam();
      viewedEmail = emailArg || (currentUser ? currentUser.email : null);

      for (const k in permissionDeniedFor) delete permissionDeniedFor[k];
      clearUnsubscribes();
      setupListenersForViewedEmail(viewedEmail);
    });

    window.addEventListener('load', () => {
      const uploadEls = document.querySelectorAll('input[type=file], .upload-box, #saveNameBtn, #saveBioBtn');
      uploadEls.forEach(e => e?.remove?.());
      if (interactionArea) interactionArea.style.display = 'flex';
    });

    // Open imageviewer on profile picture or banner click
    bannerEl.style.cursor = 'pointer';
    bannerEl.addEventListener('click', async () => {
      const bgImage = bannerEl.style.backgroundImage || '';
      const urlMatch = bgImage.match(/url\(["']?([^"')]+)["']?\)/);
      const imageUrl = urlMatch ? urlMatch[1] : '';
      if (imageUrl && viewedEmail) {
        window.ImageViewer.open({ imageUrl, authorEmail: viewedEmail, advancedMode: true });
      }
    });

    profilePicEl.style.cursor = 'pointer';
    profilePicEl.addEventListener('click', async () => {
      const bgImage = profilePicEl.style.backgroundImage || '';
      const urlMatch = bgImage.match(/url\(["']?([^"')]+)["']?\)/);
      const imageUrl = urlMatch ? urlMatch[1] : '';
      if (imageUrl && viewedEmail) {
        window.ImageViewer.open({ imageUrl, authorEmail: viewedEmail, advancedMode: false });
      }
    });

    window.addEventListener('beforeunload', () => clearUnsubscribes());
  </script>
</body>
</html>
