<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;overflow-x:hidden;overflow-x:clip}   /* clip, not hidden: hidden turns body into a scroll container and breaks the sticky topbar */
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:inherit}
:root{--bg:#171717;--surface:#1f1f1f;--raised:#242424;--border:rgba(255,255,255,0.04);--line:rgba(255,255,255,0.09);--text:#eaeaea;--muted:#a8a8a8;--accent:#6b21a8;--accent-h:#5b21b6;--tint:#c4a1f2;--sb:env(safe-area-inset-bottom,0px)}
body.light{--bg:#f6f8fb;--surface:#fff;--raised:#fff;--border:rgba(0,0,0,0.06);--line:rgba(0,0,0,0.12);--text:#0f172a;--muted:#475569;--tint:#6b21a8}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14.5px;line-height:1.55;min-height:100vh;position:relative}
dp-topbar{display:block;position:sticky;top:0;z-index:100}
@media(max-width:340px),(max-height:320px){dp-topbar{position:static}}
html.small dp-topbar{position:static}
.page{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:28px 20px calc(64px + var(--sb));display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.02),0 12px 32px rgba(0,0,0,.18)}
body.light .card{box-shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.06)}
.card.top{border-top:2px solid var(--accent)}
.sec{padding:22px}
h1{font-size:32px;line-height:1.15;margin:6px 0 8px;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:600}
.muted{color:var(--muted)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow::before{content:"";width:8px;height:8px;background:var(--accent);display:inline-block}
.hero{display:flex;gap:26px;align-items:center;padding:32px 28px}
.logo{width:112px;height:112px;border-radius:14px;object-fit:cover;background:var(--raised);border:1px solid var(--line);flex:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hm{flex:1;min-width:0}
.lead{font-size:15.5px;color:var(--muted);max-width:52ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;min-height:24px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:4px;background:var(--raised);border:1px solid var(--line);color:var(--muted);text-decoration:none}
a.pill:hover{color:var(--text);border-color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:6px;border:1px solid rgba(128,128,128,.28);background:transparent;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--text);white-space:nowrap;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.btn:hover:not(.disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h);transform:translateY(-1px)}
.btn.lg{padding:13px 22px;font-size:15px}
.btn.disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,summary:focus-visible,.tip:focus-visible,a.pill:focus-visible{outline:2px solid var(--accent-h);outline-offset:2px}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--accent);color:#fff;margin-left:8px;vertical-align:2px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:16px;padding:18px;background:var(--raised);border:1px solid var(--line);border-radius:8px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px);z-index:2}
.tile.cur{border-color:var(--accent);background:var(--raised);background:color-mix(in srgb,var(--accent) 14%,var(--raised))}
.tile.off{opacity:.72}
.tile.off:hover{transform:none;border-color:var(--line)}
.th{display:flex;gap:12px;align-items:center}
.pi{width:44px;height:44px;border-radius:8px;background:rgba(107,33,168,.16);border:1px solid rgba(107,33,168,.32);display:flex;align-items:center;justify-content:center;flex:none;color:var(--tint)}
.pi svg{width:24px;height:24px}
.pn{flex:1;min-width:0}
.pn b{display:block;font-size:16px}
.pn .meta{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere;min-height:19px}
.pa{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.pa .btn{flex:1 1 auto;padding:10px 12px}
.pa .tip{flex:1 1 auto;display:flex}
.pa .tip .btn{flex:1}
.cmds{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:6px 16px 14px}
.cmds summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;padding:6px 0}
.cmds summary:hover{color:var(--text)}
.code{position:relative;margin-top:8px}
.code pre{margin:0;padding:14px 16px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow-x:auto;font:12.5px/1.65 ui-monospace,Menlo,Consolas,monospace}
.code pre{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.45) transparent}
.code pre::-webkit-scrollbar{height:8px}
.code pre::-webkit-scrollbar-track{background:transparent}
.code pre::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:4px;border:2px solid transparent;background-clip:content-box}
.code pre::-webkit-scrollbar-thumb:hover{background:var(--accent);background-clip:content-box}
.code .btn{position:absolute;top:8px;right:8px;padding:5px 10px;font-size:12px;background:var(--surface)}
.foot{text-align:center;font-size:12.5px;color:var(--muted)}
.foot a{text-decoration:underline}
.tip{position:relative;display:inline-block}
.tip .bubble{position:absolute;bottom:calc(100% + 8px);right:0;width:max-content;max-width:min(300px,78vw);padding:9px 12px;background:var(--raised);color:var(--text);border:1px solid rgba(128,128,128,.35);border-radius:6px;font-size:12.5px;font-weight:500;line-height:1.45;white-space:normal;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .12s;z-index:20}
.tip:hover .bubble,.tip:focus .bubble,.tip:focus-within .bubble{opacity:1}
.cta .tip{display:flex}
.cta .tip .btn{flex:1}
.cta .tip .bubble{left:0;right:auto}

.tabs-wrap{overflow-x:auto;margin-bottom:6px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tab{background:transparent;border:0;border-right:1px solid var(--line);padding:9px 18px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab:last-child{border-right:0}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{background:var(--accent);color:#fff}
.tab:focus-visible{outline:2px solid var(--accent-h);outline-offset:-2px}
.rq{display:grid;grid-template-columns:176px 1fr 1fr;gap:0 20px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.rq.head{border-top:0;padding:14px 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.rq .k{display:flex;align-items:flex-start;gap:10px;color:var(--muted)}
.ki{flex:none;width:20px;height:20px;color:var(--tint)}
.ki svg{width:20px;height:20px;display:block}
.rq .span{grid-column:2 / span 2}
.vg{display:grid;gap:7px;overflow-wrap:anywhere}
.vi{display:flex;gap:9px;align-items:flex-start}
.ck{flex:none;width:18px;height:18px;margin-top:1px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--tint);border:1px solid rgba(107,33,168,.5)}
.ck svg{width:12px;height:12px;stroke-width:3.2}
.ck.rec{background:var(--accent);border-color:var(--accent);color:#fff}
.ck.info{border-color:var(--line);color:var(--muted)}
.ck.info svg{width:14px;height:14px;stroke-width:2.2}
.ck.low{border-color:#c0392b;color:#e8574a}
.hc{display:flex;align-items:center;gap:8px}
.dev{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:11px 14px;margin:14px 0 4px;border:1px solid var(--line);border-radius:6px;background:var(--raised);font-size:13px}
.dev b{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.dev .vi{align-items:center}
.dev small{color:var(--muted);font-size:12px;flex-basis:100%}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--raised);border:1px solid var(--line);border-radius:6px}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:4px;background:var(--accent);color:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.hrow{padding:9px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hrow b{display:block;font-size:13px}
.hash{display:block;font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);word-break:break-all;margin-top:2px}
.dev{border-left:3px solid var(--accent)}
.warn{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:14px 16px;background:var(--raised);border:1px solid var(--line);border-left:3px solid #c0392b;border-radius:6px}
.warn p{margin:0}
.warn p+p{margin-top:6px;color:var(--muted)}
body.unsup .cmds,body.unsup #verify{opacity:.5;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{animation:rise .45s ease both}
.page>:nth-child(2){animation-delay:.07s}
.page>:nth-child(3){animation-delay:.14s}
#plats:not(.done) .tile{animation:rise .45s ease both}
#plats:not(.done) .tile:nth-child(2){animation-delay:.08s}
#plats:not(.done) .tile:nth-child(3){animation-delay:.16s}
#plats:not(.done) .tile:nth-child(4){animation-delay:.24s}
#plats:not(.done) .tile:nth-child(5){animation-delay:.32s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:620px){
.page{padding:16px 0 calc(48px + var(--sb));gap:12px}
.card{border-radius:0;border-left:0;border-right:0}
.sec{padding:18px 16px}
.hero{flex-direction:column;align-items:flex-start;gap:16px;padding:22px 16px}
.logo{width:80px;height:80px}
h1{font-size:26px}
.cta .btn{flex:1}
.grid{grid-template-columns:1fr}
.foot{padding:0 16px}
.rq{grid-template-columns:1fr;gap:2px;padding:12px 0}
.rq.head{display:none}
.rq .span{grid-column:auto}
.vg[data-l]::before{content:attr(data-l);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.rq .k{margin-bottom:2px}

/* ---------- platform detection ---------- */
function detectOS(){
  const ua = navigator.userAgent || '';
  const p  = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  if (/android/i.test(ua)) return 'android';
  if (/iPhone|iPad|iPod/i.test(ua) || (/Mac/i.test(p) && navigator.maxTouchPoints > 1)) return 'ios';
  if (/Win/i.test(p) || /Windows/i.test(ua)) return 'windows';
  if (/Mac/i.test(p)) return 'mac';
  if (/Linux|X11|CrOS/i.test(ua + p)) return 'linux';
  return null;
}
function detectUnsupported(){
  const ua = navigator.userAgent || '';
  if (/Xbox/i.test(ua)) return 'xbox';                                        // Xbox UAs also claim Windows
  if (/PlayStation|PLAYSTATION|\bPS[345]\b/.test(ua)) return 'playstation';
  if (/Nintendo|NintendoBrowser/i.test(ua)) return 'nintendo';
  if (/MIDP|CLDC|J2ME|UNTRUSTED\/1\.0/i.test(ua)) return 'j2me';
  if (/Windows Phone|IEMobile|WPDesktop/i.test(ua)) return 'winphone';      // WP UAs also claim Android
  if (/BlackBerry|BB10|PlayBook|RIM Tablet/i.test(ua)) return 'blackberry';
  if (/KAIOS|JioPhone|Jio ?Phone/i.test(ua)) return 'jio';
  if (/\bSilk\/|Kindle|\bKF[A-Z]{2,6}\b|AmazonWebAppPlatform/i.test(ua)) return 'kindle';
  if (/android/i.test(ua) && /FBAN|FBAV|FB_IAB|FB4A|Orca-Android/i.test(ua)) return 'facebook';
  return null;
}
const UNSUP = detectUnsupported();   // 'kindle' | 'winphone' | 'blackberry' | 'jio' | 'facebook' | 'xbox' | 'playstation' | 'nintendo' | 'j2me' | null
if (/Nintendo 3DS|KAIOS|JioPhone|Jio ?Phone|Opera Mini|Nokia|Series ?40|MIDP|CLDC|J2ME/i.test(navigator.userAgent)) document.documentElement.classList.add('small');   // tiny screens: let the topbar scroll away

function reqRows(id){
  const gb  = n => n + ' GB';
  const free = n => t('free', {x: gb(n)});
  const one = (k, icon, v)        => ({k, icon, v});

  const note = text               => ({k:'rNotes', icon:'info', note:text});
  const ram   = two('rRAM',  'ram',  [gb(MEM[id][0])], [gb(MEM[id][1])]);
  const disk  = two('rDisk', 'disk', [free(DISK[0])],  [free(DISK[1])]);
  const store = two('rStore','disk', [t('hdd')], [t('ssd')]);
  const net   = one('rNet',  'net',  [t('netReq')]);
  const gpu   = two('rGPU',  'gpu',  [t('integrated')], [t('accel')]);
  const disp  = two('rDisplay','display', ['1280 × 720'], ['1920 × 1080']);
  const input = one('rInput','display', [t('inputReq')]);
  const cores = two('rCores','cpu', ['2 cores / 4 threads'], ['4+ cores / 8 threads']);
  const pcCpu = two('rCPU', 'cpu',
    ['Intel Core i3 12th Gen / 10th Gen', 'AMD Ryzen 5 5500'],
    ['Intel Core i5 9th Gen', 'AMD Ryzen 8+']);
  const arch64 = one('rArch','arch',['64-bit (x86_64)']);
  switch (id) {
    case 'windows': return [
      two('rOS','os',[t('orNewer',{x:'Windows 10 22H2 (build 19045)'})],[t('orNewer',{x:'Windows 11 23H2'})]),
      pcCpu, cores, ram, disk, store, gpu, disp, input, net, arch64];
    case 'mac': return [
      two('rOS','os',[t('orNewer',{x:'macOS 11 Big Sur (11.0)'})],[t('orNewer',{x:'macOS 14 Sonoma'})]),
      two('rCPU','cpu',['Apple M1'],['Apple M3']), ram, disk, store, gpu, disp, input, net,
      one('rArch','arch',['Apple Silicon (arm64)', 'Intel (x86_64)'])];
    case 'linux': return [
      two('rOS','os',
        [t('orNewer',{x:'Ubuntu 22.04 LTS'}), t('orNewer',{x:'Debian 12'}), 'Fedora (' + t('latest') + ')', t('anyFlatpak')],
        [t('orNewer',{x:'Ubuntu 24.04 LTS'}), t('orNewer',{x:'Debian 13'}), 'Fedora (' + t('latest') + ')', 'Red Hat Enterprise Linux (' + t('latest') + ')']),
      one('rSession','display',[t('sessionReq')]),
      pcCpu, cores, ram, disk, store, gpu, disp, input, net, one('rArch','arch',['x86_64']), note(t('linuxNote'))];
    case 'android': return [
      two('rOS','os',[t('orNewer',{x:'Android 8.0 Oreo (API 26)'})],[t('orNewer',{x:'Android 13 (API 33)'})]),
      ram, disk, one('rWeb','os',[t('webReq')]), one('rPerm','info',[t('permNotif'), t('permInstall')]), net];
    case 'ios': return [
      two('rOS','os',[t('orNewer',{x:'iOS 16'})],[t('orNewer',{x:'iOS 17'})]),

let reqTab = UNSUP ? 'unsup' : PLAT_IDS.includes(OS) ? OS : 'windows';

function deviceStrip(){
  if (reqTab !== OS) return '';
  const items = [];
  const st = c => t(c === 'rec' ? 'sRec' : c === '' ? 'sMin' : 'sLow');
  const row = (c, txt) => `<div class="vi">${ck(c)}<span>${esc(txt)}</span></div>`;
  const mem = navigator.deviceMemory;                      // Chromium only; rounded down, capped at 8
  if (mem) {
    const [min, rec] = MEM[reqTab];
    const label = mem >= 8 ? '8 GB+' : mem + ' GB';
    const [cls, key] = mem >= rec ? ['rec', 'devMeetsRec'] : mem >= min ? ['', 'devMeetsMin'] : ['low', 'devBelow'];
    items.push(row(cls, t(key, {mem: label})));
  }
  const th = navigator.hardwareConcurrency;
  if (th && CORES[reqTab]) {
    const [m, r] = CORES[reqTab];
    const c = th >= r ? 'rec' : th >= m ? '' : 'low';
    items.push(row(c, t('devCores', {n: th}) + ': ' + st(c)));
  }
  if (['windows','mac','linux'].includes(reqTab) && screen.width) {
    const k = devicePixelRatio || 1, w = Math.round(screen.width * k), h = Math.round(screen.height * k);
    const c = (w >= 1920 && h >= 1080) ? 'rec' : (w >= 1280 && h >= 720) ? '' : 'low';
    items.push(row(c, t('devScreen', {w, h}) + ': ' + st(c)));
  }
  if (!items.length) return '';
  return `<div class="dev"><b>${esc(t('detected'))}</b>${items.join('')}<small>${esc(t('devApprox'))}</small></div>`;
}

}

  };

}

/* point buttons at the real files once the latest release is known */
let release = null, androidRelease = null;
function applyAssets(){
  for (const [k, a] of Object.entries(found)) {
    document.querySelectorAll(`[data-key="${k}"]`).forEach(el => { el.href = a.browser_download_url; });
  }
  const cmd = $('#cmdText');
  if (cmd) cmd.textContent = linuxCmds();
  const mb = a => (a.size / 1048576).toFixed(0) + ' MB';
  for (const k of ['windows', 'android']) {
    const el = document.querySelector(`[data-meta="${k}"]`);
    if (el && found[k]) el.textContent = found[k].name + (found[k].size ? ' · ' + mb(found[k]) : '');
  }
  const info = $('#relInfo');
  if (release) {
    const v = String(release.tag_name || '').replace(/^v/i, '');
    const d = release.published_at ? new Date(release.published_at).toLocaleDateString(LOCALE, {year:'numeric', month:'short', day:'numeric'}) : '';
    info.innerHTML = `<span class="pill">${esc(t('version', {v}))}</span>` +
      (release.prerelease ? `<span class="pill">${esc(t('pre'))}</span>` : '') +
      (d ? `<span class="pill">${esc(t('released', {d}))}</span>` : '') +
      (androidRelease ? `<span class="pill">Android ${esc(String(androidRelease.tag_name || '').replace(/^v/i, ''))}</span>` : '') +
      `<a class="pill" href="${esc(release.html_url || RELEASES)}">${esc(t('notes'))} ↗</a>`;
  } else {
    info.innerHTML = OS || UNSUP ? '' : `<span class="muted">${esc(t('pickPlatform'))}</span>`;
  }
  const vf = $('#verify');
  const uniq = [...new Map(Object.values(found).filter(a => a.digest).map(a => [a.name, a])).values()];
  vf.innerHTML = uniq.length ? `<details class="cmds"><summary>${esc(t('verify'))}</summary>` +
    uniq.map(a => `<div class="hrow"><b>${esc(a.name)}</b><span class="hash">${esc(a.digest.replace(/^sha256:/, ''))}</span></div>`).join('') +
    `<div class="code"><pre><code>sha256sum &lt;file&gt;\ncertutil -hashfile &lt;file&gt; SHA256\nshasum -a 256 &lt;file&gt;</code></pre></div></details>` : '';
}

function pickAssets(assets){
  const f = k => assets.find(MATCH[k]);
  const x64 = /amd64|x86_64|x64/i;
  const fx = k => assets.find(a => MATCH[k](a) && x64.test(a.name)) || f(k);   // prefer the x86_64 package
  const out = {windows:f('windows'), android:f('android'), macArm:f('macArm'), macIntel:f('macIntel'), deb:fx('deb'), rpm:fx('rpm')};
  const pkgs = assets.filter(a => /\.pkg$/i.test(a.name));
  if (pkgs.length === 1) { out.macArm = out.macArm || pkgs[0]; out.macIntel = out.macIntel || pkgs[0]; }
  Object.keys(out).forEach(k => out[k] || delete out[k]);
  return out;
}

async function loadRelease(repo){
  const KEY = 'dp_latest_release_v3:' + repo;
  try {
    const c = JSON.parse(sessionStorage.getItem(KEY) || 'null');
    if (c && Date.now() - c.at < 10 * 60 * 1000) return c.data;
  } catch(e) { console.warn('release cache read failed', e); }
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=10`, {headers:{Accept:'application/vnd.github+json'}});
    if (!r.ok) throw new Error(r.status);
    const j = (await r.json()).find(x => !x.draft);      // newest release, pre-releases included
    if (!j) throw new Error('no releases');
    const data = {prerelease:!!j.prerelease, tag_name:j.tag_name, html_url:j.html_url, published_at:j.published_at,
                  assets:(j.assets || []).map(a => ({name:a.name, size:a.size, digest:a.digest || '', browser_download_url:a.browser_download_url}))};
    try { sessionStorage.setItem(KEY, JSON.stringify({at:Date.now(), data})); } catch(e) { console.warn('release cache write failed', e); }
    return data;
  } catch(e) { console.warn('release lookup failed, using fallback links', e); return null; }
}

render();

if (OS === 'mac' && navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
  navigator.userAgentData.getHighEntropyValues(['architecture']).then(v => {
    arch = v.architecture === 'arm' ? 'arm' : v.architecture === 'x86' ? 'x86' : null;
    render();
  }).catch(e => console.warn('arch detection failed', e));
}

Promise.all([loadRelease(REPO), loadRelease(ANDROID_REPO)]).then(([pc, an]) => {
  if (!pc && !an) return;
  release = pc;
  androidRelease = an;
  found = {...FALLBACK, ...pickAssets(pc ? pc.assets || [] : []), ...(an ? {android: pickAssets(an.assets || []).android || FALLBACK.android} : {})};
  applyAssets();
});
</script>
